  # ---------------------------------------------------------------------------
  # The server binary's own pins. 13.1.5 links apache/thrift at a 2026-04-29
  # pseudo-version (CVE-2026-43871, fixed 0.24.0) and grpc v1.82.1
  # (CVE-2026-84304, fixed 1.83.1). Avoidance is not available: both sit inside
  # bin/grafana. Remediation is closed to us: a repackaged tarball has no bump
  # lane, and Renovate is already on the newest release. Fixed upstream on main
  # for thrift (0.24.0); grpc on main is 1.83.0, one patch short. One issue for
  # both, grafana/grafana#131921, drafted in upstream/ first.
  #
  # Reachability is NOT claimed. Neither advisory has a golang/vulndb report
  # (checked through GO-2026-6355), so govulncheck cannot see them at all, which
  # Req 6.16 treats as unmeasured. Context, not measurement: the default
  # [grpc_server] binds 127.0.0.1:10000 and Jaeger tracing is off unless
  # configured. Ninety-day HIGH ceiling, aligned to the zipkin re-decision date.
  - id: CVE-2026-43871
    purls: ["pkg:golang/github.com/apache/thrift"]
    paths: ["usr/share/grafana/bin/grafana"]
    treatment: transfer
    owner: mm-weber
    issue: "https://github.com/grafana/grafana/issues/131921"
    ref: "LOG.md#transfer-the-server-binarys-own-pins-thrift-and-grpc-grafanagrafana131921"
    blocked: "avoidance is not available, the module is linked into
              bin/grafana. Remediation is closed to us: we repackage the release
              tarball and there is no fetch-phase bump for a prebuilt binary.
              Fixed on grafana main (thrift v0.24.0) and not yet in a 13.x
              release; 13.1.5, the newest, still links the April pseudo-version"
    statement: "transfer: waiting on a grafana release carrying apache/thrift 0.24.0 (grafana/grafana#131921)"
    decided_at: 2026-09-03
    expired_at: 2026-11-02

  - id: CVE-2026-84304
    purls: ["pkg:golang/google.golang.org/grpc"]
    paths: ["usr/share/grafana/bin/grafana"]
