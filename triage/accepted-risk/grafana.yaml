# Time-boxed risk decisions for the grafana image (Req 6.7-6.12, 6.23-6.27).
#
# A native Trivy ignorefile, handed to the same scan as --ignorefile. It answers
# "what are we doing about it?", never "does this apply?" — that second question
# is VEX, and it lives in triage/vex/ and is published with the image. Nothing
# here is ever attested (Req 6.8).
#
# The filename is the image scope; `paths:` is the binary scope. Both matter:
# one file per image stops grafana covering cert-manager, and one entry per
# binary stops one plugin's upstream covering another's (Req 6.23).
#
# Globs, not exact paths. The bundled plugin binaries carry an arch suffix, and
# a path matching nothing is silent in Trivy — no warning, exit 0, nothing
# suppressed. See docs in triage/README.md and the measurements in
# triage/upstream/checks/trivy-paths-scoping.sh.
#
# decided_at is the decision clock's start (Req 6.7): expired_at may run at
# most the policy ceiling for the finding's tier from it (Req 6.11, 6.50).
# The twelve entries below were decided on 2026-09-03, the 13.1.5 session that
# rewrote this file (task 10.1 introduced the field the day before).
vulnerabilities:
  # ---------------------------------------------------------------------------
  # The bundled zipkin plugin, third round. Grafana 13.1.5 ships zipkin v12.4.6
  # (built 2026-08-13 with go1.26.4, grpc v1.82.1) while the plugin's own
  # v12.4.7 (2026-08-27) is built with go1.26.7 and grpc v1.83.1 and clears every
  # finding below. The fix exists and is released; what is missing is Grafana
  # bundling it. Same tracker as the earlier rounds (#94), one re-decision date.
  #
  # Reachability is NOT claimed: this binary is stripped, so govulncheck stops at
  # module level, which Req 6.16 treats as unmeasured. Transfer is the honest
  # reading of an unmeasured finding whose fix someone else owns.
  #
  # The eight stdlib entries name CVEs that were x/net findings in 13.1.3's
  # zipkin build (v12.4.5) and are stdlib findings in this one; the purl moved,
  # so the old entries stopped matching and are retired below, not carried.
  - id: CVE-2026-39822
    purls: ["pkg:golang/stdlib"]
    paths: ["usr/share/grafana/data/plugins-bundled/zipkin/*"]
    treatment: transfer
    owner: mm-weber
    issue: "https://github.com/grafana/grafana-zipkin-datasource/issues/94"
    ref: "LOG.md#transfer-the-zipkin-plugin-again-nine-findings-one-stale-bundle"
    blocked: "avoidance is available and declined: dropping
              plugins-bundled/zipkin/ removes the datasource and the image stops
              being a drop-in Grafana. Remediation is closed to us, we repackage
              a prebuilt tarball. The exit is now visible: v12.4.7 is built with
              go1.26.7, past the go1.26.5 fix; 13.1.5 bundled v12.4.6"
    statement: "transfer: waiting on a grafana release that bundles grafana-zipkin-datasource v12.4.7+"
    decided_at: 2026-09-03
    expired_at: 2026-11-02

