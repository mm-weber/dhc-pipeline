# Time-boxed risk decisions for the grafana image (Req 6.7-6.12, 6.23-6.27).
#
# A native Trivy ignorefile, handed to the same scan as --ignorefile. It answers
# "what are we doing about it?", never "does this apply?" — that second question
# is VEX, and it lives in triage/vex/. Every unexpired entry here is published in
# the image's OpenVEX document as an `affected` statement, never as not_affected
# or fixed (Req 6.8, 6.38); it suppresses nothing beyond this scan, and it
# expires.
#
# The filename is the image scope; `paths:` is the binary scope. Both matter:
# one file per image stops grafana covering cert-manager, and one entry per
# binary stops one plugin's upstream covering another's (Req 6.23).
#
# Globs, not exact paths. The bundled plugin binaries carry an arch suffix, and
# a path matching nothing is silent in Trivy — no warning, exit 0, nothing
# suppressed. See docs in triage/README.md and the measurements in
# triage/upstream/checks/trivy-paths-scoping.sh.
#
# decided_at is the decision clock's start (Req 6.7): expired_at may run at
# most the policy ceiling for the finding's tier from it (Req 6.11, 6.50).
# The twelve entries decided on 2026-09-03 (the 13.1.5 session that rewrote this
# file) were retired on 2026-10-19: their findings left the supported digest with
# 13.1.7 on 2026-10-06 (triage/LOG.md 2026-10-19). The nine below were decided
# on 2026-10-13.
