  # three binaries, four decisions, all transfer, one re-decision date. Every
  # claim below was measured on the published amd64 image (sha256:6656a754…)
  # with go version -m, go tool nm for the server and the pclntab read with
  # debug/gosym for the two stripped plugins; triage/LOG.md 2026-10-13 holds
