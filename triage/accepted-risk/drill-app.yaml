# Time-boxed risk decisions for the drill-app image (Req 6.7-6.12), the
# live-drill fixture of task 16.2: a purposely vulnerable copy of hardened-app
# that nothing installs. Every entry here is a finding the drill carries on
# purpose, decided one at a time on the gate's evidence (triage/LOG.md
# 2026-10-18). The HIGH, CVE-2025-30204, was re-decided to one day by drill
# 16.3 (2026-10-25), lapsed on 2026-10-26 and left this file on 2026-10-27
# with drill 16.4 (LOG 2026-10-26): it stays undecided for drill 16.5, and
# drills 16.6 and 16.9 fix and release-gate what remains in turn.
#
# A native Trivy ignorefile, handed to the same scan as --ignorefile; every
# unexpired entry is published in the image's OpenVEX document as an `affected`
# statement, never as not_affected or fixed (Req 6.8, 6.38). decided_at starts
# the ceiling clock (Req 6.7, 6.50): 30 days for a CRITICAL, 90 for a HIGH, 14
# for anything CISA lists as exploited. purls are versionless, as in the other
# files of this lane; paths name the one binary.
vulnerabilities:
  - id: CVE-2017-20146
    purls: ["pkg:golang/github.com/gorilla/handlers"]
    paths: ["usr/local/bin/drill-app"]
    treatment: accept
    owner: mm-weber
    ref: "LOG.md#accept-the-drills-critical-gorillahandlers-cors-servehttp-reachable-by-design"
    blocked: "fix (1.3.0) and avoidance (drop the CORS middleware) are available
              and declined on purpose: the finding is the drill's reason to exist
              (task 16.2) and its removal is drill 16.6; not_affected is
              forbidden, govulncheck reaches ServeHTTP in the binary (Req 6.14);
              transfer has no owner but the owner"
    statement: "accept: live-drill fixture, never installed; the finding is the drill (task 16.2), fixed by drill 16.6"
    decided_at: 2026-10-18
    expired_at: 2026-11-17
