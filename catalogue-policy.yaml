# catalogue-policy.yaml: the one committed home of every declared value
# (Req 7.7). Workflows read the release switches at run time; the
# verification section is the source scripts/render-verification.sh renders
# policies/verify-catalogue-images.yaml and the consumer snippets from
# (Req 7.8), drift-checked in validate (Req 7.9); the workflows section is
# what scripts/lint-workflow-policy.sh holds every literal schedule cron and
# permissions block against (Req 7.10). Every value here is a fork switch.

release:
  # Req 2.21 reads enabled; Req 2.4 binds the disabled branch (images stay
  # private). Flipped true at the 2026-08-13 public release.
  public: true
  # Req 2.12/2.13: off = an uncovered finding releases as under_investigation;
  # on = sign nothing, tag nothing, red run.
  fail_closed: false
  # Req 2.15/2.17: on-change discards a scheduled rebuild whose package set
  # equals the published one; always publishes every rebuild.
  publish_policy: on-change
  # Req 2.14's daily rebuild cron; task 9.2 wires it into build.yml as the
  # literal GitHub requires, and lint-workflow-policy keeps the two equal.
  # Before the 06:17 rescan so the rescan sees fresh digests.
  schedule: &build_cron "47 4 * * *"
  # Req 7.7 admitted platforms. arm64 restored by task 9.3 (absorbing 8.3):
  # the release-time scan covers every platform manifest of the pushed digest
  # and the rescan scans every platform manifest of every tag-referenced
  # digest by its own digest, so no admitted platform goes unscanned.
  platforms:
    - linux/amd64
    - linux/arm64

# Req 1.13 (task 14.1): the active set, each definition directory under
# image/ this catalogue builds, tracks, tests and publishes. It is the sole
# source of candidates for the build and test matrices and the tracking
# scope (Req 1.14; the matrices read it from task 14.2 on, the probe lint
# from 14.3), and scripts/definition-lib.sh's active_definitions is the one
# reader: an entry naming no image/<name>/image.yaml, a duplicate, or an
# empty list is refused by name rather than read as "nothing to do".
# Deactivating a definition means removing its line, and only that: no new
# digest is pushed and no new tag applied for it (Req 1.15), a bump PR
# touching it fails validation (Req 1.16), while its already-published tags
# keep every tag-driven plane (enumeration, daily scans, attestations,
# issues over its current tags) until retention retires them; the directory
# stays, the reference demonstrates the switch. The reference instance
# activates everything, grafana's repackaged tarball included (design
# Decision 11). A fork lists what it stands behind.
active_set:
  - hardened-app
  - cert-manager-controller
  - cert-manager-webhook
  - cert-manager-cainjector
  - grafana
  - valkey
  - valkey-compat

verification:
  # The registry namespace the four registry criteria bind through (Req 2.2,
  # 2.7, 2.21, 2.23): build.yml refuses a definition publishing outside it,
  # check-visibility.sh probes under it, and the two Kyverno policies
  # (verify-catalogue-images, restrict-registries) render their image globs
  # from it. Placed inside this section because the rendering needs it for
  # the imageReferences glob (review 4.7; task 14.1 records the placement).
  # policies/tests/resources.yaml names the reference namespace literally,
  # the one fixture a fork edits together with this value.
  registry: ghcr.io/mm-weber/dhc
  issuer: https://token.actions.githubusercontent.com
  # Roles are attestor lists a fork extends; no role is widened (Req 2.23).
  roles:
    releaser:
      identity: https://github.com/mm-weber/dhc-pipeline/.github/workflows/build.yml@refs/heads/main
      attests: [spdxjson, cyclonedx, vuln, openvex]
    re-attester:
      identity: https://github.com/mm-weber/dhc-pipeline/.github/workflows/rescan.yml@refs/heads/main
      attests: [openvex, vuln]
  # What the rendered policy demands on every admitted image (Req 2.23): the
  # signature and SPDX SBOM solely from the releaser; OpenVEX from either role.
  required:
    signature: releaser
    attestations:
      spdxjson: [releaser]
      openvex: [releaser, re-attester]
  # Req 2.24's must-reject control for the daily proof (task 9.6): a digest
  # under a catalogue repository (so imageReferences match it) that carries
  # no signature. The amd64 child manifest of grafana:13.0.4-alpine3.23,
  # whose index was signed alone by the pre-9.1 path; it persists as long as
  # that superseded index does. The successor mints its own (task 12.1).
  control: ghcr.io/mm-weber/dhc/grafana@sha256:46607ae250514e845150142fb10ec1941891684acd0cbd8ea3cc66c202153d01

# Req 6.49 (task 10.1): the decision aperture and the clocks. Every value is
# a fork switch; scripts/triage-policy.sh is the one reader, so the lint,
# both scan arms, the exception tiering and the issue filer all follow an
# edit here. Durations are whole days (the exception schema carries dates).
triage:
  # Severities that require a recorded decision, in rank order (Req 6.1,
  # 6.3, 2.8, 2.22): the scanners' --severity and the issue filer's ranking.
  # A fork widens the list; every entry needs a ceiling below.
  aperture: [CRITICAL, HIGH]
  # How long an accepted-risk exception may run from its decision date, per
  # severity of the finding it covers (Req 6.50, 6.51); the largest is the
  # outer bound the lint enforces on every entry (Req 6.11).
  ceilings:
    CRITICAL: 30d
    HIGH: 90d
  # A finding listed in CISA KEV is being exploited: its exception ceiling,
  # whatever the severity (Req 6.50).
  kev_ceiling: 14d
  # The rescan reports every exception lapsing within this window (Req 6.10).
  expiry_warning: 14d
  # The KEV catalogue both arms fetch; an outage fails the pull request and
  # the rescan by name rather than evaluating without it (Req 6.59, 6.60).
  kev_feed: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
  # The labels the rescan closes cve issues with, one per evidence grade
  # (task 10.6, Req 6.56): fixed and removed on the attested SBOMs,
  # not_affected and accepted on a covering statement or exception, absent
  # when nothing proves more. Design decision 7 lists them as a fork switch.
  resolved_labels:
    fixed: {name: "resolved:fixed", color: "0E8A16", description: "the attested SBOMs prove the package version bumped, or a fixed statement covers it"}
    removed: {name: "resolved:removed", color: "0E8A16", description: "the package left every supported digest's SBOM"}
    not_affected: {name: "resolved:not_affected", color: "1D76DB", description: "a not_affected statement covers it on every supported digest listing it"}
    accepted: {name: "resolved:accepted", color: "FBCA04", description: "an unexpired accepted-risk exception covers it on every supported digest listing it"}
    absent: {name: "resolved:absent", color: "C5DEF5", description: "absent from every supported digest's report, no SBOM proof of a bump"}
  # The support statement (requirements.md, Terms): the supported set is the
  # digests each definition's current `tags:` reference. A superseded
  # tag-referenced digest keeps its daily scans and attestations and holds no
  # issues, because a frozen digest's findings accrue by design. A fork widens
  # the supported set by listing more tags in its definitions.
  support:
    supported_set: "the digests each definition's current tags: reference"
    superseded: "scanned and attested daily; outside issue scope"

# Req 9.11 (task 13.4): the VEX consumers, a declared list with exactly one
# authoritative. The authoritative consumer is the one both scan arms gate
# on and the one the daily smoke test asserts suppressions in; every other
# listed consumer feeds the VEX portability block (Req 9.12), informational:
# for each statement the authoritative scanner suppressed, whether the
# equivalent finding was suppressed there, divergences named. Each consumer
# is an adapter in scripts/vex-consumer.sh emitting one normalised shape
# (vulnerability, purl, suppressed). scripts/triage-policy.sh reads this.
# A fork adds a consumer here and an adapter case there (Docker Scout is
# the example the review named: credentials, a third pinned CLI); the
# `gating` switch, off here, is what a fork flips to fail a run on a
# divergence (design Decision 10's rejected-for-now option).
consumers:
  list:
    - name: trivy
      authoritative: true
    - name: grype
      authoritative: false
  gating: false

# Req 7.10's declared map: schedule cron and permissions per workflow, plus
# explicit per-job permissions blocks. Jobs without an entry inherit the
# workflow default and need none.
workflows:
  build.yml:
    schedule: *build_cron # the literal trigger in build.yml, held equal here
    permissions:
      contents: read
    jobs:
      release:
        permissions:
          contents: read
          packages: write
          id-token: write
  rescan.yml:
    schedule: "17 6 * * *"
    permissions:
      contents: read
      packages: write # re-attestation pushes .att manifests (task 10.3, Req 6.42, 6.43)
      id-token: write # keyless signing as the re-attester role
      issues: write
  renovate.yml:
    schedule: "0 */4 * * *"
    permissions:
      contents: read
  validate.yml:
    schedule: null
    permissions:
      contents: read
  chart.yml:
    schedule: null
    permissions:
      contents: read
  e2e.yml:
    schedule: null
    permissions:
      contents: read
      packages: read
