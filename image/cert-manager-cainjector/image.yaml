# syntax=dhi.io/build:2-alpine3.23@sha256:b390f26e6086f4e5d806ce6ea3538b00693566e37ac865fece91d23e3b775aa3

name: cert-manager cainjector 1.21.x
image: ghcr.io/mm-weber/dhc/cert-manager-cainjector
variant: runtime
tags:
  - 1-alpine3.23
  - 1.21-alpine3.23
  - 1.21.3-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-25"
vars:
  COMMIT_SHA: 925c22283de556172d48d96a165dc2fa27f7a6ff
  GOLANG_REFERENCE: dhi.io/golang:1.27.4-alpine3.23-dev@sha256:23049614935a9ea3e27279104524bbd6aca1872b9595afe053909e4c1439c525
  SEMVER_MAJOR_MINOR_VERSION: "1.21"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.21.3
  VERSION: 1.21.3
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - tzdata
  builds:
    - name: cert-manager-cainjector
      uses: dhi.io/golang:1.27.4-alpine3.23-dev@sha256:23049614935a9ea3e27279104524bbd6aca1872b9595afe053909e4c1439c525
      work-dir: /go/src/github.com/cert-manager/cert-manager
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - ca-certificates-bundle
        files:
          - url: git+https://github.com/cert-manager/cert-manager.git#v1.21.3
            # authenticity: signed-tag, verified v1.21.3 (GitHub verification: valid), 2026-11-10
            checksum: 925c22283de556172d48d96a165dc2fa27f7a6ff
            path: /go/src/github.com/cert-manager/cert-manager
            spdx:
              name: cert-manager-cainjector
              version: 1.21.3
              packages:
                - name: cert-manager-cainjector
                  purl: pkg:golang/github.com/cert-manager/cert-manager@1.21.3
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        # The between-releases fix lane (docs/CONVENTIONS.md M10). Its first
        # use here bumped golang.org/x/crypto (CVE-2026-56854) and, in
        # controller and webhook, google.golang.org/grpc (CVE-2026-84304) from
        # 2026-09-02 until v1.21.2 carried both fixes (triage/LOG.md
        # 2026-09-18). Reopened 2026-10-12 for CVE-2026-78669: v1.21.2's
        # go.mod pinned golang.org/x/net v0.58.0, fixed in v0.60.0, which
        # upstream merged on master and release-1.21 on 2026-10-09 with no
        # release carrying it yet. Minimal version selection makes the pin a
        # floor a later upstream requirement wins over. Exit condition: drop
        # the step when an upstream release pins x/net v0.62.0 or newer, the
        # Renovate release PR being the reminder (triage/LOG.md 2026-10-12).
        # Moved to v0.62.0 on 2026-11-09 for CVE-2026-78661, the same package
        # again and the version Renovate offered in its own pull request; both
        # findings leave with this one pin (triage/LOG.md 2026-11-09).
        # v1.21.3's go.mod pins x/net v0.60.0 (read 2026-11-10), which carries
        # CVE-2026-78669's fix but not CVE-2026-78661's, so the exit condition
        # is still unmet and the pin stays for the second finding
        # (triage/LOG.md 2026-11-10).
        - name: bump x/net (CVE-2026-78669, CVE-2026-78661)
          uses: go/bump@v2
          work-dir: /go/src/github.com/cert-manager/cert-manager/cmd/cainjector
          with:
            deps:
              # renovate: datasource=go depName=golang.org/x/net
              - golang.org/x/net@v0.62.0
            download: true
            tidy: true
        # No test step: cmd/* submodules share the monorepo's suite, which
        # needs upstream's make tooling; functional verification is the e2e
        # suite's job (Req 5.5). Upstream ldflags recipe: make/00_mod.mk.
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/cert-manager/cert-manager/cmd/cainjector
          with:
            ldflags:
              - -w
              - -s
              - -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=v1.21.3
              - -X github.com/cert-manager/cert-manager/pkg/util.AppGitCommit=925c22283de556172d48d96a165dc2fa27f7a6ff
            output: ${target.dir}/usr/local/bin/cert-manager-cainjector
            packages: .
      outputs:
        - source: ${target.dir}/usr/local/bin/cert-manager-cainjector
          target: /usr/local/bin/cert-manager-cainjector
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/cert-manager-cainjector
          target: /opt/docker/sbom/cert-manager-cainjector
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: dhc hardened images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: dhc hardened images/Alpine Linux v3.23
  home-url: https://github.com/mm-weber/dhc-pipeline
  bug-report-url: https://github.com/mm-weber/dhc-pipeline/issues
annotations:
  org.opencontainers.image.description: Minimal cert-manager cainjector image
  org.opencontainers.image.source: https://github.com/mm-weber/dhc-pipeline
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/cert-manager-cainjector
