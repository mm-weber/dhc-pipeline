        # suite's job (Req 5.5). Upstream ldflags recipe: make/00_mod.mk.
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/cert-manager/cert-manager/cmd/controller
          with:
            ldflags:
              - -w
              - -s
              - -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=v1.21.2
              - -X github.com/cert-manager/cert-manager/pkg/util.AppGitCommit=922a06aa49ee4bb802db268ef72a174af70edd32
            output: ${target.dir}/usr/local/bin/cert-manager-controller
            packages: .
      outputs:
        - source: ${target.dir}/usr/local/bin/cert-manager-controller
          target: /usr/local/bin/cert-manager-controller
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/cert-manager-controller
          target: /opt/docker/sbom/cert-manager-controller
          uid: 0
          gid: 0
