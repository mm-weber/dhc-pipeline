                  purl: pkg:golang/github.com/cert-manager/cert-manager@1.21.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        # Until 1.21.2 a `go/bump@v2` step here bumped golang.org/x/crypto
        # (CVE-2026-56854) and, in controller and webhook, google.golang.org/grpc
