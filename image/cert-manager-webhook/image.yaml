# syntax=dhi.io/build:2-alpine3.23@sha256:c95f20fcbd7f1dcff9661aa7122d811378aebd436c0927ffb73feca655d3c7bc

name: cert-manager webhook 1.20.x
image: ghcr.io/mm-weber/dhc/cert-manager-webhook
variant: runtime
tags:
  - 1-alpine3.23
  - 1.21-alpine3.23
  - 1.21.0-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-25"
vars:
  COMMIT_SHA: b8f325e36f49626ba72d7efbe138c01a5e661d96
  GOLANG_REFERENCE: dhi.io/golang:1.26.5-alpine3.23-dev@sha256:e78e403fb96601ced77395843eaf3fd4763fcb43be7effcc6676d904845e4f7c
  SEMVER_MAJOR_MINOR_VERSION: "1.21"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.21.0
  VERSION: 1.21.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - tzdata
  builds:
    - name: cert-manager-webhook
      uses: dhi.io/golang:1.26.5-alpine3.23-dev@sha256:e78e403fb96601ced77395843eaf3fd4763fcb43be7effcc6676d904845e4f7c
      work-dir: /go/src/github.com/cert-manager/cert-manager
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - ca-certificates-bundle
        files:
          - url: git+https://github.com/cert-manager/cert-manager.git#v1.21.0
            checksum: b8f325e36f49626ba72d7efbe138c01a5e661d96
            path: /go/src/github.com/cert-manager/cert-manager
            spdx:
              name: cert-manager-webhook
              version: 1.21.0
              packages:
                - name: cert-manager-webhook
                  purl: pkg:golang/github.com/cert-manager/cert-manager@1.21.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        # CVE surgery between upstream releases (docs/concepts.md, Req 6.5).
        # cert-manager v1.21.0 resolves google.golang.org/grpc v1.81.1, which
        # carries GHSA-hrxh-6v49-42gf (issue #28). Upstream has not tagged a
        # release pinning the fix, and forking is maintenance we do not want, so
        # the definition overlays the patched dependency at build time: the
        # shipped artifact is "cert-manager v1.21.0 with grpc v1.82.1", declared
        # in reviewable YAML and reflected in the SBOM.
        #
        # `runs:` rather than a bump action: the catalog's Go dependency-bump
        # action is not primary-verified in our research notes (data/
        # docker_internal_build.md lists only go/build), and `go get` is the
        # standard tool for exactly this. Retire this step when an upstream
        # release resolves >= v1.82.1 — Renovate moves the source ref, this
        # becomes a no-op, and it should be deleted in that same PR.
        - name: patch grpc (GHSA-hrxh-6v49-42gf)
          work-dir: /go/src/github.com/cert-manager/cert-manager/cmd/webhook
          runs: |
            set -eux -o pipefail
            go get google.golang.org/grpc@v1.82.1
            go list -m google.golang.org/grpc
        # No test step: cmd/* submodules share the monorepo's suite, which
        # needs upstream's make tooling; functional verification is the e2e
        # suite's job (Req 5.5). Upstream ldflags recipe: make/00_mod.mk.
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/cert-manager/cert-manager/cmd/webhook
          with:
            ldflags:
              - -w
              - -s
              - -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=v1.21.0
              - -X github.com/cert-manager/cert-manager/pkg/util.AppGitCommit=b8f325e36f49626ba72d7efbe138c01a5e661d96
            output: ${target.dir}/usr/local/bin/cert-manager-webhook
            packages: .
      outputs:
        - source: ${target.dir}/usr/local/bin/cert-manager-webhook
          target: /usr/local/bin/cert-manager-webhook
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/cert-manager-webhook
          target: /opt/docker/sbom/cert-manager-webhook
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: dhc hardened images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: dhc hardened images/Alpine Linux v3.23
  home-url: https://github.com/mm-weber/dhc-pipeline
  bug-report-url: https://github.com/mm-weber/dhc-pipeline/issues
annotations:
  org.opencontainers.image.description: Minimal cert-manager webhook image
  org.opencontainers.image.source: https://github.com/mm-weber/dhc-pipeline
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/cert-manager-webhook
