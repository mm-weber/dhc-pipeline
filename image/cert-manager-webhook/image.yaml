  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - tzdata
  builds:
    - name: cert-manager-webhook
      uses: dhi.io/golang:1.27.3-alpine3.23-dev@sha256:568da883960cf1ef92931413a4b5f8c424eb05b1b41384343ec54f01f404d721
      work-dir: /go/src/github.com/cert-manager/cert-manager
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - ca-certificates-bundle
        files:
          - url: git+https://github.com/cert-manager/cert-manager.git#v1.21.2
            # authenticity: signed-tag, verified v1.21.2 (GitHub verification: valid), 2026-09-18
            checksum: 922a06aa49ee4bb802db268ef72a174af70edd32
            path: /go/src/github.com/cert-manager/cert-manager
            spdx:
              name: cert-manager-webhook
              version: 1.21.2
              packages:
                - name: cert-manager-webhook
                  purl: pkg:golang/github.com/cert-manager/cert-manager@1.21.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        # The between-releases fix lane (docs/CONVENTIONS.md M10). Its first
        # use here bumped golang.org/x/crypto (CVE-2026-56854) and, in
        # controller and webhook, google.golang.org/grpc (CVE-2026-84304) from
        # 2026-09-02 until v1.21.2 carried both fixes (triage/LOG.md
        # 2026-09-18). Reopened 2026-10-12 for CVE-2026-78669: v1.21.2's
        # go.mod pins golang.org/x/net v0.58.0, fixed in v0.60.0, which
        # upstream merged on master and release-1.21 on 2026-10-09 with no
        # release carrying it yet. Minimal version selection makes the pin a
        # floor a later upstream requirement wins over. Exit condition: drop
        # the step when an upstream release pins x/net v0.60.0 or newer, the
        # Renovate release PR being the reminder (triage/LOG.md 2026-10-12).
        - name: bump x/net (CVE-2026-78669)
          uses: go/bump@v2
          work-dir: /go/src/github.com/cert-manager/cert-manager/cmd/webhook
          with:
            deps:
              # renovate: datasource=go depName=golang.org/x/net
              - golang.org/x/net@v0.61.0
            download: true
            tidy: true
        # No test step: cmd/* submodules share the monorepo's suite, which
        # needs upstream's make tooling; functional verification is the e2e
        # suite's job (Req 5.5). Upstream ldflags recipe: make/00_mod.mk.
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/cert-manager/cert-manager/cmd/webhook
          with:
            ldflags:
              - -w
              - -s
              - -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=v1.21.2
              - -X github.com/cert-manager/cert-manager/pkg/util.AppGitCommit=922a06aa49ee4bb802db268ef72a174af70edd32
            output: ${target.dir}/usr/local/bin/cert-manager-webhook
            packages: .
      outputs:
        - source: ${target.dir}/usr/local/bin/cert-manager-webhook
          target: /usr/local/bin/cert-manager-webhook
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/cert-manager-webhook
          target: /opt/docker/sbom/cert-manager-webhook
          uid: 0
          gid: 0
