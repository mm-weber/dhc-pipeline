# syntax=dhi.io/build:2-alpine3.23@sha256:96a85b5d18df1c3ec205e4efb1e66167a1d4181eb27644192d0f915cfdab99a3

name: cert-manager webhook 1.21.x
image: ghcr.io/mm-weber/dhc/cert-manager-webhook
variant: runtime
tags:
  - 1-alpine3.23
  - 1.21-alpine3.23
  - 1.21.1-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-25"
vars:
  COMMIT_SHA: 24e33194fb39488eff2bbf10c6dc640f407cad44
  GOLANG_REFERENCE: dhi.io/golang:1.27.0-alpine3.23-dev@sha256:517245c50e9fbacc29da5fe29ceea42b03e4883395b8de3828ab7acda3ca4ab8
  SEMVER_MAJOR_MINOR_VERSION: "1.21"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.21.1
  VERSION: 1.21.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - tzdata
  builds:
    - name: cert-manager-webhook
      uses: dhi.io/golang:1.27.0-alpine3.23-dev@sha256:517245c50e9fbacc29da5fe29ceea42b03e4883395b8de3828ab7acda3ca4ab8
      work-dir: /go/src/github.com/cert-manager/cert-manager
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - ca-certificates-bundle
        files:
          - url: git+https://github.com/cert-manager/cert-manager.git#v1.21.1
            checksum: 24e33194fb39488eff2bbf10c6dc640f407cad44
            path: /go/src/github.com/cert-manager/cert-manager
            spdx:
              name: cert-manager-webhook
              version: 1.21.1
              packages:
                - name: cert-manager-webhook
                  purl: pkg:golang/github.com/cert-manager/cert-manager@1.21.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        # CVE-2026-56854: golang.org/x/crypto below 0.55.0 (GO-2026-6303).
        # Upstream 1.21.1 pins 0.53.0 and no release carries the fix, so the
        # module is bumped in the frontend's FETCH phase — the only phase with
        # egress: a `runs:` go get was tried on 2026-07-26 and the sandbox
        # refused it, by design (triage/LOG.md, GHSA-hrxh-6v49-42gf). Schema
        # primary-verified against docker-hardened-images/catalog, where etcd
        # bumps x/crypto and grpc the same way. Bumped in the cmd submodule
        # because the binary resolves through ITS go.mod, and MVS makes this a
        # floor, not a ceiling: a later upstream requirement wins. DROP this
        # step when upstream's go.mod reaches 0.55.0+ (triage/LOG.md
        # 2026-09-02).
        - name: bump x/crypto (CVE-2026-56854)
          uses: go/bump@v2
          work-dir: /go/src/github.com/cert-manager/cert-manager/cmd/webhook
          with:
            deps:
              # renovate: datasource=go depName=golang.org/x/crypto
              - golang.org/x/crypto@v0.56.0
              # CVE-2026-84304, fixed in 1.83.1; upstream pins 1.82.1 and no
              # release carries the fix. Same lane, same exit condition
              # (triage/LOG.md 2026-09-02). cainjector carries no grpc.
              # renovate: datasource=go depName=google.golang.org/grpc
              - google.golang.org/grpc@v1.83.1
            download: true
            tidy: true
        # No test step: cmd/* submodules share the monorepo's suite, which
        # needs upstream's make tooling; functional verification is the e2e
        # suite's job (Req 5.5). Upstream ldflags recipe: make/00_mod.mk.
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/cert-manager/cert-manager/cmd/webhook
          with:
            ldflags:
              - -w
              - -s
              - -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=v1.21.1
              - -X github.com/cert-manager/cert-manager/pkg/util.AppGitCommit=24e33194fb39488eff2bbf10c6dc640f407cad44
            output: ${target.dir}/usr/local/bin/cert-manager-webhook
            packages: .
      outputs:
        - source: ${target.dir}/usr/local/bin/cert-manager-webhook
          target: /usr/local/bin/cert-manager-webhook
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/cert-manager-webhook
          target: /opt/docker/sbom/cert-manager-webhook
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: dhc hardened images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: dhc hardened images/Alpine Linux v3.23
  home-url: https://github.com/mm-weber/dhc-pipeline
  bug-report-url: https://github.com/mm-weber/dhc-pipeline/issues
annotations:
  org.opencontainers.image.description: Minimal cert-manager webhook image
  org.opencontainers.image.source: https://github.com/mm-weber/dhc-pipeline
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/cert-manager-webhook
