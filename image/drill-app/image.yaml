vars:
  COMMIT_SHA: b7868d7a6f41a8dc2181bd874776cf4976d11591
  GOLANG_REFERENCE: dhi.io/golang:1.27.3-alpine3.23-dev@sha256:568da883960cf1ef92931413a4b5f8c424eb05b1b41384343ec54f01f404d721
  SEMVER_MAJOR_MINOR_VERSION: "0.1"
  SEMVER_MAJOR_VERSION: "0"
