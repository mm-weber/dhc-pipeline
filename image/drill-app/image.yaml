# syntax=dhi.io/build:2-alpine3.23@sha256:77e2f0a15efd56d89b33588d1e777c46f39876ed9c9a222bfc11c9dd0d875948

name: Drill App 0.1.x (live-drill fixture)
image: ghcr.io/mm-weber/dhc/drill-app
variant: runtime
tags:
  - 0-alpine3.23
  - 0.1-alpine3.23
  - 0.1.0-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-15"
vars:
  COMMIT_SHA: b7868d7a6f41a8dc2181bd874776cf4976d11591
  GOLANG_REFERENCE: dhi.io/golang:1.27.3-alpine3.23-dev@sha256:568da883960cf1ef92931413a4b5f8c424eb05b1b41384343ec54f01f404d721
  SEMVER_MAJOR_MINOR_VERSION: "0.1"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.1.0
  VERSION: 0.1.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
  builds:
    - name: drill-app
      uses: dhi.io/golang:1.27.3-alpine3.23-dev@sha256:568da883960cf1ef92931413a4b5f8c424eb05b1b41384343ec54f01f404d721
      work-dir: /go/src/github.com/mm-weber/drill-app
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - ca-certificates-bundle
        files:
          - url: git+https://github.com/mm-weber/drill-app.git#v0.1.0
            # authenticity: signed-commit, verified v0.1.0 at b7868d7a6f41 (GitHub verification: valid), 2026-10-17
            checksum: b7868d7a6f41a8dc2181bd874776cf4976d11591
            path: /go/src/github.com/mm-weber/drill-app
            spdx:
              name: drill-app
              version: 0.1.0
              packages:
                - name: drill-app
                  purl: pkg:golang/github.com/mm-weber/drill-app@0.1.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        # Drill 16.6 (track drill-fix_20261028, Req 6.5, register row M10):
        # the catalogue's fix lane on the drill's two findings, decided
        # 2026-10-18 and lapsed 2026-10-26 (triage/LOG.md). The source keeps
        # its vulnerable go.mod on purpose; the bump happens here, in the
        # fetch phase, the cert-manager shape. Drill 16.7 (track
        # drill-regression_20261029) removed the golang-jwt bump on
        # 2026-10-29 to bring CVE-2025-30204 back, accepted for one day in
        # triage/accepted-risk/drill-app.yaml; the handlers bump stays.
        - name: bump gorilla/handlers (CVE-2017-20146)
          uses: go/bump@v2
          work-dir: /go/src/github.com/mm-weber/drill-app
          with:
            deps:
              # renovate: datasource=go depName=github.com/gorilla/handlers
              - github.com/gorilla/handlers@v1.3.0
            download: true
            tidy: true
        # No test step: the build sandbox has no egress (docs/CONVENTIONS.md,
        # measured 2026-07-26), so `go test ./...` in a `runs:` step cannot
        # fetch the drill's two modules, which hardened-app's copy of this step
        # never needs; `go/build@v1` fetches them itself (the cert-manager
        # precedent). The drill's unit tests run in its own repository's CI,
        # and nothing installs this image (task 16.2).
        - name: build
          uses: go/build@v1
          with:
            ldflags:
              - -w
              - -X main.version=0.1.0
            output: ${target.dir}/usr/local/bin/drill-app
            packages: .
      outputs:
        - source: ${target.dir}/usr/local/bin/drill-app
          target: /usr/local/bin/drill-app
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/drill-app
          target: /opt/docker/sbom/drill-app
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: dhc hardened images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: dhc hardened images/Alpine Linux v3.23
  home-url: https://github.com/mm-weber/dhc-pipeline
  bug-report-url: https://github.com/mm-weber/dhc-pipeline/issues
annotations:
  org.opencontainers.image.description: >-
    Live-drill fixture: a purposely vulnerable copy of hardened-app,
    never installed by design (task 16.2). DO NOT USE.
  org.opencontainers.image.source: https://github.com/mm-weber/dhc-pipeline
  org.opencontainers.image.licenses: MIT
entrypoint:
  - drill-app
