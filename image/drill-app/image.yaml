  VERSION: 0.1.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
  builds:
    - name: drill-app
      uses: dhi.io/golang:1.27.3-alpine3.23-dev@sha256:568da883960cf1ef92931413a4b5f8c424eb05b1b41384343ec54f01f404d721
      work-dir: /go/src/github.com/mm-weber/drill-app
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - ca-certificates-bundle
        files:
          - url: git+https://github.com/mm-weber/drill-app.git#v0.1.0
            # authenticity: signed-commit, verified v0.1.0 at b7868d7a6f41 (GitHub verification: valid), 2026-10-17
            checksum: b7868d7a6f41a8dc2181bd874776cf4976d11591
            path: /go/src/github.com/mm-weber/drill-app
            spdx:
              name: drill-app
              version: 0.1.0
              packages:
                - name: drill-app
                  purl: pkg:golang/github.com/mm-weber/drill-app@0.1.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        # No test step: the build sandbox has no egress (docs/CONVENTIONS.md,
        # measured 2026-07-26), so `go test ./...` in a `runs:` step cannot
        # fetch the drill's two modules, which hardened-app's copy of this step
        # never needs; `go/build@v1` fetches them itself (the cert-manager
        # precedent). The drill's unit tests run in its own repository's CI,
        # and nothing installs this image (task 16.2).
        - name: build
          uses: go/build@v1
          with:
            ldflags:
              - -w
              - -X main.version=0.1.0
            output: ${target.dir}/usr/local/bin/drill-app
            packages: .
      outputs:
        - source: ${target.dir}/usr/local/bin/drill-app
          target: /usr/local/bin/drill-app
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/drill-app
          target: /opt/docker/sbom/drill-app
          uid: 0
          gid: 0
accounts:
