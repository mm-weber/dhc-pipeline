# syntax=dhi.io/build:2-alpine3.23@sha256:15a967e8186f3de812454e17a7881bae8a8294aa2d2ecaba85418db5b57de98e

name: Grafana 13.1.x
image: ghcr.io/mm-weber/dhc/grafana
variant: runtime
tags:
  - 13-alpine3.23
  - 13.1-alpine3.23
  - 13.1.5-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-04"
vars:
  # Per-arch tarball SHA-256, from the sidecar beside the PER-BUILD artifact
  # (…/grafana/release/<ver>/grafana_<ver>_<build-id>_linux_<arch>.tar.gz.sha256),
  # selected by target arch the way the catalog does per-arch values — amd64
  # first, arm64 second. Pinned; verified in-pipeline for the arch being built,
  # and for EVERY arch by scripts/verify-arch-pins.sh in CI.
  #
  # Not the /oss/release/grafana-<ver>.linux-<arch>.tar.gz alias. Those objects
  # are REWRITTEN about 20h after release: for the 2026-07-21 batch all four
  # were replaced on 2026-07-22 05:36-05:42Z, changing their bytes and their
  # published checksums. Our 07-21 build provenance records the alias serving
  # the per-build digests; by 07-26 the same URLs no longer matched. Upstream
  # stays self-consistent throughout — object and sidecar are written seconds
  # apart — so nothing is detectably wrong at any single moment. It just moves.
  #
  # The build-id path has not been touched since it was written on release day,
  # and a re-cut lands at a new URL instead of overwriting this one.
  # See triage/LOG.md 2026-07-26.
  GRAFANA_SHA256: '#{ target.arch == "amd64" ? "35d3f3b93777564a95b6f2f9380340ac07b0f238e2df6ba46a106fde785d61f7" : "6d6f9a434803fcbc55a3adb344e4f6c821db70791ab47449d6d7cfc5fd60e41e" }'
  SEMVER_MAJOR_MINOR_VERSION: "13.1"
  SEMVER_MAJOR_VERSION: "13"
  SEMVER_VERSION: 13.1.5
  VERSION: 13.1.5
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - tzdata
  builds:
    # Tarball-repackage archetype: fetch the official prebuilt release,
    # verify its pinned checksum, extract onto the runtime — no compilation.
    - name: grafana
      contents:
        packages:
          - busybox
          - tar
          - ca-certificates-bundle
        files:
          - url: https://dl.grafana.com/grafana/release/13.1.5/grafana_13.1.5_33098073184_linux_${target.arch}.tar.gz
            path: ${source.dir}/grafana.tar.gz
            spdx:
              name: grafana
              version: 13.1.5
              packages:
                - name: grafana
                  purl: pkg:generic/grafana@13.1.5
                  license: AGPL-3.0
            uid: 0
            gid: 0
      pipeline:
        - name: verify checksum
          runs: |
            set -eux -o pipefail

            echo "${GRAFANA_SHA256}  ${source.dir}/grafana.tar.gz" | sha256sum -c -
        - name: extract and stage
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/grafana"
            # --strip-components=1 drops the top-level grafana-<ver>/ directory.
            tar -zxf "${source.dir}/grafana.tar.gz" --strip-components=1 -C "${target.dir}/usr/share/grafana"

            mkdir -p "${target.dir}/etc/grafana"
            cp "${target.dir}/usr/share/grafana/conf/sample.ini" "${target.dir}/etc/grafana/grafana.ini"
            cp "${target.dir}/usr/share/grafana/conf/ldap.toml" "${target.dir}/etc/grafana/ldap.toml"
      outputs:
        - source: ${target.dir}/usr/share/grafana
          target: /usr/share/grafana
          uid: 0
          gid: 0
        - source: ${target.dir}/etc/grafana
          target: /etc/grafana
          uid: 65532
          gid: 65532
        - source: /opt/docker/sbom/grafana
          target: /opt/docker/sbom/grafana
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: dhc hardened images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: dhc hardened images/Alpine Linux v3.23
  home-url: https://github.com/mm-weber/dhc-pipeline
  bug-report-url: https://github.com/mm-weber/dhc-pipeline/issues
work-dir: /var/lib/grafana
environment:
  GRAFANA_VERSION: 13.1.5
  PATH: /usr/share/grafana/bin:/usr/sbin:/sbin:/usr/bin:/bin:/usr/local/bin
# Writable-path inventory (Req 4.4 chart work): every path the runtime writes
# to gets an emptyDir mount in the chart. Owned by nonroot 65532.
paths:
  - type: directory
    path: /etc/grafana
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc/grafana/provisioning
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc/grafana/provisioning/alerting
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc/grafana/provisioning/dashboards
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc/grafana/provisioning/datasources
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc/grafana/provisioning/plugins
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/lib/grafana
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/lib/grafana/plugins
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/grafana
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /tmp
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: Minimal Grafana image (official release tarball, repackaged)
  org.opencontainers.image.source: https://github.com/mm-weber/dhc-pipeline
  org.opencontainers.image.licenses: AGPL-3.0
entrypoint:
  - grafana
  - server
  - --homepath=/usr/share/grafana
  - --config=/etc/grafana/grafana.ini
  - --packaging=docker
  - cfg:default.log.mode=console
  - cfg:default.paths.data=/var/lib/grafana
  - cfg:default.paths.logs=/var/log/grafana
  - cfg:default.paths.plugins=/var/lib/grafana/plugins
  - cfg:default.paths.provisioning=/etc/grafana/provisioning
ports:
  - 3000/tcp
