name: rescan

# Daily CVE rescan of the PUBLISHED images under the declared registry
# namespace (catalogue-policy.yaml verification.registry; Req 6.2).
# Trivy re-scans each catalogue image for HIGH/CRITICAL honouring our OpenVEX
# statements in triage/vex/. Findings that are new — not already tracked by an
# open `cve` issue — are enriched with EPSS (FIRST.org) and CISA KEV status and
# filed as one GitHub issue per CVE, listing severity, EPSS, KEV, and affected
# images (Req 6.3). A CRITICAL also gets a Grype second opinion (Req 6.6),
# mirroring the PR gate.
#
# The join/dedup/templating is the tested triage/rescan Go tool; this workflow is
# the I/O around it. GitHub Actions is the authoritative environment (Req 8.1):
# the Trivy/Grype DBs, the EPSS API, and the CISA feed are reachable here but not
# from the devcontainer. Scan/feed failures soft-fail (skip + warn) so a transient
# outage never turns the cron permanently red.

on:
  schedule:
    - cron: "17 6 * * *" # daily ~06:17 UTC, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read
  # Task 10.3 (Req 6.42, 6.43): the rescan attests today's scan reports and,
  # on change, the OpenVEX document to the published digests, replacing. That
  # is a push to the .att manifests (packages: write) signed keyless
  # (id-token: write), as the re-attester role in catalogue-policy.yaml, which
  # attests openvex and vuln only; it cannot mint a signed digest (Req 2.23).
  packages: write
  id-token: write
  issues: write # file new-CVE issues

jobs:
  rescan:
    name: rescan published images
    runs-on: ubuntu-latest
    defaults:
      run:
        # Plain bash, no injected flags (#73): the default shell is
        # `bash -e {0}`, and a script's own `set -uo pipefail` does not clear
        # that inherited -e — so the scan loop's soft-fail contract below was
        # dead code and one unresolvable image aborted the whole rescan. Every
        # step here declares its error mode with an explicit `set` line; this
        # makes those lines the whole truth.
        shell: bash {0}
    env:
      OUT: ${{ github.workspace }}/rescan-out
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: triage/rescan/go.mod
          cache: false # stdlib-only tool, no go.sum to key a cache on

      - name: log in to ghcr.io
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cosign stays on the v2 line: --replace exists there and its bundles are
      # what Trivy and Kyverno read (ADR 0003, ADR 0004). Same pin as build.yml.
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: v2.6.0
      - name: install trivy + grype + crane + kyverno + vexctl
        run: |
          set -euo pipefail
          # As the runner user into a temp dir on PATH — see build.yml. crane
          # lists the registry's tags for the enumeration (task 9.3); kyverno
          # applies the admission policy in the daily proof (task 9.6).
          mkdir -p "${RUNNER_TEMP}/bin"
          scripts/install-scanners.sh "${RUNNER_TEMP}/bin"
          scripts/install-tool.sh crane "${RUNNER_TEMP}/bin"
          scripts/install-tool.sh kyverno "${RUNNER_TEMP}/bin"
          scripts/install-tool.sh vexctl "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      # Req 2.22: every catalogue tag in every catalogue repository, resolved
      # to platform manifests. Hard-fail, unlike every scan below: the
      # enumeration IS the daily promise, and a partial one that looks
      # complete would silently shrink what the catalogue watches.
      - name: enumerate the catalogue (Req 2.22)
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          scripts/enumerate-catalogue.sh . "$OUT/enumeration.tsv"

      - name: scan every platform manifest of every tag-referenced digest
        id: scan
        run: |
          # No `set -e`: a transient scan failure must skip, not abort the
          # whole rescan (Req 6 soft-fail). The enumeration above already
          # hard-failed if the WORLD was unreadable; from here each miss is
          # one manifest, counted and named.
          set -uo pipefail
          mkdir -p "$OUT/trivy" "$OUT/trivy-superseded" "$OUT/vex"

          # One compile per tag-referenced digest, one scan per unique
          # platform manifest. Several tags share a digest by design (9, 9.1
          # and 9.1.2 usually name one build), so work is keyed by digest and
          # tags become attribution. Scans address <repo>@<manifest-digest>:
          # a digest ref needs no --platform and cannot be silently
          # downgraded to the runner's own architecture (task 8.3's
          # measurement, the reason this task exists).
          declare -A tags_of=() manifests_of=() platform_of=() status_of=()
          while IFS=$'\t' read -r repo tag digest platform manifest status; do
            key="${repo}@${digest}"
            case " ${tags_of[$key]:-} " in *" ${tag} "*) ;; *) tags_of[$key]="${tags_of[$key]:-} ${tag}" ;; esac
            mkey="${repo}@${manifest}"
            case " ${manifests_of[$key]:-} " in *" ${manifest} "*) ;; *) manifests_of[$key]="${manifests_of[$key]:-} ${manifest}" ;; esac
            platform_of[$mkey]="$platform"
            # A digest is supported if ANY tag referencing it is (Terms):
            # its findings belong in issues the moment one supported tag
            # serves it.
            [ "$status" = "supported" ] && status_of[$key]=supported
            : "${status_of[$key]:=superseded}"
          done < "$OUT/enumeration.tsv"

          scanned=0; failed=0
          for key in "${!tags_of[@]}"; do
            repo="${key%@*}"; digest="${key#*@}"
            name="${repo##*/}"
            read -r -a tags <<< "${tags_of[$key]}"
            read -r -a manifests <<< "${manifests_of[$key]}"
            d7="${digest#sha256:}"; d7="${d7:0:12}"
            vexdir="$OUT/vex/${name}__${d7}"
            report="$OUT/vex/${name}__${d7}.report.json"
            # Req 6.28-6.30, same contract as the PR gate and the release arm:
            # source is never handed to a scanner, and the compiled document
            # is stamped with the index digest AND every platform manifest
            # digest — the scan below reads <repo>@<manifest>, so Trivy's
            # product identity is the MANIFEST digest, and a document without
            # it suppresses nothing. The tags are the registry's own for this
            # digest, so a claim scoped to another release stays dropped
            # (Req 6.30). Req 6.32/6.33: every path writes a report, so
            # "compiled nothing" and "never compiled" stay distinguishable.
            COMPILE_VEX_REPORT="$report" COMPILE_VEX_MANIFEST_DIGESTS="${manifests[*]}" \
              scripts/compile-vex.sh triage/vex "$vexdir" "$name" "$digest" "${tags[@]}" || true
            outdir="$OUT/trivy"
            [ "${status_of[$key]}" = "superseded" ] && outdir="$OUT/trivy-superseded"
            for m in "${manifests[@]}"; do
              ref="${repo}@${m}"
              p="${platform_of[${repo}@${m}]}"
              out="${outdir}/${name}__${d7}__${p//\//-}.json"
              echo "::group::scan ${ref} (${p}, ${status_of[$key]}, tags:${tags_of[$key]})"
              if scripts/scan-image.sh "$ref" "$name" "$vexdir" "$out" --remote; then
                scanned=$((scanned + 1))
              else
                echo "::warning::scan failed for ${ref} (${p}) — skipped, counted"
                failed=$((failed + 1))
                rm -f "$out"
              fi
              echo "::endgroup::"
            done
          done
          echo "scanned=${scanned}" >> "$GITHUB_OUTPUT"
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"
          # Union of post-VEX HIGH/CRITICAL CVE IDs across SUPPORTED reports
          # only: a superseded digest keeps its daily scan and its artifacts,
          # and sits outside the scope of issues and clocks (Terms; its
          # findings accrue by design, the frozen-digest pattern).
          jq -r '.Results[]?.Vulnerabilities[]?.VulnerabilityID' "$OUT"/trivy/*.json 2>/dev/null \
            | grep -E '^CVE-' | sort -u > "$OUT/cves.txt" || true
          echo "distinct HIGH/CRITICAL CVEs (supported set): $(grep -c . "$OUT/cves.txt" || echo 0)"

      # Task 10.6 (Req 6.52 to 6.57): the evidence-based issue lifecycle over
      # the supported set. Every cve issue, open and closed, meets today's
      # attested scan reports, the SBOMs attested to the supported platform
      # manifests (read through verification, Req 6.58) and the merged
      # triage artifacts; the tested Go package decides what closes, with
      # which evidence-graded label, and what reopens; gh applies it. Right
      # after the scan, so the issue map the compiler stamps into today's
      # documents and the dedup the filer relies on both see the closes and
      # reopens of the same run, and nothing is filed twice (Req 6.57).
      - name: issue lifecycle, the evidence (Req 6.52 to 6.57)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT/lifecycle"
          # Every cve issue ever filed: closed ones are the reopen candidates.
          gh issue list --state all --label cve --limit 2000 --json number,state,body,labels > "$OUT/lifecycle/issues.json"
          n=$(jq 'length' "$OUT/lifecycle/issues.json")
          echo "cve issues, open and closed: ${n}"
          [ "$n" -lt 2000 ] || echo "::warning::issue lifecycle: the issue list is at its page limit (${n}); the oldest closed issues may be missing from the reopen candidates, raise --limit"
          # The scanner and database the scans above ran with (Req 6.55), read
          # right after them.
          trivy version --format json > "$OUT/lifecycle/scanner.json"
          scripts/triage-policy.sh . resolved-labels > "$OUT/lifecycle/labels.json"
          scripts/fetch-sboms.sh . "$OUT/enumeration.tsv" "$OUT/lifecycle/sbom"

      - name: issue lifecycle, decided on evidence (tested)
        id: lifecycle
        run: |
          set -euo pipefail
          go -C triage/rescan run ./cmd/rescan-lifecycle \
            --enumeration "$OUT/enumeration.tsv" --reports "$OUT/trivy" --sboms "$OUT/lifecycle/sbom" \
            --issues "$OUT/lifecycle/issues.json" --scanner "$OUT/lifecycle/scanner.json" \
            --vex-dir "${GITHUB_WORKSPACE}/triage/vex" --vex-reports "$OUT/vex" --labels "$OUT/lifecycle/labels.json" \
            --aperture "$(scripts/triage-policy.sh . aperture)" --out "$OUT/lifecycle/actions.json"
          for k in close reopen relabel kept; do
            echo "${k}=$(jq ".${k} | length" "$OUT/lifecycle/actions.json")" >> "$GITHUB_OUTPUT"
          done

      - name: issue lifecycle, applied (Req 6.52, 6.53, 6.56, 6.57)
        id: lifecycle_apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The graded labels exist before use, idempotently, as the policy
          # file declares them (Req 6.56).
          jq -r 'to_entries[] | "\(.value.name)\t\(.value.color)\t\(.value.description)"' "$OUT/lifecycle/labels.json" \
            | while IFS=$'\t' read -r name color desc; do
                gh label create "$name" --color "$color" --description "$desc" 2>/dev/null || true
              done
          closed=0; reopened=0; relabelled=0
          # Order: the state change first, the label second, so a failure in
          # between never leaves an open issue wearing a resolved label; a
          # closed issue without its label is repaired by the comment's
          # "Label:" line and by the next run's relabel pass.
          while read -r action; do
            [ -n "$action" ] || continue
            number=$(jq -r '.number' <<<"$action"); label=$(jq -r '.label' <<<"$action")
            jq -r '.comment' <<<"$action" > "$OUT/lifecycle/comment-${number}.md"
            echo "closing #${number} as ${label}"
            gh issue close "$number" --comment "$(cat "$OUT/lifecycle/comment-${number}.md")" > /dev/null
            remove=$(jq -r '(.remove_labels // []) | join(",")' <<<"$action")
            [ -z "$remove" ] || gh issue edit "$number" --remove-label "$remove" > /dev/null
            gh issue edit "$number" --add-label "$label" > /dev/null
            closed=$((closed + 1))
          done < <(jq -c '.close[]' "$OUT/lifecycle/actions.json")
          while read -r action; do
            [ -n "$action" ] || continue
            number=$(jq -r '.number' <<<"$action")
            jq -r '.comment' <<<"$action" > "$OUT/lifecycle/comment-${number}.md"
            echo "reopening #${number}"
            remove=$(jq -r '(.remove_labels // []) | join(",")' <<<"$action")
            [ -z "$remove" ] || gh issue edit "$number" --remove-label "$remove" > /dev/null
            gh issue reopen "$number" --comment "$(cat "$OUT/lifecycle/comment-${number}.md")" > /dev/null
            reopened=$((reopened + 1))
          done < <(jq -c '.reopen[]' "$OUT/lifecycle/actions.json")
          while read -r action; do
            [ -n "$action" ] || continue
            number=$(jq -r '.number' <<<"$action")
            remove=$(jq -r '(.remove_labels // []) | join(",")' <<<"$action")
            echo "open #${number} sheds ${remove}: $(jq -r '.reason' <<<"$action")"
            [ -z "$remove" ] || gh issue edit "$number" --remove-label "$remove" > /dev/null
            relabelled=$((relabelled + 1))
          done < <(jq -c '.relabel[]' "$OUT/lifecycle/actions.json")
          jq -r '.kept[] | "kept open #\(.number) \(.id): \(.reason)"' "$OUT/lifecycle/actions.json"
          {
            echo "closed=${closed}"
            echo "reopened=${reopened}"
            echo "relabelled=${relabelled}"
          } >> "$GITHUB_OUTPUT"

      # Task 10.3: the open `cve` issues, finding -> URL, read before the
      # compile so a statement the compiler writes can name where the finding
      # is being worked (task 9.1's promise, Req 6.40). The dedup step below
      # reads the same issues again for its own purpose; both read the marker
      # `<!-- rescan-cve: <ID> -->`, never the title.
      - name: open cve issues (finding -> issue)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # $m is a jq binding, not a shell variable
          gh issue list --state open --label cve --limit 500 --json url,body \
            --jq '[.[] | (.body | capture("rescan-cve: (?<id>[A-Za-z0-9][A-Za-z0-9._-]*)") // empty) as $m | {key: $m.id, value: .url}] | from_entries' \
            > "$OUT/issues.json" || echo '{}' > "$OUT/issues.json"
          echo "open cve issues mapped: $(jq 'length' "$OUT/issues.json")"

      # Req 6.42, 6.43 (task 10.3; ADR 0004): every tag-referenced digest gets
      # today's scan reports attested with --replace, and its OpenVEX document
      # re-attested with --replace only when the statement set changed or a
      # count is wrong. The previous document is read through
      # cosign verify-attestation against the policy's role identities and
      # never downloaded unverified (Req 6.58). The JSONL record carries the
      # .att layer lists and Rekor indexes before and after: the first run is
      # the keyless measurement ADR 0004 left open.
      - name: attest today's reports, re-attest OpenVEX on change (Req 6.42, 6.43)
        id: reattest
        env:
          REATTEST_ISSUES: ${{ github.workspace }}/rescan-out/issues.json
        run: |
          set -uo pipefail
          scripts/reattest.sh . "$OUT/enumeration.tsv" "$OUT"
          rc=$?
          echo "reattested=$(jq -s '[.[] | select(.reattested == true)] | length' "$OUT/reattest.jsonl")" >> "$GITHUB_OUTPUT"
          echo "unchanged=$(jq -s '[.[] | select(.reattested == false and .skipped == null and .failed == null)] | length' "$OUT/reattest.jsonl")" >> "$GITHUB_OUTPUT"
          echo "skipped=$(jq -s '[.[] | select(.skipped != null)] | length' "$OUT/reattest.jsonl")" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # The single home for every daily assertion the catalogue makes about
      # its own state (task 9.4): visibility (Req 2.21), the admission proof
      # (Req 2.24, task 9.6) and the exception tiers (Req 6.51, task 10.1);
      # the upstream-checksum re-check joins with cluster C, ruleset drift
      # and the revocation checks with cluster D. It runs after the scans
      # because the tiers read the day's reports. Each assertion reports by
      # name and ANY failure fails the run — an invariant that soft-fails is
      # an opinion.
      - name: invariants (Req 2.21, 2.24, 6.44, 6.51)
        run: |
          set -euo pipefail
          scripts/check-visibility.sh . "$OUT/enumeration.tsv"
          # Req 2.24: the rendered admission policy, applied by the kyverno
          # CLI against the live registry, must admit every tag-referenced
          # digest and reject the declared unsigned control. The proof lives
          # here rather than in kyverno test fixtures because the set it
          # must admit changes daily (task 9.6).
          scripts/verify-catalogue.sh . "$OUT/enumeration.tsv" "$OUT/verify-catalogue.json"
          # Req 6.51, 6.60: every unexpired exception re-evaluated against
          # today's severity and KEV status. The feed is fetched here, once,
          # and an outage is a NON-EVALUATION that fails the run (fail closed,
          # the owner's call); the issue enrichment below reuses the file.
          feed=$(scripts/triage-policy.sh . kev-feed)
          if ! curl -fsSL --max-time 60 "$feed" -o "$OUT/kev.json"; then
            echo "::error::the CISA KEV feed (${feed}) is unavailable: the exception tiers were not evaluated today, which is a failure of this run, not a pass (Req 6.60)"
            exit 1
          fi
          scripts/check-exceptions.sh rescan . "$OUT/trivy" "$OUT/kev.json"
          # Req 6.44, 6.45 (ADR 0004): exactly one OpenVEX attestation on every
          # tag-referenced digest and platform manifest, read from the .att
          # manifests the way a consumer reads them, after today's replaces.
          scripts/check-attestation-count.sh "$OUT/enumeration.tsv" "$OUT/attestation-count.json"
          # Req 9.5 (task 13.3): the revocation record, read once here into the
          # JSON the status step lists; its verdict (no catalogue tag on a
          # revoked digest, Req 9.7) is asserted by the posture step at the
          # end, so a half-executed revocation fails the run after the day's
          # issues and status are published, not instead of them.
          scripts/check-revocations.sh triage/revocations.yaml "$OUT/enumeration.tsv" "$OUT/revocations.json" || true

      # Task 11.3 (Req 3.10, 4.9): every definition's declared authenticity
      # signal re-verified against its origin, daily. A mismatch (a tag that
      # moved, a signature that no longer verifies, two checksum origins that
      # stopped agreeing) fails the run and files one issue naming it as a
      # supply-chain signal; the record is the evidence, the issue is where a
      # human decides. Lapsed compat review-by dates are reported here too.
      - name: authenticity signals (Req 3.10, 4.9)
        id: authenticity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          scripts/check-authenticity.sh . "$OUT/authenticity.jsonl"; rc=$?
          {
            echo "verified=$(jq -s '[.[] | select(.class != "compat" and .ok)] | length' "$OUT/authenticity.jsonl")"
            echo "mismatched=$(jq -s '[.[] | select(.class != "compat" and (.ok | not))] | length' "$OUT/authenticity.jsonl")"
            echo "lapsed=$(jq -s '[.[] | select(.class == "compat" and (.ok | not))] | length' "$OUT/authenticity.jsonl")"
          } >> "$GITHUB_OUTPUT"
          # One open issue per definition with a mismatch, found by its marker
          # (the cve issues' convention): a signal that persists is one issue
          # that stays open, not one issue per day.
          gh label create supply-chain --color B60205 --description "An upstream authenticity signal failed re-verification (Req 3.10)" 2>/dev/null || true
          existing=$(gh issue list --state open --label supply-chain --limit 200 --json body --jq '.[].body' | grep -oE 'rescan-signal: [^ >]+' | sed 's/^rescan-signal: //' | sort -u || true)
          while read -r record; do
            [ -n "$record" ] || continue
            definition=$(jq -r '.definition' <<<"$record")
            if grep -qxF "$definition" <<<"$existing"; then
              echo "supply-chain issue for ${definition} already open"
              continue
            fi
            title="Supply-chain signal: $(jq -r '"\(.definition) (\(.class), \(.ref))"' <<<"$record") failed re-verification"
            body=$(jq -r '"<!-- rescan-signal: \(.definition) -->\n\nThe daily rescan re-verified this definition'"'"'s declared authenticity signal against its upstream origin and it did not hold (Req 3.10).\n\n| Field | Value |\n|---|---|\n| Definition | `\(.definition)` |\n| Declared class | `\(.class)` |\n| Pinned ref | `\(.ref)` |\n| Finding | \(.detail) |\n\nThis is evidence, not a decision: the pinned content is unchanged and every published image still verifies against its own signature. Someone decides what the mismatch means: an upstream that moved a tag or rotated a key, a compromise, or an origin that changed its publishing. Until then the rescan fails daily and this issue stays open."' <<<"$record")
            echo "filing supply-chain issue for ${definition}"
            gh issue create --title "$title" --label supply-chain --body "$body"
          done < <(jq -c 'select(.class != "compat" and (.ok | not))' "$OUT/authenticity.jsonl")
          exit "$rc"

      # Task 13.4 (Req 9.12): the VEX portability block over the supported
      # set. For each statement the authoritative scanner suppressed on a
      # supported digest's platform manifest (its report above, normalised,
      # no second trivy run), each other declared consumer scans the same
      # manifest with the same compiled documents and its result is named:
      # agree, DIVERGENCE (reported there), absent (unknown to its database).
      # Informational, never fails the run (consumers.gating is the switch);
      # the cost is one scan per other consumer per supported platform
      # manifest, owned in design Decision 10. Superseded digests are out of
      # scope, like issues and clocks (review 3.7).
      - name: VEX portability over the supported set (Req 9.12)
        id: portability
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p "$OUT/portability"
          auth=$(scripts/triage-policy.sh . authoritative-consumer)
          mapfile -t others < <(scripts/triage-policy.sh . other-consumers)
          blocks=0; divergences=0; unmeasured=0
          for report in "$OUT"/trivy/*.json; do
            [ -f "$report" ] || continue
            base=$(basename "$report" .json)              # <name>__<d12>__<platform>
            name="${base%%__*}"; rest="${base#*__}"; d7="${rest%%__*}"; platform="${rest#*__}"; platform="${platform//-//}"
            manifest=$(jq -r '.ArtifactName' "$report" | sed 's/.*@//')
            repo=$(jq -r '.ArtifactName' "$report" | sed 's/@.*//')
            [ -n "$manifest" ] && [ -n "$repo" ] || { echo "::warning::portability: ${base}: no ArtifactName in the report, skipped"; continue; }
            scripts/vex-consumer.sh "$auth" "$OUT/portability/${base}.${auth}.jsonl" --root . --report "$report" >/dev/null || { unmeasured=$((unmeasured + 1)); continue; }
            records=("$OUT/portability/${base}.${auth}.jsonl")
            for consumer in "${others[@]}"; do
              if scripts/vex-consumer.sh "$consumer" "$OUT/portability/${base}.${consumer}.jsonl" --root . --scan "${repo}@${manifest}" --vex-dir "$OUT/vex/${name}__${d7}" --remote >/dev/null 2>"$OUT/portability/${base}.${consumer}.err"; then
                records+=("$OUT/portability/${base}.${consumer}.jsonl")
              else
                echo "::warning::portability: ${consumer} produced no record for ${repo}@${manifest} (${platform}): $(tr -d '\n' < "$OUT/portability/${base}.${consumer}.err" | cut -c1-200)"
                unmeasured=$((unmeasured + 1))
                records+=("$OUT/portability/${base}.${consumer}.missing.jsonl")
              fi
            done
            scripts/vex-portability.sh --root . --label "${name}@${manifest:0:19} (${platform})" --out "$OUT/portability/block.md" --append --json "$OUT/portability/${base}.json" "${records[@]}" | grep -c 'is reported by' >> "$OUT/portability/divergences" || true
            blocks=$((blocks + 1))
          done
          divergences=$(awk '{s+=$1} END{print s+0}' "$OUT/portability/divergences" 2>/dev/null || echo 0)
          {
            echo "blocks=${blocks}"
            echo "divergences=${divergences}"
            echo "unmeasured=${unmeasured}"
          } >> "$GITHUB_OUTPUT"
          echo "portability: ${blocks} manifest(s) compared, ${divergences} divergence(s), ${unmeasured} consumer scan(s) not measured"

      # Task 13.4 (Req 9.13): the published consumer recipe, run verbatim
      # against one supported digest every day, so README's verify section
      # is a tested contract. A failed instruction step or a suppression
      # missing in the authoritative consumer fails the run by name; every
      # other consumer's result goes into the portability block. ADR 0004's
      # regression check rides along (trivy --vex oci must suppress what the
      # extracted document suppresses). The digest is the first supported
      # full-release tag in the enumeration, so it rotates as releases do.
      - name: consumer smoke test (Req 9.13)
        id: smoke
        run: |
          set -uo pipefail
          mkdir -p "$OUT/smoke"
          ref=$(awk -F'\t' '$6 == "supported" && $2 ~ /^[0-9]+\.[0-9]+\.[0-9]+/ {print $1"@"$3; exit}' "$OUT/enumeration.tsv")
          [ -n "$ref" ] || { echo "::error::consumer smoke: no supported full-release digest in today's enumeration to run the recipe against (Req 9.13)"; exit 1; }
          scripts/consumer-smoke.sh --root . --readme README.md --ref "$ref" --out "$OUT/smoke/smoke.md" --json "$OUT/smoke/smoke.json"; rc=$?
          {
            echo "ref=${ref}"
            echo "failed_steps=$(jq '.recipe.failed' "$OUT/smoke/smoke.json" 2>/dev/null || echo 0)"
            echo "missing=$(jq '.authoritative.missing' "$OUT/smoke/smoke.json" 2>/dev/null || echo 0)"
            echo "suppressed=$(jq '.authoritative.suppressed' "$OUT/smoke/smoke.json" 2>/dev/null || echo 0)"
            echo "unneeded=$(jq '.authoritative.unneeded' "$OUT/smoke/smoke.json" 2>/dev/null || echo 0)"
          } >> "$GITHUB_OUTPUT"
          exit "$rc"

      # Req 6.10 — an acceptance that lapses unnoticed is the failure mode this
      # whole lane exists to prevent, and Trivy is silent about it: a lapsed
      # entry simply stops suppressing. The daily cron is the right place to say
      # so, because expiry happens with time rather than with a commit — reddening
      # some unrelated PR instead would blame the wrong change.
      #
      # Reuses the linter rather than recomputing dates: one implementation of
      # "expired" and "expiring", so the notice and the gate can never disagree.
      - name: accepted-risk expiries (Req 6.10)
        run: |
          set -uo pipefail
          # Explicit rather than transitive: unlike validate.yml this workflow
          # installs no yamllint, so PyYAML is not already here by accident.
          # Exact pins + hashes (Req 7.5, #74) — one pin surface for every
          # python package CI installs, even though only pyyaml is used here.
          pip install --quiet --require-hashes -r .github/requirements-ci.txt
          scripts/lint-accepted-risk.sh > "$OUT/accepted-risk.txt" 2>&1 || true
          expiring=$(grep -E 'expires in|is in the past' "$OUT/accepted-risk.txt" || true)
          {
            echo "### Accepted risk — expiring"
            echo
            if [ -n "$expiring" ]; then
              printf '%s\n' "$expiring" \
                | sed -E 's/^::(warning|error) file=([^,:]+)[^:]*:://' \
                | sed 's/^/- /'
              echo
              echo "_Each of these needs a fresh decision: fix, avoid, prove it does not apply, or re-accept with a new expiry and a reason it is still the right call._"
            else
              echo "_none_ ✓"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$expiring"

      - name: enrich — EPSS + CISA KEV
        run: |
          set -euo pipefail
          mapfile -t cves < <(grep -E '^CVE-' "$OUT/cves.txt" 2>/dev/null || true)
          # The CISA KEV catalogue was fetched by the invariants step above,
          # fail-closed (Req 6.60); a missing file here means that step did
          # not run, which is itself a failure.
          [ -s "$OUT/kev.json" ] || { echo "::error::no KEV catalogue on disk; the invariants step must run first"; exit 1; }
          # EPSS bulk lookup, comma-separated CVEs (best-effort). MVP catalogue CVE
          # counts sit well under the API's per-request limit; batch if that changes.
          if [ "${#cves[@]}" -gt 0 ]; then
            csv=$(IFS=,; echo "${cves[*]}")
            curl -fsSL "https://api.first.org/data/v1/epss?cve=${csv}" -o "$OUT/epss.json" \
              || echo '{"data":[]}' > "$OUT/epss.json"
          else
            echo '{"data":[]}' > "$OUT/epss.json"
          fi

      - name: dedup — already-open CVE issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Our issues carry a stable marker: <!-- rescan-cve: <ID> -->, where <ID>
          # is the scanner's vulnerability id — a CVE (CVE-2026-1234), a GHSA
          # advisory (GHSA-hrxh-6v49-42gf), or any other id. Extract the whole id
          # from every open `cve` issue so the reporter skips duplicates. A
          # CVE-only match silently re-filed GHSA findings on every daily run.
          bodies=$(gh issue list --state open --label cve --limit 500 --json body --jq '.[].body' || true)
          printf '%s' "$bodies" \
            | grep -oE 'rescan-cve: [A-Za-z0-9][A-Za-z0-9._-]*' \
            | sed 's/^rescan-cve: //' \
            | sort -u | jq -R . | jq -s -c . > "$OUT/existing.json" || echo '[]' > "$OUT/existing.json"
          echo "already open: $(jq 'length' "$OUT/existing.json")"

      - name: build issue set (tested reporter)
        id: report
        run: |
          set -euo pipefail
          go -C triage/rescan run ./cmd/rescan-report \
            --aperture "$(scripts/triage-policy.sh . aperture)" \
            --trivy "$OUT/trivy" --epss "$OUT/epss.json" --kev "$OUT/kev.json" --existing "$OUT/existing.json" \
            > "$OUT/issues.json"
          n=$(jq 'length' "$OUT/issues.json")
          echo "count=${n}" >> "$GITHUB_OUTPUT"
          echo "new CVE issues to file: ${n}"

      - name: Grype second opinion on CRITICAL (Req 6.6)
        if: steps.report.outputs.count != '0'
        run: |
          set -uo pipefail
          # Corroborate each CRITICAL we're about to file, on its affected images.
          jq -r '.[] | select(.severity == "CRITICAL") | .images[]' "$OUT/issues.json" | sort -u \
            | while read -r ref; do
                [ -n "$ref" ] || continue
                echo "::group::grype ${ref}"
                grype "$ref" -o table || echo "::warning::grype failed for ${ref}"
                echo "::endgroup::"
              done

      - name: file new-CVE issues (Req 6.3)
        if: steps.report.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Labels must exist before use; create idempotently.
          gh label create cve               --color B60205 --description "CVE tracked by the rescan cron" 2>/dev/null || true
          gh label create security          --color D93F0B --description "Security finding" 2>/dev/null || true
          # One label per aperture severity (Req 6.49): a fork's wider
          # aperture files issues under labels that exist.
          for sev in $(scripts/triage-policy.sh . aperture | tr ',' ' '); do
            case "$sev" in CRITICAL) color=B60205 ;; HIGH) color=FBCA04 ;; *) color=0E8A16 ;; esac
            gh label create "severity:$(printf '%s' "$sev" | tr '[:upper:]' '[:lower:]')" --color "$color" --description "${sev} severity" 2>/dev/null || true
          done
          jq -c '.[]' "$OUT/issues.json" | while read -r issue; do
            title=$(jq -r '.title'  <<<"$issue")
            body=$(jq -r '.body'    <<<"$issue")
            labels=$(jq -r '.labels | join(",")' <<<"$issue")
            echo "opening: ${title}"
            gh issue create --title "$title" --body "$body" --label "$labels"
          done

      # Task 10.4 (Req 6.46, 6.47): the clocks over the supported set, read
      # from the attested statements and today's reports, published to one
      # status issue maintained the way Renovate maintains its dashboard
      # (found by a hidden marker, edited in place) and to a workflow
      # artifact. The previous issue body is a named input: its fenced JSON
      # block carries the fix dates forward, so a report replaced today does
      # not erase the day a finding first went absent. The computation is the
      # tested rescan Go package; these steps are its I/O.
      - name: catalogue status, the previously published data (Req 6.46)
        id: status_previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT/status"
          # The marker identifies the issue, never the title alone (the cve
          # issues' convention, the same here).
          number=$(gh issue list --state open --search '"Catalogue status" in:title' --limit 20 --json number,body \
                     --jq '[.[] | select(.body | contains("<!-- catalogue-status -->"))] | first | .number // empty' || true)
          if [ -n "$number" ]; then
            gh issue view "$number" --json body --jq .body > "$OUT/status/previous.md"
            echo "previous status issue: #${number}"
          else
            : > "$OUT/status/previous.md"
            echo "no status issue yet: the clocks start from today's evidence"
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: catalogue status, the clocks over the supported set (Req 6.46)
        id: status
        run: |
          set -euo pipefail
          aperture=$(scripts/triage-policy.sh . aperture)
          ceilings=""
          for sev in ${aperture//,/ }; do
            ceilings="${ceilings:+${ceilings},}${sev}=$(scripts/triage-policy.sh . ceiling "$sev")"
          done
          go -C triage/rescan run ./cmd/rescan-status \
            --enumeration "$OUT/enumeration.tsv" --reattest "$OUT/reattest" --reports "$OUT/trivy" \
            --kev "$OUT/kev.json" --aperture "$aperture" --ceilings "$ceilings" \
            --kev-ceiling "$(scripts/triage-policy.sh . kev-ceiling)" \
            --previous-body "$OUT/status/previous.md" --revocations "$OUT/revocations.json" \
            --run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --out-json "$OUT/status/metrics.json" --out-body "$OUT/status/issue.md"
          for k in findings undecided over_ceiling decided fixed; do
            echo "${k}=$(jq ".aggregates.${k}" "$OUT/status/metrics.json")" >> "$GITHUB_OUTPUT"
          done

      - name: catalogue status, published to the status issue (Req 6.47)
        id: status_publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.status_previous.outputs.number }}
        run: |
          set -euo pipefail
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file "$OUT/status/issue.md" > /dev/null
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/${NUMBER}"
          else
            gh label create status --color 0075CA --description "The catalogue's clocks, maintained by the rescan" 2>/dev/null || true
            url=$(gh issue create --title "Catalogue status" --label status --body-file "$OUT/status/issue.md")
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "status issue: ${url}"

      - name: upload the status data (Req 6.47)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalogue-status
          path: rescan-out/status/metrics.json

      # Tasks 13.2 and 13.3 (Req 9.3, 9.7, 9.9): the posture invariants,
      # asserted daily. Governance through anonymous reads: the committed
      # ruleset export under .github/rulesets/ must match the live rulesets
      # API by name over name, target, enforcement, conditions and rules, in
      # both directions, and private vulnerability reporting must be on
      # (bypass_actors is outside the compared set, anonymous reads withhold
      # it: the export carries it and SECURITY.md states it). And no catalogue
      # tag may still reference a digest the revocation record names. Each
      # failure fails the run by name. The step runs last so a posture failure
      # never starves the day's scans, issues and status of their run; the
      # summary still prints.
      - name: posture invariants (Req 9.3, 9.7, 9.9)
        id: governance
        run: |
          set -uo pipefail
          scripts/check-governance.sh .github/rulesets "$GITHUB_REPOSITORY" "$OUT/governance.json"; rc=$?
          scripts/check-revocations.sh triage/revocations.yaml "$OUT/enumeration.tsv" "$OUT/revocations.json" || rc=1
          {
            echo "revoked=$(jq '.revocations | length' "$OUT/revocations.json")"
            echo "revoked_referenced=$(jq '.referenced | length' "$OUT/revocations.json")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "reporting=$(jq -r 'if .reporting.enabled == null then "unreadable" elif .reporting.enabled then "enabled" else "DISABLED" end' "$OUT/governance.json")"
            echo "compared=$(jq '.rulesets | length' "$OUT/governance.json")"
            echo "differences=$(jq '[.rulesets[].differences | length] | add // 0' "$OUT/governance.json")"
            echo "live_only=$(jq '.live_only | length' "$OUT/governance.json")"
          } >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Daily rescan"
            if [ -f "$OUT/enumeration.tsv" ]; then
              echo "- enumerated: $(wc -l < "$OUT/enumeration.tsv") platform manifest rows, $(cut -f1 "$OUT/enumeration.tsv" | sort -u | wc -l) repositories, $(cut -f1,2 "$OUT/enumeration.tsv" | sort -u | wc -l) tags ($(awk -F'\t' '$6=="superseded"' "$OUT/enumeration.tsv" | cut -f1,2 | sort -u | wc -l) superseded)"
            fi
            echo "- platform manifests scanned: ${{ steps.scan.outputs.scanned || 0 }} (failed: ${{ steps.scan.outputs.failed || 0 }})"
            echo "- new CVE issues filed: ${{ steps.report.outputs.count || 0 }}"
            echo "- authenticity signals: ${{ steps.authenticity.outputs.verified || 0 }} verified, ${{ steps.authenticity.outputs.mismatched || 0 }} mismatched, ${{ steps.authenticity.outputs.lapsed || 0 }} lapsed compat review-by date(s)"
            echo "- governance: private vulnerability reporting ${{ steps.governance.outputs.reporting || 'not checked' }}, ${{ steps.governance.outputs.compared || 0 }} committed ruleset(s) compared, ${{ steps.governance.outputs.differences || 0 }} difference(s), ${{ steps.governance.outputs.live_only || 0 }} live-only ruleset(s)"
            echo "- revocations: ${{ steps.governance.outputs.revoked || 0 }} recorded, ${{ steps.governance.outputs.revoked_referenced || 0 }} still referenced by a catalogue tag"
            echo "- consumer smoke test: ${{ steps.smoke.outputs.ref || 'not run' }}, ${{ steps.smoke.outputs.failed_steps || 0 }} failed step(s); statements: ${{ steps.smoke.outputs.suppressed || 0 }} suppressed a reported finding, ${{ steps.smoke.outputs.unneeded || 0 }} had nothing to suppress, ${{ steps.smoke.outputs.missing || 0 }} missing in the authoritative consumer"
            echo "- VEX portability: ${{ steps.portability.outputs.blocks || 0 }} supported platform manifest(s) compared, ${{ steps.portability.outputs.divergences || 0 }} divergence(s), ${{ steps.portability.outputs.unmeasured || 0 }} consumer scan(s) not measured"
            echo "- issues closed on evidence: ${{ steps.lifecycle_apply.outputs.closed || 0 }} of ${{ steps.lifecycle.outputs.close || 0 }} decided, reopened: ${{ steps.lifecycle_apply.outputs.reopened || 0 }} of ${{ steps.lifecycle.outputs.reopen || 0 }}, kept open: ${{ steps.lifecycle.outputs.kept || 0 }}"
            echo "- catalogue status: ${{ steps.status_publish.outputs.url || 'not published' }}, ${{ steps.status.outputs.undecided || 0 }} undecided (${{ steps.status.outputs.over_ceiling || 0 }} over ceiling), ${{ steps.status.outputs.decided || 0 }} decided, ${{ steps.status.outputs.fixed || 0 }} fixed"
            echo
            # Req 6.33. Without this the run is green whether every statement
            # applied or none of them did: an unresolved digest suppresses
            # nothing, and the findings it should have excused are deduped away
            # by their own already-open issues. Green, empty issue set, both
            # ways. The counts are what tell those apart.
            echo "#### VEX compilation (Req 6.28-6.30)"
            echo
            if compgen -G "$OUT/vex/*.report.json" > /dev/null; then
              echo "| Image | Scanned digest | Applied | Dropped |"
              echo "|---|---|---|---|"
              jq -r 'if .digest == "" then
                       "| \(.image) | **unresolved — no VEX applied** | – | – |"
                     else
                       "| \(.image) | `\(.digest[0:19])…` | \(.compiled) | \(.dropped) |"
                     end' "$OUT"/vex/*.report.json
              echo
              # Only kind=tag is listed. A statement for another catalogue image
              # was never going to apply and would bury the signal — the last
              # run showed ten such lines around zero interesting ones. A claim
              # scoped to another release is the one worth reading, because from
              # counts alone it looks identical to a correctly-scoped one.
              # Nothing is hidden: the reports in the artifact keep every drop.
              if jq -e -s '[.[].drops[] | select(.kind == "tag")] | length > 0' \
                   "$OUT"/vex/*.report.json >/dev/null; then
                echo "<details><summary>statements scoped to another release, not applied</summary>"
                echo
                jq -r -s '.[] | .image as $i | .drops[] | select(.kind == "tag")
                          | "- **\($i)** — `\(.cve)` \(.reason)"' "$OUT"/vex/*.report.json
                echo
                echo "</details>"
              else
                echo "_every statement for these images applied_ ✓"
              fi
              other=$(jq -r -s '[.[].drops[] | select(.kind != "tag")] | length' "$OUT"/vex/*.report.json)
              [ "$other" -eq 0 ] || echo "<sub>${other} statement(s) skipped as belonging to other images.</sub>"
            else
              echo "_no image reached compilation_"
            fi
            echo
            if [ -f "$OUT/smoke/smoke.md" ]; then cat "$OUT/smoke/smoke.md"; echo; fi
            if [ -f "$OUT/portability/block.md" ]; then cat "$OUT/portability/block.md"; echo; fi
            echo "#### Re-attestation (Req 6.42, 6.43)"
            echo
            if [ -f "$OUT/reattest.jsonl" ]; then
              echo "- re-attested: ${{ steps.reattest.outputs.reattested || 0 }}, unchanged: ${{ steps.reattest.outputs.unchanged || 0 }}, skipped: ${{ steps.reattest.outputs.skipped || 0 }}"
              echo
              echo "| Digest | Reports attested | Previous docs | OpenVEX before (index) | Differs | Re-attested | Rekor retained |"
              echo "|---|---|---|---|---|---|---|"
              jq -r 'if .skipped then "| `\(.repository | split("/") | last)@\(.digest[0:19])…` | – | – | – | – | skipped: \(.skipped) | – |"
                     elif .failed then "| `\(.repository | split("/") | last)@\(.digest[0:19])…` | – | – | – | – | **failed: \(.failed)** | – |"
                     else "| `\(.repository | split("/") | last)@\(.digest[0:19])…` | \(.reports_attested) | \(.previous_documents) | \(.openvex_before.index.openvex) | \(.differs) | \(.reattested)\(if .wrong_count then " (count repaired)" else "" end) | \([.rekor_retained[] | .retained] | if length == 0 then "–" elif all then "yes" else "NO" end) |"
                     end' "$OUT/reattest.jsonl"
            else
              echo "_the re-attestation step did not run_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload rescan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rescan-${{ github.run_id }}
          path: rescan-out/
          if-no-files-found: warn
