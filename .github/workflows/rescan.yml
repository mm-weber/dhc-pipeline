name: rescan

# Daily CVE rescan of the PUBLISHED ghcr.io/mm-weber/dhc images (Req 6.2).
# Trivy re-scans each catalogue image for HIGH/CRITICAL honouring our OpenVEX
# statements in triage/vex/. Findings that are new — not already tracked by an
# open `cve` issue — are enriched with EPSS (FIRST.org) and CISA KEV status and
# filed as one GitHub issue per CVE, listing severity, EPSS, KEV, and affected
# images (Req 6.3). A CRITICAL also gets a Grype second opinion (Req 6.6),
# mirroring the PR gate.
#
# The join/dedup/templating is the tested triage/rescan Go tool; this workflow is
# the I/O around it. GitHub Actions is the authoritative environment (Req 8.1):
# the Trivy/Grype DBs, the EPSS API, and the CISA feed are reachable here but not
# from the devcontainer. Scan/feed failures soft-fail (skip + warn) so a transient
# outage never turns the cron permanently red.

on:
  schedule:
    - cron: "17 6 * * *" # daily ~06:17 UTC, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read
  # Task 10.3 (Req 6.42, 6.43): the rescan attests today's scan reports and,
  # on change, the OpenVEX document to the published digests, replacing. That
  # is a push to the .att manifests (packages: write) signed keyless
  # (id-token: write), as the re-attester role in catalogue-policy.yaml, which
  # attests openvex and vuln only; it cannot mint a signed digest (Req 2.23).
  packages: write
  id-token: write
  issues: write # file new-CVE issues

jobs:
  rescan:
    name: rescan published images
    runs-on: ubuntu-latest
    defaults:
      run:
        # Plain bash, no injected flags (#73): the default shell is
        # `bash -e {0}`, and a script's own `set -uo pipefail` does not clear
        # that inherited -e — so the scan loop's soft-fail contract below was
        # dead code and one unresolvable image aborted the whole rescan. Every
        # step here declares its error mode with an explicit `set` line; this
        # makes those lines the whole truth.
        shell: bash {0}
    env:
      REGISTRY: ghcr.io/mm-weber/dhc
      OUT: ${{ github.workspace }}/rescan-out
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: triage/rescan/go.mod
          cache: false # stdlib-only tool, no go.sum to key a cache on

      - name: log in to ghcr.io
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cosign stays on the v2 line: --replace exists there and its bundles are
      # what Trivy and Kyverno read (ADR 0003, ADR 0004). Same pin as build.yml.
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: v2.6.0
      - name: install trivy + grype + crane + kyverno + vexctl
        run: |
          set -euo pipefail
          # As the runner user into a temp dir on PATH — see build.yml. crane
          # lists the registry's tags for the enumeration (task 9.3); kyverno
          # applies the admission policy in the daily proof (task 9.6).
          mkdir -p "${RUNNER_TEMP}/bin"
          scripts/install-scanners.sh "${RUNNER_TEMP}/bin"
          scripts/install-tool.sh crane "${RUNNER_TEMP}/bin"
          scripts/install-tool.sh kyverno "${RUNNER_TEMP}/bin"
          scripts/install-tool.sh vexctl "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      # Req 2.22: every catalogue tag in every catalogue repository, resolved
      # to platform manifests. Hard-fail, unlike every scan below: the
      # enumeration IS the daily promise, and a partial one that looks
      # complete would silently shrink what the catalogue watches.
      - name: enumerate the catalogue (Req 2.22)
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          scripts/enumerate-catalogue.sh . "$OUT/enumeration.tsv"

      - name: scan every platform manifest of every tag-referenced digest
        id: scan
        run: |
          # No `set -e`: a transient scan failure must skip, not abort the
          # whole rescan (Req 6 soft-fail). The enumeration above already
          # hard-failed if the WORLD was unreadable; from here each miss is
          # one manifest, counted and named.
          set -uo pipefail
          mkdir -p "$OUT/trivy" "$OUT/trivy-superseded" "$OUT/vex"

          # One compile per tag-referenced digest, one scan per unique
          # platform manifest. Several tags share a digest by design (9, 9.1
          # and 9.1.2 usually name one build), so work is keyed by digest and
          # tags become attribution. Scans address <repo>@<manifest-digest>:
          # a digest ref needs no --platform and cannot be silently
          # downgraded to the runner's own architecture (task 8.3's
          # measurement, the reason this task exists).
          declare -A tags_of=() manifests_of=() platform_of=() status_of=()
          while IFS=$'\t' read -r repo tag digest platform manifest status; do
            key="${repo}@${digest}"
            case " ${tags_of[$key]:-} " in *" ${tag} "*) ;; *) tags_of[$key]="${tags_of[$key]:-} ${tag}" ;; esac
            mkey="${repo}@${manifest}"
            case " ${manifests_of[$key]:-} " in *" ${manifest} "*) ;; *) manifests_of[$key]="${manifests_of[$key]:-} ${manifest}" ;; esac
            platform_of[$mkey]="$platform"
            # A digest is supported if ANY tag referencing it is (Terms):
            # its findings belong in issues the moment one supported tag
            # serves it.
            [ "$status" = "supported" ] && status_of[$key]=supported
            : "${status_of[$key]:=superseded}"
          done < "$OUT/enumeration.tsv"

          scanned=0; failed=0
          for key in "${!tags_of[@]}"; do
            repo="${key%@*}"; digest="${key#*@}"
            name="${repo##*/}"
            read -r -a tags <<< "${tags_of[$key]}"
            read -r -a manifests <<< "${manifests_of[$key]}"
            d7="${digest#sha256:}"; d7="${d7:0:12}"
            vexdir="$OUT/vex/${name}__${d7}"
            report="$OUT/vex/${name}__${d7}.report.json"
            # Req 6.28-6.30, same contract as the PR gate and the release arm:
            # source is never handed to a scanner, and the compiled document
            # is stamped with the index digest AND every platform manifest
            # digest — the scan below reads <repo>@<manifest>, so Trivy's
            # product identity is the MANIFEST digest, and a document without
            # it suppresses nothing. The tags are the registry's own for this
            # digest, so a claim scoped to another release stays dropped
            # (Req 6.30). Req 6.32/6.33: every path writes a report, so
            # "compiled nothing" and "never compiled" stay distinguishable.
            COMPILE_VEX_REPORT="$report" COMPILE_VEX_MANIFEST_DIGESTS="${manifests[*]}" \
              scripts/compile-vex.sh triage/vex "$vexdir" "$name" "$digest" "${tags[@]}" || true
            outdir="$OUT/trivy"
            [ "${status_of[$key]}" = "superseded" ] && outdir="$OUT/trivy-superseded"
            for m in "${manifests[@]}"; do
              ref="${repo}@${m}"
              p="${platform_of[${repo}@${m}]}"
              out="${outdir}/${name}__${d7}__${p//\//-}.json"
              echo "::group::scan ${ref} (${p}, ${status_of[$key]}, tags:${tags_of[$key]})"
              if scripts/scan-image.sh "$ref" "$name" "$vexdir" "$out" --remote; then
                scanned=$((scanned + 1))
              else
                echo "::warning::scan failed for ${ref} (${p}) — skipped, counted"
                failed=$((failed + 1))
                rm -f "$out"
              fi
              echo "::endgroup::"
            done
          done
          echo "scanned=${scanned}" >> "$GITHUB_OUTPUT"
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"
          # Union of post-VEX HIGH/CRITICAL CVE IDs across SUPPORTED reports
          # only: a superseded digest keeps its daily scan and its artifacts,
          # and sits outside the scope of issues and clocks (Terms; its
          # findings accrue by design, the frozen-digest pattern).
          jq -r '.Results[]?.Vulnerabilities[]?.VulnerabilityID' "$OUT"/trivy/*.json 2>/dev/null \
            | grep -E '^CVE-' | sort -u > "$OUT/cves.txt" || true
          echo "distinct HIGH/CRITICAL CVEs (supported set): $(grep -c . "$OUT/cves.txt" || echo 0)"

      # Task 10.3: the open `cve` issues, finding -> URL, read before the
      # compile so a statement the compiler writes can name where the finding
      # is being worked (task 9.1's promise, Req 6.40). The dedup step below
      # reads the same issues again for its own purpose; both read the marker
      # `<!-- rescan-cve: <ID> -->`, never the title.
      - name: open cve issues (finding -> issue)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # $m is a jq binding, not a shell variable
          gh issue list --state open --label cve --limit 500 --json url,body \
            --jq '[.[] | (.body | capture("rescan-cve: (?<id>[A-Za-z0-9][A-Za-z0-9._-]*)") // empty) as $m | {key: $m.id, value: .url}] | from_entries' \
            > "$OUT/issues.json" || echo '{}' > "$OUT/issues.json"
          echo "open cve issues mapped: $(jq 'length' "$OUT/issues.json")"

      # Req 6.42, 6.43 (task 10.3; ADR 0004): every tag-referenced digest gets
      # today's scan reports attested with --replace, and its OpenVEX document
      # re-attested with --replace only when the statement set changed or a
      # count is wrong. The previous document is read through
      # cosign verify-attestation against the policy's role identities and
      # never downloaded unverified (Req 6.58). The JSONL record carries the
      # .att layer lists and Rekor indexes before and after: the first run is
      # the keyless measurement ADR 0004 left open.
      - name: attest today's reports, re-attest OpenVEX on change (Req 6.42, 6.43)
        id: reattest
        env:
          REATTEST_ISSUES: ${{ github.workspace }}/rescan-out/issues.json
        run: |
          set -uo pipefail
          scripts/reattest.sh . "$OUT/enumeration.tsv" "$OUT"
          rc=$?
          echo "reattested=$(jq -s '[.[] | select(.reattested == true)] | length' "$OUT/reattest.jsonl")" >> "$GITHUB_OUTPUT"
          echo "unchanged=$(jq -s '[.[] | select(.reattested == false and .skipped == null and .failed == null)] | length' "$OUT/reattest.jsonl")" >> "$GITHUB_OUTPUT"
          echo "skipped=$(jq -s '[.[] | select(.skipped != null)] | length' "$OUT/reattest.jsonl")" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # The single home for every daily assertion the catalogue makes about
      # its own state (task 9.4): visibility (Req 2.21), the admission proof
      # (Req 2.24, task 9.6) and the exception tiers (Req 6.51, task 10.1);
      # the upstream-checksum re-check joins with cluster C, ruleset drift
      # and the revocation checks with cluster D. It runs after the scans
      # because the tiers read the day's reports. Each assertion reports by
      # name and ANY failure fails the run — an invariant that soft-fails is
      # an opinion.
      - name: invariants (Req 2.21, 2.24, 6.44, 6.51)
        run: |
          set -euo pipefail
          scripts/check-visibility.sh . "$OUT/enumeration.tsv"
          # Req 2.24: the rendered admission policy, applied by the kyverno
          # CLI against the live registry, must admit every tag-referenced
          # digest and reject the declared unsigned control. The proof lives
          # here rather than in kyverno test fixtures because the set it
          # must admit changes daily (task 9.6).
          scripts/verify-catalogue.sh . "$OUT/enumeration.tsv" "$OUT/verify-catalogue.json"
          # Req 6.51, 6.60: every unexpired exception re-evaluated against
          # today's severity and KEV status. The feed is fetched here, once,
          # and an outage is a NON-EVALUATION that fails the run (fail closed,
          # the owner's call); the issue enrichment below reuses the file.
          feed=$(scripts/triage-policy.sh . kev-feed)
          if ! curl -fsSL --max-time 60 "$feed" -o "$OUT/kev.json"; then
            echo "::error::the CISA KEV feed (${feed}) is unavailable: the exception tiers were not evaluated today, which is a failure of this run, not a pass (Req 6.60)"
            exit 1
          fi
          scripts/check-exceptions.sh rescan . "$OUT/trivy" "$OUT/kev.json"
          # Req 6.44, 6.45 (ADR 0004): exactly one OpenVEX attestation on every
          # tag-referenced digest and platform manifest, read from the .att
          # manifests the way a consumer reads them, after today's replaces.
          scripts/check-attestation-count.sh "$OUT/enumeration.tsv" "$OUT/attestation-count.json"

      # Req 6.10 — an acceptance that lapses unnoticed is the failure mode this
      # whole lane exists to prevent, and Trivy is silent about it: a lapsed
      # entry simply stops suppressing. The daily cron is the right place to say
      # so, because expiry happens with time rather than with a commit — reddening
      # some unrelated PR instead would blame the wrong change.
      #
      # Reuses the linter rather than recomputing dates: one implementation of
      # "expired" and "expiring", so the notice and the gate can never disagree.
      - name: accepted-risk expiries (Req 6.10)
        run: |
          set -uo pipefail
          # Explicit rather than transitive: unlike validate.yml this workflow
          # installs no yamllint, so PyYAML is not already here by accident.
          # Exact pins + hashes (Req 7.5, #74) — one pin surface for every
          # python package CI installs, even though only pyyaml is used here.
          pip install --quiet --require-hashes -r .github/requirements-ci.txt
          scripts/lint-accepted-risk.sh > "$OUT/accepted-risk.txt" 2>&1 || true
          expiring=$(grep -E 'expires in|is in the past' "$OUT/accepted-risk.txt" || true)
          {
            echo "### Accepted risk — expiring"
            echo
            if [ -n "$expiring" ]; then
              printf '%s\n' "$expiring" \
                | sed -E 's/^::(warning|error) file=([^,:]+)[^:]*:://' \
                | sed 's/^/- /'
              echo
              echo "_Each of these needs a fresh decision: fix, avoid, prove it does not apply, or re-accept with a new expiry and a reason it is still the right call._"
            else
              echo "_none_ ✓"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$expiring"

      - name: enrich — EPSS + CISA KEV
        run: |
          set -euo pipefail
          mapfile -t cves < <(grep -E '^CVE-' "$OUT/cves.txt" 2>/dev/null || true)
          # The CISA KEV catalogue was fetched by the invariants step above,
          # fail-closed (Req 6.60); a missing file here means that step did
          # not run, which is itself a failure.
          [ -s "$OUT/kev.json" ] || { echo "::error::no KEV catalogue on disk; the invariants step must run first"; exit 1; }
          # EPSS bulk lookup, comma-separated CVEs (best-effort). MVP catalogue CVE
          # counts sit well under the API's per-request limit; batch if that changes.
          if [ "${#cves[@]}" -gt 0 ]; then
            csv=$(IFS=,; echo "${cves[*]}")
            curl -fsSL "https://api.first.org/data/v1/epss?cve=${csv}" -o "$OUT/epss.json" \
              || echo '{"data":[]}' > "$OUT/epss.json"
          else
            echo '{"data":[]}' > "$OUT/epss.json"
          fi

      - name: dedup — already-open CVE issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Our issues carry a stable marker: <!-- rescan-cve: <ID> -->, where <ID>
          # is the scanner's vulnerability id — a CVE (CVE-2026-1234), a GHSA
          # advisory (GHSA-hrxh-6v49-42gf), or any other id. Extract the whole id
          # from every open `cve` issue so the reporter skips duplicates. A
          # CVE-only match silently re-filed GHSA findings on every daily run.
          bodies=$(gh issue list --state open --label cve --limit 500 --json body --jq '.[].body' || true)
          printf '%s' "$bodies" \
            | grep -oE 'rescan-cve: [A-Za-z0-9][A-Za-z0-9._-]*' \
            | sed 's/^rescan-cve: //' \
            | sort -u | jq -R . | jq -s -c . > "$OUT/existing.json" || echo '[]' > "$OUT/existing.json"
          echo "already open: $(jq 'length' "$OUT/existing.json")"

      - name: build issue set (tested reporter)
        id: report
        run: |
          set -euo pipefail
          go -C triage/rescan run ./cmd/rescan-report \
            --aperture "$(scripts/triage-policy.sh . aperture)" \
            --trivy "$OUT/trivy" --epss "$OUT/epss.json" --kev "$OUT/kev.json" --existing "$OUT/existing.json" \
            > "$OUT/issues.json"
          n=$(jq 'length' "$OUT/issues.json")
          echo "count=${n}" >> "$GITHUB_OUTPUT"
          echo "new CVE issues to file: ${n}"

      - name: Grype second opinion on CRITICAL (Req 6.6)
        if: steps.report.outputs.count != '0'
        run: |
          set -uo pipefail
          # Corroborate each CRITICAL we're about to file, on its affected images.
          jq -r '.[] | select(.severity == "CRITICAL") | .images[]' "$OUT/issues.json" | sort -u \
            | while read -r ref; do
                [ -n "$ref" ] || continue
                echo "::group::grype ${ref}"
                grype "$ref" -o table || echo "::warning::grype failed for ${ref}"
                echo "::endgroup::"
              done

      - name: file new-CVE issues (Req 6.3)
        if: steps.report.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Labels must exist before use; create idempotently.
          gh label create cve               --color B60205 --description "CVE tracked by the rescan cron" 2>/dev/null || true
          gh label create security          --color D93F0B --description "Security finding" 2>/dev/null || true
          # One label per aperture severity (Req 6.49): a fork's wider
          # aperture files issues under labels that exist.
          for sev in $(scripts/triage-policy.sh . aperture | tr ',' ' '); do
            case "$sev" in CRITICAL) color=B60205 ;; HIGH) color=FBCA04 ;; *) color=0E8A16 ;; esac
            gh label create "severity:$(printf '%s' "$sev" | tr '[:upper:]' '[:lower:]')" --color "$color" --description "${sev} severity" 2>/dev/null || true
          done
          jq -c '.[]' "$OUT/issues.json" | while read -r issue; do
            title=$(jq -r '.title'  <<<"$issue")
            body=$(jq -r '.body'    <<<"$issue")
            labels=$(jq -r '.labels | join(",")' <<<"$issue")
            echo "opening: ${title}"
            gh issue create --title "$title" --body "$body" --label "$labels"
          done

      - name: summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Daily rescan"
            if [ -f "$OUT/enumeration.tsv" ]; then
              echo "- enumerated: $(wc -l < "$OUT/enumeration.tsv") platform manifest rows, $(cut -f1 "$OUT/enumeration.tsv" | sort -u | wc -l) repositories, $(cut -f1,2 "$OUT/enumeration.tsv" | sort -u | wc -l) tags ($(awk -F'\t' '$6=="superseded"' "$OUT/enumeration.tsv" | cut -f1,2 | sort -u | wc -l) superseded)"
            fi
            echo "- platform manifests scanned: ${{ steps.scan.outputs.scanned || 0 }} (failed: ${{ steps.scan.outputs.failed || 0 }})"
            echo "- new CVE issues filed: ${{ steps.report.outputs.count || 0 }}"
            echo
            # Req 6.33. Without this the run is green whether every statement
            # applied or none of them did: an unresolved digest suppresses
            # nothing, and the findings it should have excused are deduped away
            # by their own already-open issues. Green, empty issue set, both
            # ways. The counts are what tell those apart.
            echo "#### VEX compilation (Req 6.28-6.30)"
            echo
            if compgen -G "$OUT/vex/*.report.json" > /dev/null; then
              echo "| Image | Scanned digest | Applied | Dropped |"
              echo "|---|---|---|---|"
              jq -r 'if .digest == "" then
                       "| \(.image) | **unresolved — no VEX applied** | – | – |"
                     else
                       "| \(.image) | `\(.digest[0:19])…` | \(.compiled) | \(.dropped) |"
                     end' "$OUT"/vex/*.report.json
              echo
              # Only kind=tag is listed. A statement for another catalogue image
              # was never going to apply and would bury the signal — the last
              # run showed ten such lines around zero interesting ones. A claim
              # scoped to another release is the one worth reading, because from
              # counts alone it looks identical to a correctly-scoped one.
              # Nothing is hidden: the reports in the artifact keep every drop.
              if jq -e -s '[.[].drops[] | select(.kind == "tag")] | length > 0' \
                   "$OUT"/vex/*.report.json >/dev/null; then
                echo "<details><summary>statements scoped to another release, not applied</summary>"
                echo
                jq -r -s '.[] | .image as $i | .drops[] | select(.kind == "tag")
                          | "- **\($i)** — `\(.cve)` \(.reason)"' "$OUT"/vex/*.report.json
                echo
                echo "</details>"
              else
                echo "_every statement for these images applied_ ✓"
              fi
              other=$(jq -r -s '[.[].drops[] | select(.kind != "tag")] | length' "$OUT"/vex/*.report.json)
              [ "$other" -eq 0 ] || echo "<sub>${other} statement(s) skipped as belonging to other images.</sub>"
            else
              echo "_no image reached compilation_"
            fi
            echo
            echo "#### Re-attestation (Req 6.42, 6.43)"
            echo
            if [ -f "$OUT/reattest.jsonl" ]; then
              echo "- re-attested: ${{ steps.reattest.outputs.reattested || 0 }}, unchanged: ${{ steps.reattest.outputs.unchanged || 0 }}, skipped: ${{ steps.reattest.outputs.skipped || 0 }}"
              echo
              echo "| Digest | Reports attested | Previous docs | OpenVEX before (index) | Differs | Re-attested | Rekor retained |"
              echo "|---|---|---|---|---|---|---|"
              jq -r 'if .skipped then "| `\(.repository | split("/") | last)@\(.digest[0:19])…` | – | – | – | – | skipped: \(.skipped) | – |"
                     elif .failed then "| `\(.repository | split("/") | last)@\(.digest[0:19])…` | – | – | – | – | **failed: \(.failed)** | – |"
                     else "| `\(.repository | split("/") | last)@\(.digest[0:19])…` | \(.reports_attested) | \(.previous_documents) | \(.openvex_before.index.openvex) | \(.differs) | \(.reattested)\(if .wrong_count then " (count repaired)" else "" end) | \([.rekor_retained[] | .retained] | if length == 0 then "–" elif all then "yes" else "NO" end) |"
                     end' "$OUT/reattest.jsonl"
            else
              echo "_the re-attestation step did not run_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload rescan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rescan-${{ github.run_id }}
          path: rescan-out/
          if-no-files-found: warn
