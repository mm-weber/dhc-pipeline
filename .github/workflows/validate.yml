name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conventions:
    name: yamllint, pin lint, policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # the active-set lint diffs a pull request against its base (task 14.2)

      # Exact pins + hashes in the requirements file (Req 7.5, #74): pip
      # refuses any artifact whose sha256 is not recorded there.
      - name: yamllint (Req 7.2)
        run: |
          pip install --quiet --require-hashes -r .github/requirements-ci.txt
          yamllint .

      # Req 4.5, 4.8 (task 11.4): the pinned upstream charts and the compat
      # decision have a shape (yamale) and a clock (lint-compat.sh).
      - name: chart pins and compat decisions (Req 4.5, 4.8)
        run: |
          yamale -s chart/chart.schema.yaml \
            chart/cert-manager/chart.yaml chart/grafana/chart.yaml chart/hardened-app/chart.yaml chart/valkey/chart.yaml
          scripts/lint-compat.sh

      # Req 9.6 (task 13.3): every entry of the revocation record fits its
      # schema; a violation names the entry and the field.
      - name: revocation record (Req 9.6)
        run: yamale -s triage/revocations.schema.yaml triage/revocations.yaml

      # Fast deterministic gate; the authoritative definition validator is
      # the dhi.io/build frontend compiling each changed definition (build.yml)
      - name: pin + definition lint against docs/CONVENTIONS.md (Req 1.6, 7.2, 7.4)
        run: scripts/lint-pins.sh

      # Req 1.4 (review D5): every definition runs as a non-root account with
      # uid 65532; nothing read the accounts block before this.
      - name: runtime account lint (Req 1.4)
        run: scripts/lint-accounts.sh

      # Pin + sha256 live in the script (Req 7.5). Invoked by path because the
      # install and the tests share this step, and GITHUB_PATH only reaches
      # the steps after it.
      - name: kyverno policy tests (Req 4.6 gate self-test)
        run: |
          scripts/install-tool.sh kyverno "${RUNNER_TEMP}/bin"
          "${RUNNER_TEMP}/bin/kyverno" test policies/tests/

      # The risk-treatment lane is the only sanctioned way to stop the scan gate
      # failing on a real finding, so its own rules are enforced here rather than
      # in the gate: a malformed exception should be rejected at review time, not
      # discovered when some unrelated PR rebuilds the image it covers.
      # Runs after yamllint, which installs PyYAML as a dependency.
      - name: accepted-risk lint for the risk treatment lane (Req 6.11, 6.12)
        run: scripts/lint-accepted-risk.sh

      # catalogue-policy.yaml is the one committed home of declared values
      # (Req 7.7). The rendered verification artifacts must equal what its
      # verification section declares (Req 7.8, 7.9), and every workflow's
      # literal schedule cron and permissions blocks must match its workflows
      # section (Req 7.10). GitHub reads those only as literal workflow YAML,
      # so this lint is what binds them. Both read YAML via PyYAML, installed
      # by the yamllint step above.
      - name: verification renderings drift check (Req 7.8, 7.9)
        run: scripts/render-verification.sh --check

      - name: workflow schedule + permissions vs policy file (Req 7.10)
        run: scripts/lint-workflow-policy.sh

      # Review D3: the release switches are well-formed, or the run refuses
      # naming the key. build.yml reads them through the same reader, so a
      # value this step accepts is the value the release branches on.
      - name: release switches well-formed (Req 2.13, 2.14, 2.17, 7.7)
        run: scripts/release-policy.sh . check

      # Review disposition D1 (2026-09-09): every step of the rescan after
      # the scan runs regardless of earlier failures (`if: always()` with
      # its producer's outcome), so no daily assertion or the status issue
      # is suspended by an unrelated failure. A step added without it fails
      # here by name.
      - name: rescan steps run regardless of earlier failures (D1)
        run: scripts/lint-rescan-steps.sh

      # The active set (task 14.2): well-formed (Req 1.19), splitting no
      # byte-equal pair or grouped monorepo (Req 1.18), every chart directory
      # naming the definitions it deploys; on a pull request, a change under
      # an inactive definition or under a chart deploying no active
      # definition fails naming it (Req 1.16). The pull request's paths come
      # from the diff against its base; a push to main has nothing to refuse.
      - name: active-set coherence and scope (Req 1.16, 1.18, 1.19)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            git diff --name-only "origin/${BASE_REF}...HEAD" > "${RUNNER_TEMP}/changed"
            scripts/lint-active-set.sh --changed "${RUNNER_TEMP}/changed" .
          else
            scripts/lint-active-set.sh .
          fi

      # Renovate reads no policy file, so the tracking scope reaches it as a
      # rendered ignorePaths block; a hand edit or a stale render goes red
      # here (Req 1.14, 7.9 pattern).
      - name: tracking scope rendering drift check (Req 1.14)
        run: scripts/render-tracking.sh --check

      # Req 5.8 (task 14.3): every active definition is deployed by a chart
      # that declares a functional probe; the Go side (TestProbeDeclarations,
      # below) holds the declared names to the suite's registry.
      - name: every active definition declares a functional probe (Req 5.8)
        run: scripts/lint-probes.sh

      - name: definition-lib unit tests (directory vs published name)
        run: scripts/definition-lib_test.sh

      - name: pin-linter unit tests
        run: scripts/lint-pins_test.sh

      - name: accepted-risk linter unit tests
        run: scripts/lint-accepted-risk_test.sh

      - name: accepted-risk report unit tests (Req 6.26, 6.27)
        run: scripts/accepted-risk-report_test.sh

      - name: refresh-definition unit tests (postUpgradeTask, Req 3.2)
        run: scripts/refresh-definition_test.sh

      - name: refresh-grafana unit tests (postUpgradeTask, ADR 0002)
        run: scripts/refresh-grafana_test.sh

      - name: verify-arch-pins unit tests (Req 1.3)
        run: scripts/verify-arch-pins_test.sh

      - name: render-verification unit tests (Req 7.8, 7.9)
        run: scripts/render-verification_test.sh

      - name: lint-workflow-policy unit tests (Req 7.10)
        run: scripts/lint-workflow-policy_test.sh

      - name: govulncheck-report unit tests (Req 6.13)
        run: scripts/govulncheck-report_test.sh

      - name: install-scanners unit tests (Req 7.5)
        run: scripts/install-scanners_test.sh

      - name: install-tool unit tests (Req 7.5)
        run: scripts/install-tool_test.sh

      - name: VEX product identity lint (Req 6.17, 6.19, 6.20)
        run: scripts/lint-vex-product.sh
      # Req 9.18 (task 13.6): every source statement's log citation resolves
      # to a heading in triage/LOG.md (the exception half runs inside
      # lint-accepted-risk.sh above).
      - name: VEX statement LOG citations (Req 9.18)
        run: scripts/lint-log-anchors.sh statements

      - name: VEX product identity lint unit tests
        run: scripts/lint-vex-product_test.sh

      - name: VEX compiler unit tests (Req 6.28-6.30)
        run: scripts/compile-vex_test.sh

      # Task 9.1 shipped this suite without enumerating it here, so CI never
      # ran it; found and fixed in task 9.2, and the completeness check below
      # is what keeps the list honest from now on.
      - name: scan invocation unit tests (Req 2.8, 2.26)
        run: scripts/scan-image_test.sh

      - name: publish-on-change comparator unit tests (Req 2.15-2.17)
        run: scripts/package-set-diff_test.sh

      - name: catalogue enumeration unit tests (Req 2.22)
        run: scripts/enumerate-catalogue_test.sh

      - name: visibility invariant unit tests (Req 2.21)
        run: scripts/check-visibility_test.sh

      - name: admission proof unit tests (Req 2.24)
        run: scripts/verify-catalogue_test.sh

      - name: triage policy reader unit tests (Req 6.49)
        run: scripts/triage-policy_test.sh

      - name: exception tiering unit tests (Req 6.50, 6.51)
        run: scripts/check-exceptions_test.sh
      - name: re-attestation, replacing (task 10.3, Req 6.42, 6.43, 6.58)
        run: scripts/reattest_test.sh
      - name: fetch-sboms unit tests (Req 6.58)
        run: scripts/fetch-sboms_test.sh
      - name: check-authenticity unit tests (Req 3.10, 4.9)
        run: scripts/check-authenticity_test.sh
      - name: check-governance unit tests (Req 9.3, 9.9)
        run: scripts/check-governance_test.sh
      - name: check-revocations unit tests (Req 9.5 to 9.7)
        run: scripts/check-revocations_test.sh
      - name: no inactive definition gained a digest or a tag (Req 1.15, the detective half)
        run: scripts/check-inactive-digests_test.sh
      - name: vex-consumer adapter unit tests (Req 9.11)
        run: scripts/vex-consumer_test.sh
      - name: vex-portability block unit tests (Req 9.12)
        run: scripts/vex-portability_test.sh
      - name: consumer-smoke unit tests (Req 9.13)
        run: scripts/consumer-smoke_test.sh
      - name: lint-log-anchors unit tests (Req 9.18)
        run: scripts/lint-log-anchors_test.sh

      - name: active-set lint unit tests (Req 1.16, 1.18, 1.19)
        run: scripts/lint-active-set_test.sh

      - name: tracking-scope rendering unit tests (Req 1.14)
        run: scripts/render-tracking_test.sh

      - name: probe lint unit tests (Req 5.8)
        run: scripts/lint-probes_test.sh

      - name: rescan step-condition lint unit tests (D1)
        run: scripts/lint-rescan-steps_test.sh

      - name: release-policy reader unit tests (D3)
        run: scripts/release-policy_test.sh

      - name: runtime account lint unit tests (Req 1.4)
        run: scripts/lint-accounts_test.sh
      - name: lint-compat unit tests (Req 4.5, 4.8)
        run: scripts/lint-compat_test.sh
      - name: render-chart unit tests (Req 4.6; stub helm, the real yq)
        run: scripts/render-chart_test.sh
      - name: exactly one OpenVEX attestation per digest (Req 6.44, 6.45)
        run: scripts/check-attestation-count_test.sh

      # Every script has a suite and every suite is enumerated above, as a
      # live step: a suite that exists but never runs in CI passes locally
      # forever and proves nothing (the scan-image omission, and the same
      # class as the missing-required-check lesson of 2026-08-26). The match
      # is anchored to an uncommented run: line, so a commented-out step no
      # longer satisfies it, and the check runs both ways since review D7:
      # a script without a suite is named too (render-chart.sh was the one).
      - name: every script has a test suite, and every suite runs here
        run: |
          set -euo pipefail
          missing=0
          for t in scripts/*_test.sh; do
            grep -qE "^[[:space:]]*run: ${t}([[:space:]]|$)" .github/workflows/validate.yml || {
              echo "::error file=.github/workflows/validate.yml::${t} exists but no live step runs it"; missing=1; }
          done
          for s in scripts/*.sh; do
            case "$s" in *_test.sh) continue ;; esac
            [ -f "${s%.sh}_test.sh" ] || {
              echo "::error file=${s}::${s} has no ${s%.sh}_test.sh (docs/user-manual.md, Part VI: every script has a suite)"; missing=1; }
          done
          exit "$missing"

      # Renovate config: validate the schema, then prove the custom managers
      # actually extract the right deps from the definitions (Req 3.2).
      - name: renovate config + manager fixtures
        env:
          # Exact pins (Req 7.5); npm verifies each tarball against the
          # registry's integrity hash at install time.
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 41.173.1
          # renovate: datasource=npm depName=json5
          JSON5_VERSION: 2.2.3
        run: |
          npm install --no-save --no-audit --no-fund \
            "renovate@${RENOVATE_VERSION}" "json5@${JSON5_VERSION}"
          ./node_modules/.bin/renovate-config-validator --strict renovate.json5
          NODE_PATH="$PWD/node_modules" node test/renovate/managers.test.mjs

  go-unit:
    name: go modules (e2e + rescan tool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: test/go.mod
          cache-dependency-path: test/go.sum

      # Fast, Docker-free guard on the e2e Go module (Req 5.1). The kind cluster
      # matrix that actually runs the Ginkgo specs is a separate workflow
      # (e2e.yml, task 6.5); here we only compile the whole module and run the
      # pure helper unit tests (harness provisioning + checks assertions) so a
      # broken helper can never merge.
      - name: gofmt
        working-directory: test
        run: test -z "$(gofmt -l .)" || { echo 'gofmt needed:'; gofmt -l .; exit 1; }

      # Named before vet reports the consequence line by line: a go.mod or
      # go.sum that tidy would rewrite (a bump without its sums, a module
      # graph that no longer resolves) fails here with the cause. On a
      # Renovate pull request the cause is its "Artifact update problem"
      # comment (PR #200, 2026-09-10: k8s.io/api moved alone).
      - name: go.mod and go.sum are what go mod tidy would write
        working-directory: test
        run: |
          set -euo pipefail
          # The diff rides in the annotation (newlines as %0A), so the cause
          # is readable from the checks tab without opening the log.
          if ! out=$(go mod tidy -diff 2>&1); then
            printf '%s\n' "$out"
            echo "::error file=test/go.mod::test/go.mod or go.sum is not what go mod tidy would write; on a Renovate pull request read its 'Artifact update problem' comment for the cause%0A$(printf '%s' "$out" | grep -v '^go: downloading' | head -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

      - name: go vet
        working-directory: test
        run: go vet ./...

      - name: go build (compiles suite + helpers)
        working-directory: test
        run: go build ./...

      # ./e2e/ runs cluster-free here (DHC_E2E unset: the Ginkgo specs skip)
      # for its plain unit test, TestProbeDeclarations (task 14.3, Req 5.5,
      # 5.8): every probe a chart declares is registered, every registration
      # is declared. The YAML half of that contract is lint-probes.sh above.
      # ./... rather than a hand-kept package list (review D7): a new package
      # would otherwise build but never test, and nothing would go red.
      - name: helper unit tests
        working-directory: test
        run: go test ./...

      # The CVE rescan reporter (task 7.2) is its own stdlib-only module: a pure,
      # unit-tested tool that the daily rescan.yml drives to open issues
      # unattended. Gate it here (same Go toolchain) so a broken reporter can
      # never merge.
      - name: rescan tool gofmt
        working-directory: triage/rescan
        run: test -z "$(gofmt -l .)" || { echo 'gofmt needed:'; gofmt -l .; exit 1; }

      - name: rescan tool go.mod is what go mod tidy would write
        working-directory: triage/rescan
        run: |
          set -euo pipefail
          if ! out=$(go mod tidy -diff 2>&1); then
            printf '%s\n' "$out"
            echo "::error file=triage/rescan/go.mod::triage/rescan/go.mod is not what go mod tidy would write%0A$(printf '%s' "$out" | grep -v '^go: downloading' | head -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

      - name: rescan tool go vet
        working-directory: triage/rescan
        run: go vet ./...

      - name: rescan tool go test
        working-directory: triage/rescan
        run: go test ./...
