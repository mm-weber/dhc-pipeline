name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conventions:
    name: yamllint, pin lint, policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Exact pins + hashes in the requirements file (Req 7.5, #74): pip
      # refuses any artifact whose sha256 is not recorded there.
      - name: yamllint (Req 7.2)
        run: |
          pip install --quiet --require-hashes -r .github/requirements-ci.txt
          yamllint .

      # Fast deterministic gate; the authoritative definition validator is
      # the dhi.io/build frontend compiling each changed definition (build.yml)
      - name: pin + definition lint against docs/CONVENTIONS.md (Req 1.5, 1.6, 7.4)
        run: scripts/lint-pins.sh

      # Pin + sha256 live in the script (Req 7.5). Invoked by path because the
      # install and the tests share this step, and GITHUB_PATH only reaches
      # the steps after it.
      - name: kyverno policy tests (Req 4.6 gate self-test)
        run: |
          scripts/install-tool.sh kyverno "${RUNNER_TEMP}/bin"
          "${RUNNER_TEMP}/bin/kyverno" test policies/tests/

      # The risk-treatment lane is the only sanctioned way to stop the scan gate
      # failing on a real finding, so its own rules are enforced here rather than
      # in the gate: a malformed exception should be rejected at review time, not
      # discovered when some unrelated PR rebuilds the image it covers.
      # Runs after yamllint, which installs PyYAML as a dependency.
      - name: accepted-risk lint for the risk treatment lane (Req 6.11, 6.12)
        run: scripts/lint-accepted-risk.sh

      # catalogue-policy.yaml is the one committed home of declared values
      # (Req 7.7). The rendered verification artifacts must equal what its
      # verification section declares (Req 7.8, 7.9), and every workflow's
      # literal schedule cron and permissions blocks must match its workflows
      # section (Req 7.10). GitHub reads those only as literal workflow YAML,
      # so this lint is what binds them. Both read YAML via PyYAML, installed
      # by the yamllint step above.
      - name: verification renderings drift check (Req 7.8, 7.9)
        run: scripts/render-verification.sh --check

      - name: workflow schedule + permissions vs policy file (Req 7.10)
        run: scripts/lint-workflow-policy.sh

      - name: definition-lib unit tests (directory vs published name)
        run: scripts/definition-lib_test.sh

      - name: pin-linter unit tests
        run: scripts/lint-pins_test.sh

      - name: accepted-risk linter unit tests
        run: scripts/lint-accepted-risk_test.sh

      - name: accepted-risk report unit tests (Req 6.26, 6.27)
        run: scripts/accepted-risk-report_test.sh

      - name: refresh-definition unit tests (postUpgradeTask, Req 3.2)
        run: scripts/refresh-definition_test.sh

      - name: refresh-grafana unit tests (postUpgradeTask, ADR 0002)
        run: scripts/refresh-grafana_test.sh

      - name: verify-arch-pins unit tests (Req 1.3)
        run: scripts/verify-arch-pins_test.sh

      - name: render-verification unit tests (Req 7.8, 7.9)
        run: scripts/render-verification_test.sh

      - name: lint-workflow-policy unit tests (Req 7.10)
        run: scripts/lint-workflow-policy_test.sh

      - name: govulncheck-report unit tests (Req 6.13)
        run: scripts/govulncheck-report_test.sh

      - name: install-scanners unit tests (Req 7.5)
        run: scripts/install-scanners_test.sh

      - name: install-tool unit tests (Req 7.5)
        run: scripts/install-tool_test.sh

      - name: VEX product identity lint (Req 6.17-6.21)
        run: scripts/lint-vex-product.sh

      - name: VEX product identity lint unit tests
        run: scripts/lint-vex-product_test.sh

      - name: VEX compiler unit tests (Req 6.28-6.30)
        run: scripts/compile-vex_test.sh

      # Task 9.1 shipped this suite without enumerating it here, so CI never
      # ran it; found and fixed in task 9.2, and the completeness check below
      # is what keeps the list honest from now on.
      - name: scan invocation unit tests (Req 2.8, 2.26)
        run: scripts/scan-image_test.sh

      - name: publish-on-change comparator unit tests (Req 2.15-2.17)
        run: scripts/package-set-diff_test.sh

      - name: catalogue enumeration unit tests (Req 2.22)
        run: scripts/enumerate-catalogue_test.sh

      - name: visibility invariant unit tests (Req 2.21)
        run: scripts/check-visibility_test.sh

      # Every script suite must be enumerated above: a suite that exists but
      # never runs in CI passes locally forever and proves nothing (the
      # scan-image omission, and the same class as the missing-required-check
      # lesson of 2026-08-26).
      - name: every script test suite is enumerated in this workflow
        run: |
          set -euo pipefail
          missing=0
          for t in scripts/*_test.sh; do
            grep -qF "run: $t" .github/workflows/validate.yml || {
              echo "::error file=.github/workflows/validate.yml::${t} exists but no step runs it"; missing=1; }
          done
          exit "$missing"

      # Renovate config: validate the schema, then prove the custom managers
      # actually extract the right deps from the definitions (Req 3.2).
      - name: renovate config + manager fixtures
        env:
          # Exact pins (Req 7.5); npm verifies each tarball against the
          # registry's integrity hash at install time.
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 41.173.1
          # renovate: datasource=npm depName=json5
          JSON5_VERSION: 2.2.3
        run: |
          npm install --no-save --no-audit --no-fund \
            "renovate@${RENOVATE_VERSION}" "json5@${JSON5_VERSION}"
          ./node_modules/.bin/renovate-config-validator --strict renovate.json5
          NODE_PATH="$PWD/node_modules" node test/renovate/managers.test.mjs

  go-unit:
    name: go modules (e2e + rescan tool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: test/go.mod
          cache-dependency-path: test/go.sum

      # Fast, Docker-free guard on the e2e Go module (Req 5.1). The kind cluster
      # matrix that actually runs the Ginkgo specs is a separate workflow
      # (e2e.yml, task 6.5); here we only compile the whole module and run the
      # pure helper unit tests (harness provisioning + checks assertions) so a
      # broken helper can never merge.
      - name: gofmt
        working-directory: test
        run: test -z "$(gofmt -l .)" || { echo 'gofmt needed:'; gofmt -l .; exit 1; }

      - name: go vet
        working-directory: test
        run: go vet ./...

      - name: go build (compiles suite + helpers)
        working-directory: test
        run: go build ./...

      - name: helper unit tests
        working-directory: test
        run: go test ./harness/... ./checks/... ./install/...

      # The CVE rescan reporter (task 7.2) is its own stdlib-only module: a pure,
      # unit-tested tool that the daily rescan.yml drives to open issues
      # unattended. Gate it here (same Go toolchain) so a broken reporter can
      # never merge.
      - name: rescan tool gofmt
        working-directory: triage/rescan
        run: test -z "$(gofmt -l .)" || { echo 'gofmt needed:'; gofmt -l .; exit 1; }

      - name: rescan tool go vet
        working-directory: triage/rescan
        run: go vet ./...

      - name: rescan tool go test
        working-directory: triage/rescan
        run: go test ./...
