name: e2e

# Phase-6 integration suite (Req 5.2). For each chart-backed component
# a PR touches, provision an ephemeral kind cluster whose pods pull the
# component's digest-pinned ghcr.io/mm-weber/dhc images straight from the
# registry (pulled, not kind-loaded — the credentials step below says why),
# install the hardened chart, and run
# the Ginkgo suite — which asserts readiness (Req 5.3), the restricted
# securityContext on live pods (Req 5.4), and the functional probe (Req 5.5); on
# a bump — chart version or image pins in the values file — it runs the
# upgrade path instead (Req 5.6). Diagnostics
# are uploaded on failure (Req 5.7). GitHub Actions is the authoritative
# environment for this — chart repos and Docker Hub are unreachable from the
# devcontainer (an operating convention; Req 8 retired 2026-08-26).

on:
  pull_request:
  workflow_dispatch:
    inputs:
      component:
        description: "Single component (a chart directory deploying an active definition); empty = all"
        required: false
        type: string

permissions:
  contents: read
  packages: read # pull the ghcr.io/mm-weber/dhc images

jobs:
  # Which chart-backed components does this PR touch? Emits a JSON array for the
  # matrix. A component is a chart directory whose `deploys:` list meets the
  # active set (Req 1.14, 5.2; task 14.2), and a changed definition reaches its
  # component through that list, never through a name prefix: three definitions
  # share cert-manager's chart, and the valkey chart deploys the compat variant
  # on the runtime definition's behalf.
  affected:
    name: affected components
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.detect.outputs.names }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          DISPATCH: ${{ github.event.inputs.component }}
        run: |
          set -euo pipefail
          . scripts/definition-lib.sh
          # "<chart>\t<its active definitions>" per component; a malformed
          # active set is the reader's refusal and fails this job (and so the
          # e2e gate) by name.
          active_components . > "${RUNNER_TEMP}/components"
          ALL=$(cut -f1 "${RUNNER_TEMP}/components")
          # The simplest component for a harness smoke test: hardened-app
          # while it is active, else the first component there is.
          simplest=$(printf '%s\n' "$ALL" | grep -xF hardened-app || printf '%s\n' "$ALL" | head -n1)

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$DISPATCH" ]; then
              if ! printf '%s\n' "$ALL" | grep -qxF -- "$DISPATCH"; then
                echo "::error::dispatch names '${DISPATCH}', which is no chart directory deploying an active definition (chart/*/chart.yaml deploys, catalogue-policy.yaml active_set; Req 1.14, 5.2)"
                exit 1
              fi
              names=$DISPATCH
            else
              names=$ALL
            fi
          else
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            names=""
            while IFS=$'\t' read -r c defs; do
              [ -n "$c" ] || continue
              # affected if the component's chart or any active definition it deploys changed
              pattern="^chart/${c}/"
              for d in $defs; do pattern="${pattern}|^image/${d}/"; done
              if printf '%s\n' "$changed" | grep -qE "$pattern"; then
                names="$names $c"
              fi
            done < "${RUNNER_TEMP}/components"
            # When the e2e harness itself changes (this workflow or the Go suite),
            # smoke-test it on the simplest component so a harness edit is exercised.
            if printf '%s\n' "$changed" | grep -qE '^\.github/workflows/e2e\.yml$|^test/(e2e|checks|install|harness)/'; then
              names="$names $simplest"
            fi
          fi

          json=$(printf '%s\n' $names | jq -R . | jq -s -c 'map(select(length>0)) | unique')
          echo "names=$json" >> "$GITHUB_OUTPUT"
          if [ "$json" = "[]" ]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi
          echo "affected: $json"

  e2e:
    name: e2e ${{ matrix.component }}
    needs: affected
    if: needs.affected.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.affected.outputs.names) }}
    env:
      CLUSTER: dhc-e2e
      # The HTTP probe's image (task 6.5): curl's own container from the curl
      # project's registry, pinned by digest (review D4: it was a mutable
      # Docker Hub tag, the CVE-2026-33634 re-publication shape). Pulled by
      # digest and loaded into kind under its tag; the suite receives the tag
      # it loaded, since a loaded image cannot match an index digest (the
      # reason the catalogue images are pulled, below). Test scaffolding, not
      # a shipped image; the probe-image Renovate manager tracks it.
      PROBE_IMAGE: ghcr.io/curl/curl-container/curl-multi:8.11.1@sha256:2db4e6a8fd6a0e4d0db5828b2722cf6db15c3005178a4c65588b903e4784ba11
      ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: test/go.mod
          cache-dependency-path: test/go.sum

      # Pin + sha256 live in the script (Req 7.5); installed as the runner
      # user, same pattern as install-scanners.sh in build.yml — the old
      # curl + sudo mv was unverified and never needed root. helm likewise
      # (#74): its azure/setup-helm predecessor had no version input, so each
      # run installed whatever upstream's latest was that day, unverified.
      - name: install helm + kind
        run: |
          scripts/install-tool.sh helm "${RUNNER_TEMP}/bin"
          scripts/install-tool.sh kind "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: create kind cluster
        run: |
          kind create cluster --name "$CLUSTER" --wait 120s
          kind export kubeconfig --name "$CLUSTER"
          echo "E2E_KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      # Pods pull the ghcr.io/mm-weber/dhc images from the registry. Loading
      # them with `kind load` does not work: the charts pin the multi-arch
      # INDEX digest (from `imagetools inspect`), but a loaded image carries a
      # single-arch manifest digest, so containerd never matches
      # repo:tag@indexdigest and tries to pull it. So give kubelet a
      # config.json and let pods pull the exact index digest straight from
      # ghcr — uniform across every chart, and digest pinning is kept.
      #
      # The packages are PUBLIC since the 2026-08-13 go-live, so the
      # credentials are no longer required for the pull itself. The step stays
      # because it makes this suite independent of package visibility: a
      # package flipped private (or a new definition published private-first)
      # breaks nothing here.
      - name: give kind nodes ghcr pull credentials
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          auth=$(printf '%s:%s' "$ACTOR" "$TOKEN" | base64 -w0)
          cfg=$(mktemp)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" > "$cfg"
          for node in $(kind get nodes --name "$CLUSTER"); do
            docker cp "$cfg" "${node}:/var/lib/kubelet/config.json"
            docker exec "$node" systemctl restart kubelet
          done
          rm -f "$cfg"
          # kubelet restart briefly flips the node NotReady; wait before testing.
          kubectl wait --for=condition=Ready nodes --all --timeout=120s

      - name: load probe image into kind
        id: probe
        run: |
          set -euo pipefail
          # Pull by digest, load by tag: the bytes are the pinned ones, the
          # name is what containerd matches a pod's image against.
          docker pull "$PROBE_IMAGE"
          docker tag "$PROBE_IMAGE" "${PROBE_IMAGE%@*}"
          kind load docker-image --name "$CLUSTER" "${PROBE_IMAGE%@*}"
          echo "tag=${PROBE_IMAGE%@*}" >> "$GITHUB_OUTPUT"

      # On a bump the upgrade-path spec (Req 5.6) installs the base state then
      # upgrades to the proposed one. Two bump shapes: a chart bump moves
      # chart/<c>/chart.yaml upstream.version (adapted charts only), an image
      # bump moves the values file the chart deploys with — the ordinary
      # Renovate path now that the chart-pin managers track image tags+digests
      # there (task 8.7). For an image bump the BASE branch's values are
      # snapshotted to a file the suite installs from before upgrading.
      - name: compute upgrade-from on a bump
        id: upgrade
        env:
          COMPONENT: ${{ matrix.component }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          [ -n "${BASE_REF:-}" ] || exit 0
          pinfile="chart/${COMPONENT}/chart.yaml"
          if [ -f "$pinfile" ]; then
            head_ver=$(yq '.upstream.version' "$pinfile" | tr -d '"')
            base_ver=$(git show "origin/${BASE_REF}:${pinfile}" 2>/dev/null | yq '.upstream.version' | tr -d '"' || echo "")
            if [ -n "$base_ver" ] && [ "$base_ver" != "null" ] && [ "$base_ver" != "$head_ver" ]; then
              echo "from=$base_ver" >> "$GITHUB_OUTPUT"
              echo "upgrade path (chart): ${base_ver} -> ${head_ver}"
            fi
          fi
          # Adapted charts deploy config/values-hardened.yaml, owned charts
          # their baked-in values.yaml. A snapshot that cannot be produced
          # (chart is new on this PR, no base state exists) means a plain
          # install, not an upgrade.
          valfile="chart/${COMPONENT}/config/values-hardened.yaml"
          [ -f "$valfile" ] || valfile="chart/${COMPONENT}/values.yaml"
          if [ -f "$valfile" ] && ! git diff --quiet "origin/${BASE_REF}...HEAD" -- "$valfile"; then
            if git show "origin/${BASE_REF}:${valfile}" > "${RUNNER_TEMP}/values-from.yaml" 2>/dev/null; then
              echo "values_from=${RUNNER_TEMP}/values-from.yaml" >> "$GITHUB_OUTPUT"
              echo "upgrade path (image/values): ${valfile} changed against ${BASE_REF}"
            fi
          fi

      - name: run e2e suite
        working-directory: test
        env:
          COMPONENT: ${{ matrix.component }}
          DHC_E2E: "1"
          DHC_PROBE_IMAGE: ${{ steps.probe.outputs.tag }}
          DHC_UPGRADE_FROM: ${{ steps.upgrade.outputs.from }}
          DHC_UPGRADE_VALUES_FROM: ${{ steps.upgrade.outputs.values_from }}
          DHC_ARTIFACTS: ${{ env.ARTIFACTS }}
        run: go test ./e2e/ -v -timeout 25m -args --chart "$COMPONENT"

      # Belt-and-suspenders diagnostics beyond the suite's own dump (Req 5.7).
      - name: collect diagnostics on failure
        if: failure()
        run: |
          set +e
          mkdir -p "$ARTIFACTS"
          kubectl get all -A                                  > "$ARTIFACTS/all.txt"           2>&1
          kubectl get events -A --sort-by=.lastTimestamp      > "$ARTIFACTS/events.txt"        2>&1
          kubectl describe pods -A                            > "$ARTIFACTS/pods-describe.txt" 2>&1
          # per-pod logs (incl. the curl probe Job) — the suite dump has no logs
          kubectl get pods -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}' \
            | while IFS=/ read -r ns name; do
                [ -n "$name" ] || continue
                kubectl logs -n "$ns" "$name" --all-containers=true --tail=-1 --prefix \
                  > "$ARTIFACTS/logs_${ns}_${name}.txt" 2>&1
              done
          kind export logs "$ARTIFACTS/kind-logs" --name "$CLUSTER"

      - name: upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ matrix.component }}
          path: e2e-artifacts/
          if-no-files-found: warn

      - name: delete kind cluster
        if: always()
        run: kind delete cluster --name "$CLUSTER" || true

  # Static fan-in for branch protection — same reason as the build gate: the
  # matrix legs (e2e <component>) are dynamic, so this is the requirable check.
  gate:
    name: e2e gate
    needs: [affected, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          AFFECTED: ${{ needs.affected.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          [ "$AFFECTED" = "success" ] || { echo "::error::affected: $AFFECTED"; exit 1; }
          case "$E2E" in
            success|skipped) echo "e2e: $E2E" ;;
            *) echo "::error::e2e result: $E2E"; exit 1 ;;
          esac
