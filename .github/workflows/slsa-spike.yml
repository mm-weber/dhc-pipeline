name: slsa spike

# Task 18.2, phase 1 of track slsa-build-l2_20261028, the input to ADR 0005.
#
# This file lives on its branch and is never merged. One run builds one scratch
# image, pushes it to a repository OUTSIDE catalogue-policy.yaml's
# verification.registry, attests it with GitHub's provenance service, and then
# measures which verifier can read that attestation and what the predicate
# actually carries. Nothing it does touches a catalogue repository. The package
# is deleted once the ADR is written (phase 1, task 1.3).
#
# Two triggers, because a workflow_dispatch is only offered for a workflow that
# exists on the default branch, and this one deliberately never lands there: the
# dispatch is tried first, and the pull_request path is the fallback, firing once
# when the owner opens the pull request for this branch. Either way the run is
# started by a maintainer and happens once.
#
# No dispatch input: Req 7.7 declares every input a workflow accepts, and this
# one asks for nothing.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/slsa-spike.yml

permissions: {}

env:
  # Outside verification.registry (ghcr.io/mm-weber/dhc) by construction: the
  # spec's drafted name, deleted after the ADR.
  SPIKE_IMAGE: ghcr.io/mm-weber/slsa-spike
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  spike:
    name: provenance from the platform, measured
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: refuse to run against a catalogue repository
        env:
          REGISTRY_DECL: ghcr.io/mm-weber/dhc
        run: |
          set -euo pipefail
          case "${SPIKE_IMAGE}/" in
            "${REGISTRY_DECL}/"*)
              echo "::error::${SPIKE_IMAGE} is inside the declared catalogue namespace ${REGISTRY_DECL}; the spike must never publish there (task 18.2)"
              exit 1 ;;
          esac
          echo "spike target ${SPIKE_IMAGE} is outside ${REGISTRY_DECL}"

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: log in to ghcr.io
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: the scratch context
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ctx"
          printf 'slsa provenance spike, run %s\n' "${GITHUB_RUN_ID}" > "${RUNNER_TEMP}/ctx/spike.txt"
          # FROM scratch: no base image, so no pin and no upstream to verify.
          # Two platforms, so the push mints an index over two manifests and the
          # subjects below cover one of each (task 18.2).
          cat > "${RUNNER_TEMP}/ctx/Dockerfile" <<'EOF'
          FROM scratch
          COPY spike.txt /spike.txt
          EOF

      - name: build and push the scratch image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ runner.temp }}/ctx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.SPIKE_IMAGE }}:run-${{ github.run_id }}
          # BuildKit's own provenance is what L2 found wanting; off here so the
          # measurement reads the platform's attestation and nothing else.
          provenance: false
          sbom: false

      - name: the two subjects
        id: subjects
        env:
          REF: ${{ env.SPIKE_IMAGE }}:run-${{ github.run_id }}
          INDEX: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "index=${INDEX}" >> "$GITHUB_OUTPUT"
          token=$(curl -sS "https://ghcr.io/token?scope=repository:${SPIKE_IMAGE#ghcr.io/}:pull&service=ghcr.io" | jq -r .token)
          amd64=$(curl -sS -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${SPIKE_IMAGE#ghcr.io/}/manifests/${INDEX}" \
            | jq -r '.manifests[] | select(.platform.architecture=="amd64" and .platform.os=="linux") | .digest')
          [ -n "$amd64" ] || { echo "::error::no linux/amd64 manifest under ${INDEX}"; exit 1; }
          echo "amd64=${amd64}" >> "$GITHUB_OUTPUT"
          echo "index ${INDEX}, amd64 ${amd64}"

      - name: attest the index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.SPIKE_IMAGE }}
          subject-digest: ${{ steps.subjects.outputs.index }}
          push-to-registry: true

      - name: attest the amd64 manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.SPIKE_IMAGE }}
          subject-digest: ${{ steps.subjects.outputs.amd64 }}
          push-to-registry: true

      - name: install the verifiers at this repository's pins
        run: |
          set -euo pipefail
          scripts/install-tool.sh cosign "${RUNNER_TEMP}/bin"
          scripts/install-tool.sh kyverno "${RUNNER_TEMP}/bin"
          scripts/install-scanners.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: the reads
        if: always()
        env:
          INDEX: ${{ steps.subjects.outputs.index }}
          AMD64: ${{ steps.subjects.outputs.amd64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub runs a step under `bash -e`, and a read that refuses is a
          # result here, not a failure: the first run died because the
          # referrers API answered "manifest unknown" and jq exited 5 on the
          # null. Every read below is allowed to fail and say so.
          set +e
          set -uo pipefail
          repo="${SPIKE_IMAGE#ghcr.io/}"
          say() { printf '\n## %s\n\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          run() { printf '```\n$ %s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; "$@" >"${RUNNER_TEMP}/out" 2>&1; rc=$?; sed -n '1,40p' "${RUNNER_TEMP}/out" >> "$GITHUB_STEP_SUMMARY"; printf '\n(exit %s)\n```\n' "$rc" >> "$GITHUB_STEP_SUMMARY"; sed -n '1,20p' "${RUNNER_TEMP}/out"; echo "(exit $rc)"; }
          anon=$(curl -sS "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" | jq -r .token)

          say "where the attestation sits"
          # Two routes, and which one answers is the finding. The OCI referrers
          # API is the standard one; ghcr.io does not serve it, so the fallback
          # tag `sha256-<subject digest>` that the action also pushes is what a
          # consumer actually has to read.
          for d in "$INDEX" "$AMD64"; do
            printf '\n`%s` through the referrers API:\n```json\n' "$d" >> "$GITHUB_STEP_SUMMARY"
            curl -sS -H "Authorization: Bearer ${anon}" "https://ghcr.io/v2/${repo}/referrers/${d}" \
              | jq '{mediaType, errors, manifests: [(.manifests // [])[] | {artifactType, digest, annotations}]}' \
              2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            printf '```\n\n`%s` through the fallback tag, read anonymously:\n```json\n' "$d" >> "$GITHUB_STEP_SUMMARY"
            curl -sS -H "Authorization: Bearer ${anon}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              "https://ghcr.io/v2/${repo}/manifests/sha256-${d#sha256:}" \
              | jq '{mediaType, manifests: [(.manifests // [])[] | {artifactType, digest, annotations}]}' \
              2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          done

          say "the predicate as emitted"
          bundle=$(curl -sS -H "Authorization: Bearer ${anon}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/${repo}/manifests/sha256-${INDEX#sha256:}" \
            | jq -r '(.manifests // [])[0].digest // empty')
          if [ -z "$bundle" ]; then
            printf 'no attestation referrer found for the index; the reads below cannot run\n' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          man=$(curl -sS -H "Authorization: Bearer ${anon}" -H 'Accept: application/vnd.oci.image.manifest.v1+json' "https://ghcr.io/v2/${repo}/manifests/${bundle}")
          layer=$(printf '%s' "$man" | jq -r '.layers[0].digest')
          printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
          curl -sSL -H "Authorization: Bearer ${anon}" "https://ghcr.io/v2/${repo}/blobs/${layer}" \
            | jq -r '.dsseEnvelope.payload // .payload' | base64 -d \
            | jq '{predicateType, subject, predicate: {buildDefinition: {buildType: .predicate.buildDefinition.buildType, externalParameters: .predicate.buildDefinition.externalParameters, resolvedDependencies: .predicate.buildDefinition.resolvedDependencies}, runDetails: .predicate.runDetails}}' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

          say "gh attestation verify, with a token"
          run gh attestation verify "oci://${SPIKE_IMAGE}@${INDEX}" --owner "${GITHUB_REPOSITORY_OWNER}" --bundle-from-oci
          say "gh attestation verify, without a token"
          GH_TOKEN= run gh attestation verify "oci://${SPIKE_IMAGE}@${INDEX}" --owner "${GITHUB_REPOSITORY_OWNER}" --bundle-from-oci

          say "cosign $(cosign version --json 2>/dev/null | jq -r .gitVersion 2>/dev/null || echo 2.6.5)"
          run cosign verify-attestation --type slsaprovenance1 \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            "${SPIKE_IMAGE}@${INDEX}"

          # The log host is not reachable from where the measurement is read,
          # and a job summary is not served by the REST API; an annotation is.
          # So each read below that decides something is also said as a notice.
          note() { local body; body=$(sed -n '1,30p' "${RUNNER_TEMP}/out" | cut -c1-300); body="${body//'%'/%25}"; body="${body//$'\r'/%0D}"; body="${body//$'\n'/%0A}"; echo "::notice title=$1 (exit ${rc})::${body}"; }

          say "cosign, the platform manifest"
          run cosign verify-attestation --type slsaprovenance1 \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            "${SPIKE_IMAGE}@${AMD64}"
          note "cosign platform manifest signing identity"
          say "cosign, the control: an identity that did not sign"
          run cosign verify-attestation --type slsaprovenance1 \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}-not/" \
            "${SPIKE_IMAGE}@${INDEX}"
          note "cosign index identity that did not sign"

          say "kyverno $(kyverno version 2>/dev/null | head -1)"
          # The second run skipped the policy before reading anything: a
          # keyless attestor needs its transparency log named, as the rendered
          # policy does (render-verification.sh). Two shapes are measured, the
          # one the catalogue's policy uses today and the one kyverno documents
          # for a sigstore bundle. The third run refused all four reads: the
          # bundle shape matches `subject` exactly (verify.
          # NewShortCertificateIdentity in kyverno v1.19.2's
          # pkg/image/verifiers/cpol/cosign/sigstore.go) where the cosign shape
          # takes a wildcard, and the spike had given it a wildcard. So the
          # bundle shape is read with the exact identity, with a regular
          # expression, and with an identity that did not sign, so a pass that
          # checks nothing shows. The fifth run adds what criterion 2.28 asks
          # beyond the signer: the five expectations as conditions on the
          # predicate, once as emitted and once with a ref that was not built.
          # A condition's key is read from inside the predicate (kyverno adds
          # the predicate, not the statement, to the context: EvaluateConditions
          # in pkg/engine/internal/utils.go), so it names no `predicate.` prefix;
          # the fifth run named one and every condition failed to resolve.
          signer="https://github.com/${GITHUB_WORKFLOW_REF}"
          cat > "${RUNNER_TEMP}/pod.yaml" <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: spike
          spec:
            containers:
              - name: spike
                image: ${SPIKE_IMAGE}@${INDEX}
          EOF
          while IFS='|' read -r label shape field value ref; do
              cat > "${RUNNER_TEMP}/policy.yaml" <<EOF
          apiVersion: kyverno.io/v1
          kind: ClusterPolicy
          metadata:
            name: slsa-spike
          spec:
            validationFailureAction: Enforce
            background: false
            rules:
              - name: provenance
                match:
                  any:
                    - resources:
                        kinds: [Pod]
                verifyImages:
                  - type: ${shape}
                    imageReferences: ["${SPIKE_IMAGE}*"]
                    attestations:
                      - type: https://slsa.dev/provenance/v1
                        attestors:
                          - entries:
                              - keyless:
                                  ${field}: "${value}"
                                  issuer: ${OIDC_ISSUER}
                                  rekor:
                                    url: https://rekor.sigstore.dev
                        conditions:
                          - all:
                              - key: "{{ runDetails.builder.id }}"
                                operator: Equals
                                value: "${signer}"
                              - key: "{{ buildDefinition.buildType }}"
                                operator: Equals
                                value: "https://actions.github.io/buildtypes/workflow/v1"
                              - key: "{{ buildDefinition.externalParameters.workflow.repository }}"
                                operator: Equals
                                value: "https://github.com/${GITHUB_REPOSITORY}"
                              - key: "{{ buildDefinition.externalParameters.workflow.path }}"
                                operator: Equals
                                value: ".github/workflows/slsa-spike.yml"
                              - key: "{{ buildDefinition.externalParameters.workflow.ref }}"
                                operator: Equals
                                value: "${ref}"
          EOF
              printf '\n%s (shape `%s`, `%s: %s`):\n' "$label" "$shape" "$field" "$value" >> "$GITHUB_STEP_SUMMARY"
              run kyverno apply "${RUNNER_TEMP}/policy.yaml" --resource "${RUNNER_TEMP}/pod.yaml" </dev/null
              note "kyverno ${label}"
          done <<EOF
          bundle shape exact identity and the five expectations|SigstoreBundle|subject|${signer}|${GITHUB_REF}
          bundle shape a ref that was not built|SigstoreBundle|subject|${signer}|refs/heads/main
          bundle shape regular expression|SigstoreBundle|subjectRegExp|^https://github.com/${GITHUB_REPOSITORY}/.*|${GITHUB_REF}
          bundle shape identity that did not sign|SigstoreBundle|subject|${signer}-not|${GITHUB_REF}
          cosign shape exact identity|Cosign|subject|${signer}|${GITHUB_REF}
          EOF

          say "trivy $(trivy --version 2>/dev/null | head -1)"
          printf 'trivy has no verb that verifies a sigstore provenance bundle; the attestation subcommands it does carry:\n```\n' >> "$GITHUB_STEP_SUMMARY"
          trivy --help 2>&1 | grep -iE "attest|vex|sbom" | tee -a "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

          say "what the owner deletes afterwards"
          printf 'package `slsa-spike`, versions tagged `run-%s` plus the two attestation referrers (task 18.2, 1.3)\n' "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
