name: chart

# Chart policy gate (Req 4.6): every chart is rendered and its manifests are
# evaluated by the Kyverno policies (digest pinning, allowed registry, non-root).
# Owned charts (Chart.yaml) additionally get `ct lint`. The kind-based install
# (ct install / functional probes) is the e2e suite's job (phase 6).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: render + policy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Pin + sha256 for all three binaries live in the script (Req 7.5).
      # Replaces curl piped into tar (kyverno), azure/setup-helm with no
      # version input (latest helm, unverified), and chart-testing-action
      # (version-pinned ct, checksum-unverified) — issue #74. ct's runtime
      # python deps (yamllint, yamale) install hash-verified from the pinned
      # requirements file; the user-site bin dir joins PATH explicitly so ct
      # finds them wherever the runner's pip puts console scripts.
      - name: install helm + ct + kyverno
        run: |
          scripts/install-tool.sh helm "${RUNNER_TEMP}/bin"
          scripts/install-tool.sh ct "${RUNNER_TEMP}/bin"
          scripts/install-tool.sh kyverno "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          pip install --quiet --require-hashes -r .github/requirements-ci.txt
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: render every chart and gate with kyverno (Req 4.6)
        run: |
          set -euo pipefail
          rc=0
          for d in chart/*/; do
            echo "::group::$d"
            if scripts/render-chart.sh "$d" > /tmp/rendered.yaml; then
              kyverno apply \
                policies/require-image-digest.yaml \
                policies/restrict-registries.yaml \
                policies/require-nonroot.yaml \
                --resource /tmp/rendered.yaml || rc=1
            else
              echo "::error::failed to render $d"; rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: ct lint owned charts
        run: |
          set -euo pipefail
          for d in chart/*/; do
            if [ -f "${d}Chart.yaml" ]; then
              echo "ct lint ${d}"
              ct lint --charts "${d%/}" \
                --lint-conf "${RUNNER_TEMP}/bin/ct-etc/lintconf.yaml" \
                --chart-yaml-schema "${RUNNER_TEMP}/bin/ct-etc/chart_schema.yaml" \
                --check-version-increment=false \
                --validate-maintainers=false
            fi
          done
