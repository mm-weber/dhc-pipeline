name: build

# PR: build every affected definition for amd64 through the dhi.io/build
# frontend — no push, just prove it compiles (fast gate; both arches are a
# release concern, Req 2.1) — then load it into the docker daemon and run the
# CVE scan gate: Trivy over HIGH/CRITICAL, failing on anything not excused by an
# OpenVEX statement in triage/vex/ (Req 6.1), with a Grype second opinion
# whenever a CRITICAL is present (Req 6.6).
# main: same build, then push to the declared registry namespace
# (catalogue-policy.yaml verification.registry, task 14.1) with a cosign
# keyless signature, an SPDX SBOM (Syft), and BuildKit provenance attached
# (Req 2.2), tags derived from the definition (Req 2.3). Any failure publishes
# nothing (Req 2.5). Req 2.4's private-package guard was removed at the
# 2026-08-13 public release — its WHILE clause ended with the visibility flip.
#
# Builds run on GitHub Actions runners — the authoritative build environment
# (Req 8.1). Pulling the frontend + golang builder needs a dhi.io login:
# operator adds repo secrets DHI_USERNAME + DHI_TOKEN (Docker Hub creds with
# DHI access). GHCR uses the built-in GITHUB_TOKEN.

on:
  pull_request:
  push:
    branches: [main]
  # Req 2.14: the daily rebuild of the active set. The cron is DECLARED in
  # catalogue-policy.yaml (release.schedule) and lint-workflow-policy.sh holds
  # this literal equal to it; 04:47 UTC sits before the 06:17 rescan so the
  # rescan's first enumeration of the day sees tonight's digests. Whether a
  # scheduled rebuild actually publishes is the comparator's verdict plus the
  # declared publish policy (Req 2.15-2.17), decided per definition below.
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      image:
        description: "Single image name to build (empty = all definitions)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Which definitions does this event touch? Emits a JSON array of image names
  # for the build matrix. PR: diff vs base. push: diff vs previous commit.
  # dispatch: the named image, or all definitions when left blank.
  changes:
    name: affected definitions
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.detect.outputs.names }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DISPATCH_IMAGE: ${{ github.event.inputs.image }}
        run: |
          set -euo pipefail
          . scripts/definition-lib.sh
          # Req 1.14 (task 14.2): catalogue-policy.yaml's active set is the
          # sole source of candidates for this matrix, every branch below
          # filters through it, and an inactive definition gets no new digest
          # or tag whatever changed (Req 1.15). A malformed set is the
          # reader's refusal: this job fails, the build gate with it, so
          # nothing merges on a set that names nothing buildable.
          active=$(active_definitions .)
          is_active() { printf '%s\n' "$active" | grep -qxF -- "$1"; }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$DISPATCH_IMAGE" ]; then
              if ! is_active "$DISPATCH_IMAGE"; then
                echo "::error::dispatch names '${DISPATCH_IMAGE}', which is not in catalogue-policy.yaml's active set; an inactive definition gets no new digest or tag (Req 1.15)"
                exit 1
              fi
              names=$DISPATCH_IMAGE
            else names=$active; fi
          elif [ "$EVENT" = "schedule" ]; then
            # Req 2.14: the daily rebuild covers every active definition.
            # `github.event.before` is empty on a schedule, so the push-diff
            # fallback below would diff HEAD~1 and rebuild nothing (independent
            # review 1.10); the declared set is what a schedule reads.
            names=$active
          elif [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            names=$(printf '%s\n' "$changed" | awk -F/ '$1=="image" && NF>=3 && $3=="image.yaml"{print $2}' | sort -u)
            # A VEX change must be validated against the images its statements
            # actually name — the whole point of the gate on such a PR is to
            # prove the statement suppresses the finding it claims to. Derive
            # them from the product purls (pkg:oci/<name>?...).
            #
            # A purl name is the PUBLISHED repository, not a directory: a variant
            # publishes under its runtime sibling's name (docs/CONVENTIONS.md,
            # "Naming"), so `valkey` is two definitions. Taken as a directory it
            # built only the one of that name, where compilation drops the
            # variant's statements on the tag check (Req 6.30) — the claim never
            # exercised, and nothing red to say so.
            changed_vex=$(printf '%s\n' "$changed" | grep '^triage/vex/' || true)
            if [ -n "$changed_vex" ]; then
              . scripts/definition-lib.sh
              # Only the images whose statements CHANGED, not every image any
              # statement in the directory names: since compilation (task
              # 7.9) each image's gate input derives solely from statements
              # naming it, so an untouched image's input provably cannot
              # change, and the old whole-directory rule turned every VEX PR
              # into a full-catalogue triage session (measured 2026-09-02 on
              # PR #122: a cert-manager statement rebuilt grafana into its
              # accumulated backlog). Both sides of the change count: a
              # DELETED or edited statement still rebuilds the images its
              # BASE version names, so removing a claim re-proves the gate
              # without it.
              vexprods=$(for f in $changed_vex; do
                  { [ -f "$f" ] && cat "$f"; git show "origin/${BASE_REF}:${f}" 2>/dev/null || true; } \
                    | jq -r '.statements[]?.products[]?."@id" // empty' 2>/dev/null || true
                done | sed -nE 's#^pkg:oci/([^@?/]+).*#\1#p' | sort -u)
              for product in $vexprods; do
                names="$names $(definitions_publishing . "$product" | cut -d/ -f2)"
              done
            fi
            # Canary: a change to the gate itself touches no definition — build
            # the simplest image so the gate is exercised on the PR changing it:
            # hardened-app while it is active, else the first active definition.
            if printf '%s\n' "$changed" | grep -qE '^\.github/workflows/build\.yml$'; then
              if is_active hardened-app; then names="$names hardened-app"; else names="$names $(printf '%s\n' "$active" | head -n1)"; fi
            fi
            # An accepted-risk file names its image in its own filename, so a
            # change to one rebuilds exactly that image. Without this the gate
            # never re-runs against the exception, and "it suppresses what it
            # claims" stays an assumption (Req 6.9).
            names="$names $(printf '%s\n' "$changed" \
              | sed -nE 's#^triage/accepted-risk/([^/]+)\.ya?ml$#\1#p')"
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range="HEAD~1...HEAD"; else range="${BEFORE}...${GITHUB_SHA}"; fi
            names=$(git diff --name-only $range -- image/ | awk -F/ 'NF>=3 && $3=="image.yaml"{print $2}' | sort -u)
          fi

          # The one filter point (Req 1.14, 1.15): whatever a branch above
          # collected, an inactive definition leaves the matrix here, by name
          # in the log. On a pull request validate fails it separately
          # (Req 1.16, scripts/lint-active-set.sh); here it is simply not built.
          kept=""
          for n in $names; do
            if is_active "$n"; then kept="$kept $n"; else echo "inactive, not built: ${n} (catalogue-policy.yaml active_set, Req 1.15)"; fi
          done
          names=$kept

          json=$(printf '%s\n' $names | jq -R . | jq -s -c 'map(select(length>0)) | unique')
          echo "names=$json" >> "$GITHUB_OUTPUT"
          if [ "$json" = "[]" ]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi
          echo "affected: $json"

  release:
    name: build ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to the declared registry namespace
      id-token: write    # cosign keyless (GitHub OIDC)
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.changes.outputs.names) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # binfmt for the arm64 half of the release build (restored by task 9.3;
      # the PR gate still builds amd64 only). The DHI frontend cross-compiles
      # (GOARCH) so arm64 assembly runs little arm64 code, but multi-platform
      # buildx expects binfmt to be registered either way.
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: log in to dhi.io (frontend + builder pulls)
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: log in to ghcr.io
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags come from the definition (Req 2.3): image: is the repo, tags: the
      # semver/os suffixes. Full refs = <image>:<each tag>.
      - id: meta
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          f="image/${NAME}/image.yaml"
          # Declared values live in one committed place (Req 7.7, task 9.8): the
          # registry namespace every release criterion binds through, and the
          # release switches Req 2.13 and 2.17 read. The switches come through
          # their one reader (review D3): a misspelt value (yes, True,
          # on_change) is a refusal there, where it used to take the fail-open
          # branch as a raw string.
          registry=$(yq '.verification.registry' catalogue-policy.yaml | tr -d '"')
          fail_closed=$(scripts/release-policy.sh . fail-closed)
          publish_policy=$(scripts/release-policy.sh . publish-policy)
          # tr strips quotes so this works under either yq (mikefarah on the
          # runner emits raw scalars; python-yq would quote them).
          img=$(yq '.image' "$f" | tr -d '"')
          # The definition names its published repository, the policy file names
          # the namespace. A definition pointing elsewhere would publish where
          # the rendered verification policy admits nothing, so it is a refusal
          # rather than a surprise at consumption time.
          case "$img" in
            "${registry}/"*) ;;
            *) echo "::error file=${f}::${NAME}: image '${img}' is outside the declared registry namespace '${registry}' (catalogue-policy.yaml, Req 2.2, 7.7)"; exit 1 ;;
          esac
          echo "image=$img" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "fail_closed=$fail_closed" >> "$GITHUB_OUTPUT"
          echo "publish_policy=$publish_policy" >> "$GITHUB_OUTPUT"
          # Req 2.1: main builds every platform the definition declares. The
          # policy file ADMITS platforms (Req 7.7), so a declared platform the
          # policy does not admit is refused here by name, rather than
          # becoming a published platform nothing agreed to stand behind.
          admitted=$(scripts/release-policy.sh . platforms)
          platforms=""
          while read -r p; do
            [ -n "$p" ] || continue
            if ! printf '%s\n' "$admitted" | grep -qxF "$p"; then
              echo "::error file=${f}::${NAME}: declared platform '${p}' is not admitted by catalogue-policy.yaml release.platforms (Req 2.1, 7.7)"
              exit 1
            fi
            platforms="${platforms:+${platforms},}${p}"
          done < <(yq '.platforms[]' "$f" | tr -d '"')
          if [ -z "$platforms" ]; then
            echo "::error file=${f}::${NAME}: no platforms declared (Req 2.1)"
            exit 1
          fi
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<TAGS'
            yq '.tags[]' "$f" | tr -d '"' | sed "s#^#${img}:#"
            echo TAGS
          } >> "$GITHUB_OUTPUT"

      # The build verifies the checksum only for the arch it builds, and the PR
      # gate builds amd64 only (see `load:` below — it needs a single platform).
      # So an arm64 pin can enter the repo unexercised and first be tested by a
      # release build after merge. grafana 13.1.1 shipped exactly that: both pins
      # hand-supplied, neither arch fetched. This checks every pinned arch
      # against the bytes upstream actually serves (Req 1.3, Req 2.1).
      # Definitions with no per-arch pin skip in milliseconds.
      - name: verify per-arch pinned checksums
        env:
          NAME: ${{ matrix.name }}
        run: scripts/verify-arch-pins.sh "image/${NAME}"

      # Above the build rather than after it since task 9.2: the scheduled
      # comparator below needs syft before anything is pushed.
      - name: install trivy + grype + syft
        run: |
          set -euo pipefail
          # Installed as the runner user into a temp dir on PATH, not as root
          # into /usr/local/bin. The old form piped a remote script straight
          # into `sudo sh`; fetching two pinned binaries never needed root, and
          # dropping it removes the reason that install was dangerous rather
          # than just the branch it came from.
          mkdir -p "${RUNNER_TEMP}/bin"
          scripts/install-scanners.sh "${RUNNER_TEMP}/bin"
          scripts/install-tool.sh syft "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      # cosign serves two steps on main: the publish-on-change comparator
      # below reads the published SBOM through `cosign verify-attestation`,
      # and the release part signs and attests with it. It is installed here,
      # before both. Until 2026-09-08 it was installed in the release part
      # only, after the comparator; the runner image ships no cosign, so the
      # comparator read "cosign: command not found" as an unreadable
      # attestation, which by design publishes, and every nightly rebuild
      # from 2026-09-02 published every definition (measured: 28 needless
      # digests). The comparator now refuses outright when a tool is missing.
      #
      # Through scripts/install-tool.sh since review D4 (2026-09-09), like
      # every other workflow-installed binary: an exact version AND a sha256
      # recorded in this repository, and the pin-script Renovate manager over
      # it (Req 7.5, 7.6; register row P1 closed). The sigstore/cosign-installer
      # action it replaces pinned the version only, and no manager could
      # match its `cosign-release:` line. The v2 line stays deliberate (ADR
      # 0003, measured): cosign v3 writes a bundle layout Kyverno 1.18.2 and
      # Trivy 0.72.0 cannot find, so v3 waits behind the major gate.
      - name: install cosign
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          scripts/install-tool.sh cosign "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      # ---- Daily rebuild, publish-on-change (task 9.2, Req 2.14-2.17) ----
      # The scheduled path builds LOCALLY first: same definition, same pins,
      # same provenance mode, exported to an OCI archive instead of pushed.
      # scripts/package-set-diff.sh compares the canonicalised package set of
      # that build against the CycloneDX SBOM attested to the digest the full
      # release tag points at. Equal under the on-change policy: this run
      # stops here, nothing pushed, signed, attested or tagged (Req 2.15),
      # and the run ends green. Different, or nothing published under the
      # tag, or the always policy: the release proceeds below exactly as a
      # merge would, with the diff in the summary (Req 2.16, 2.17). A manual
      # dispatch never compares: a human asking for a release gets one.
      - id: buildlocal
        name: scheduled rebuild, local only (Req 2.14)
        if: github.event_name == 'schedule'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: image/${{ matrix.name }}
          file: image/${{ matrix.name }}/image.yaml
          # Every platform the definition declares (Req 2.1), like the push
          # below — a comparator that sees fewer platforms than the release
          # would publish cannot prove equality for what it never looked at.
          platforms: ${{ steps.meta.outputs.platforms }}
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/local-oci.tar
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # The same provenance mode as the push below, so the comparator's
          # index-digest measurement compares builds, not configurations.
          provenance: mode=max

      - id: psd
        name: publish-on-change comparator (Req 2.15-2.17)
        if: github.event_name == 'schedule'
        env:
          NAME: ${{ matrix.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          POLICY: ${{ steps.meta.outputs.publish_policy }}
          PLATFORMS: ${{ steps.meta.outputs.platforms }}
          LOCAL_DIGEST: ${{ steps.buildlocal.outputs.digest }}
        run: |
          set -euo pipefail
          # The action reads the local build's index digest from BuildKit
          # metadata; the archive's own index.json is the fallback so the
          # reproducibility measurement never silently reads "unmeasured".
          localdigest="${LOCAL_DIGEST:-}"
          if [ -z "$localdigest" ]; then
            localdigest=$(tar -xOf "${RUNNER_TEMP}/local-oci.tar" index.json \
              | jq -r '.manifests[0].digest // "-"')
          fi
          # The full release tag is the third of the definition's three tags
          # (requirements.md, Terms), the last line meta emitted.
          fullref=$(printf '%s\n' "$TAGS" | tail -n 1)
          mkdir -p "${RUNNER_TEMP}/psd"
          # One SBOM and one comparison pair per declared platform (Req 2.15
          # says per platform manifest; task 9.3 made this a list).
          pairs=()
          IFS=',' read -r -a plats <<< "$PLATFORMS"
          for p in "${plats[@]}"; do
            cdx="${RUNNER_TEMP}/psd/${p//\//-}.cdx.json"
            syft -q "oci-archive:${RUNNER_TEMP}/local-oci.tar" --platform "$p" \
              -o "cyclonedx-json=${cdx}"
            pairs+=("${p}=${cdx}")
          done
          {
            echo "### Publish-on-change — ${NAME} (${fullref})"
            echo
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"
          scripts/package-set-diff.sh "$NAME" "$fullref" "$localdigest" \
            "${RUNNER_TEMP}/psd/verdict" \
            "${pairs[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "${RUNNER_TEMP}/psd/verdict" >> "$GITHUB_OUTPUT"
          verdict=$(sed -n 's/^verdict=//p' "${RUNNER_TEMP}/psd/verdict" | tail -1)
          publish=true
          if [ "$POLICY" = "on-change" ] && [ "$verdict" = "equal" ]; then
            publish=false
            echo "discarded: package set equal to the one published under ${fullref}; nothing pushed, signed, attested or tagged (Req 2.15)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - id: build
        # A discarded scheduled rebuild stops HERE: everything from the push
        # to the tags carries this guard, so Req 2.15's "pushing nothing,
        # signing nothing and attesting nothing" is one skipped chain rather
        # than nine conditions that can drift apart. On the gha cache this
        # build is a replay of the local one above.
        if: github.event_name != 'schedule' || steps.psd.outputs.publish == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: image/${{ matrix.name }}
          file: image/${{ matrix.name }}/image.yaml
          # Every declared platform on main (Req 2.1); the PR gate stays amd64
          # (it loads a single image for the scan gate, and the cost worth
          # gating on is the build, not the platform count). arm64 left on
          # 2026-08-04 because nothing scanned it — it was signed, SBOM'd and
          # attested unread (review finding 1.3) — and returns with task 9.3
          # because now everything does: the release-time scan covers every
          # platform manifest of the pushed digest (Req 2.8, 2.26) and the
          # rescan enumerates and scans every platform manifest of every
          # tag-referenced digest daily, by its own digest (Req 2.22).
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || steps.meta.outputs.platforms }}
          # Req 2.7: on main the image is pushed BY DIGEST and carries no tag
          # until its own scan, signature and attestations exist. Until task 9.1
          # this step pushed the tags itself, which published the artifact and
          # only then looked at it: the tag is the promise, so it goes last
          # (`docker buildx imagetools create` below).
          push: false
          # Single-arch, so the PR path loads it into the docker daemon for the
          # scan gate below.
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && steps.meta.outputs.tags || '' }}
          outputs: ${{ github.ref == 'refs/heads/main' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.meta.outputs.image) || '' }}
          # Warm the Go module + compile layers across runs so repeat builds of
          # a large upstream (cert-manager) aren't cache-cold every time.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # BuildKit SLSA provenance, attached only when we push (Req 2.2).
          provenance: ${{ github.ref == 'refs/heads/main' && 'mode=max' || 'false' }}

      # ---- CVE scanning: the gate on a PR, the release-time scan on main ----
      # Real tools do the work: Trivy suppresses via our OpenVEX and reports the
      # remaining HIGH/CRITICAL; Grype corroborates a CRITICAL; a jq count is the
      # only glue. Authoring VEX statements is task 7.3, here we consume them.
      # Both arms scan (Req 2.8): the gate scans the PR build, the release arm
      # scans the pushed digest per platform manifest. syft generates the SBOMs
      # attested to each manifest (Req 2.9), pinned and checksum-verified like
      # every other workflow tool (Req 7.5).
      # Trivy builds the `pkg:oci/...` product purl a VEX statement has to match
      # out of the image's RepoDigest. A buildx `load:` image has none — never
      # pushed, never pulled — so on the PR path the CycloneDX root component
      # came out with a random UUID and no purl at all, and EVERY OpenVEX
      # statement silently matched nothing. Not the statement's shape: with no
      # root purl, no product identifier in any form matches, verified across
      # digest-pinned, registry-qualified and bare. Upstream: trivy#9399.
      #
      # A push is the only thing that mints a RepoDigest, and pushing also
      # records it on the daemon's own copy — so the govulncheck step below
      # keeps exporting the same image, untouched. Throwaway registry, dropped
      # with the runner.
      - name: local registry — give the image an identity VEX can match
        id: localreg
        if: github.event_name == 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          NAME: ${{ matrix.name }}
          REGISTRY: ${{ steps.meta.outputs.registry }}
        run: |
          set -euo pipefail
          docker run -d --rm -p 5000:5000 --name dhc-localreg \
            registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373 >/dev/null
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:5000/v2/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          src=$(printf '%s\n' "$TAGS" | head -n1)
          # The path under the throwaway registry mirrors the declared
          # namespace; nothing matches on it (compile-vex.sh drops the
          # qualifiers), it just keeps the instance literal out of the step.
          ref="localhost:5000/${REGISTRY#*/}/${NAME}:scan"
          docker tag "$src" "$ref"
          docker push -q "$ref"
          # The digest this push minted is what Trivy puts in its product purl,
          # so it is also what every VEX statement has to carry to match
          # (Req 6.29). Read from the daemon rather than re-derived.
          repodigest="$(docker image inspect "$ref" --format '{{index .RepoDigests 0}}')"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=${repodigest##*@}" >> "$GITHUB_OUTPUT"
          echo "scanning $ref (RepoDigest: $repodigest)"

      - name: Trivy scan (VEX + accepted risk)
        id: trivy
        if: github.event_name == 'pull_request'
        env:
          REF: ${{ steps.localreg.outputs.ref }}
          DIGEST: ${{ steps.localreg.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          NAME: ${{ matrix.name }}
          VEXDIR: .vexscan
        run: |
          set -euo pipefail
          ref="$REF"
          echo "scanning $ref"
          # Two suppression inputs, deliberately different in kind:
          #
          #   --vex         applicability claims — the vulnerable code cannot
          #                 execute here. Evidence-backed, published with the
          #                 image, no expiry.
          #   --ignorefile  risk decisions — it is real and we ship anyway, for a
          #                 bounded time. Published as `affected` in the compiled
          #                 document, never as not_affected or fixed (Req 6.8,
          #                 6.38); suppresses nothing beyond this scan, and it
          #                 expires (Req 6.9).
          #
          # They compose in one scan and the report's Source field tells them
          # apart, which is what lets the summary below keep them apart too.
          # An empty triage/vex/ and a missing accepted-risk file excuse nothing,
          # so every HIGH/CRITICAL counts — the correct default.
          # Req 6.28-6.30. triage/vex/ is source and is never handed to a
          # scanner. Trivy builds its product identifier from the RepoDigest, so
          # a statement carrying a published tag matches nothing at all —
          # measured, one real finding, one statement each:
          #
          #   pkg:oci/grafana@13.0.4-alpine3.23  fixed -> reported 1, suppressed 0
          #   pkg:oci/grafana@sha256:b6987eb...  fixed -> reported 0, suppressed 1
          #
          # compile-vex.sh stamps this build's digest into every product (6.29)
          # and drops any statement scoped to a tag this build is not (6.30),
          # so a claim argued about 13.0.4 cannot suppress on 13.1.1.
          #
          # It also drops the purl qualifiers, which is what a jq rewrite did
          # here before: the image lives at localhost:5000 while our statements
          # name ghcr.io, and Trivy compares repository_url exactly (upstream
          # #9399). That blinds the gate to exactly one field and nothing else —
          # measured: it still catches a wrong image name, a near-miss name, a
          # wrong purl type and a wrong subcomponent. lint-vex-product.sh is
          # what covers the registry host, by exact comparison against the
          # definition's `image:`, which beats "did a finding disappear".
          #
          # The PUBLISHED statements stay precisely scoped and are what cosign
          # attests on the release path.
          mapfile -t built_tags < <(printf '%s\n' "$TAGS" | sed 's|.*:||' | sort -u)
          scripts/compile-vex.sh triage/vex "$VEXDIR" "$NAME" "$DIGEST" "${built_tags[@]}"
          # One scan, one script, the same inputs the release arm applies to the
          # pushed digest (task 9.1). Two copies of this invocation drift on the
          # first flag either arm gains, and a gate that stops predicting what
          # release does is worse than no gate: scripts/scan-image.sh is where
          # --vex, --ignorefile, --show-suppressed and --exit-code 0 live, with
          # its own tests.
          scripts/scan-image.sh "$ref" "$NAME" "$VEXDIR" trivy.json
          # scan-image.sh derives this same path to hand Trivy the ignorefile;
          # the summary below needs it too, to show the file verbatim. Display
          # only — the scan never reads this copy.
          accepted="triage/accepted-risk/${NAME}.yaml"
          # Counted over the declared aperture (Req 6.49, task 10.1), never a
          # hard-coded pair: a fork that widens it sees every severity it named.
          aperture=$(scripts/triage-policy.sh . aperture)
          uncovered=$(jq --arg ap "$aperture" '($ap | split(",")) as $sevs
                        | [.Results[]?.Vulnerabilities[]? | select(.Severity as $s | $sevs | index($s))] | length' trivy.json)
          breakdown=$(jq -r --arg ap "$aperture" '($ap | split(",")) as $sevs
                        | [.Results[]?.Vulnerabilities[]?] as $v
                        | [$sevs[] | . as $s | "\([$v[] | select(.Severity == $s)] | length) \($s)"] | join(", ")' trivy.json)
          crit=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy.json)
          echo "uncovered=$uncovered" >> "$GITHUB_OUTPUT"
          echo "breakdown=$breakdown" >> "$GITHUB_OUTPUT"
          echo "crit=$crit" >> "$GITHUB_OUTPUT"
          {
            echo "### Trivy — ${ref}"
            echo
            echo "Uncovered within the aperture (${aperture}): **${uncovered}** (${breakdown})"
            echo
            # Split by Source, not by eyeball: the two lanes answer different
            # questions and conflating them in one "suppressed" count is how a
            # business decision starts reading like a technical claim.
            echo "#### Not affected — VEX (published with the image)"
            echo
            # Source names the rewritten copy, not triage/vex/ — match on the
            # scan directory or this table silently reads empty even when the
            # suppression worked, which is the failure mode it exists to expose.
            if jq -e --arg vexdir "${VEXDIR}/" '[.Results[]?.ExperimentalModifiedFindings[]?
                       | select(.Source // "" | startswith($vexdir))] | length > 0' \
                 trivy.json >/dev/null; then
              echo "| CVE | Status | Justification | Package |"
              echo "|---|---|---|---|"
              jq -r --arg vexdir "${VEXDIR}/" '.Results[]?.ExperimentalModifiedFindings[]?
                     | select(.Source // "" | startswith($vexdir))
                     | "| \(.Finding.VulnerabilityID) | \(.Status) | \(.Statement // "-") | \(.Finding.PkgName) |"' \
                 trivy.json | sort -u
            else
              # Counted from the one compiled document, which is always written
              # now, empty included (ADR 0003): "compiled nothing" and "never
              # compiled" have to look different, and before that document
              # existed an empty triage/vex/ made this glob fail and killed the
              # step under `set -euo pipefail` before the summary was written.
              vexn=$(jq '[.statements[]?] | length' "$VEXDIR"/*.json)
              echo "_none_ — ${vexn} statement(s) on file."
              if [ "$vexn" -gt 0 ]; then
                echo "> ⚠️ Statements exist but suppressed nothing here — the product identifier below is what they must match."
              fi
            fi
            echo
            echo "#### Accepted risk — time-boxed, internal only"
            echo
            if [ -f "$accepted" ]; then
              # Req 6.26/6.27. The table gains the binary each suppression
              # applied to, because an entry scoped to one binary and one
              # scoped to the whole image produce identical counts, and any
              # entry that suppressed nothing is called out — a paths: value
              # matching no file is accepted by Trivy silently, matches
              # nothing and exits 0. Unit-tested in
              # scripts/accepted-risk-report_test.sh; reports, never fails.
              scripts/accepted-risk-report.sh trivy.json "$accepted"
              echo
              # Owner and expiry live in the file, not in Trivy's report. Shown
              # verbatim so a reviewer sees who carries this and until when
              # without leaving the summary.
              echo "<details><summary><code>${accepted}</code></summary>"
              echo
              echo '```yaml'
              cat "$accepted"
              echo '```'
              echo
              echo "</details>"
            else
              echo "_none_ ✓"
            fi
            echo
            # The identifier a statement's `products[].@id` has to match, taken
            # from the same report the gate just used so it cannot drift from
            # what Trivy actually saw. Emitted every run, not just on mismatch:
            # it is what you copy when authoring the next statement, and a wrong
            # product purl is the one VEX defect that produces no error at all.
            # (Drop the @sha256 digest when writing it down — the digest changes
            # every build, and a digestless purl still matches.)
            # Failure used to be swallowed by `2>/dev/null || true`, so a run
            # that printed "<unavailable>" gave no way to find out why. Keep the
            # step non-fatal, but say what went wrong.
            if ! conv=$(trivy convert --format cyclonedx --output cdx.json trivy.json 2>&1); then
              printf '%s\n' "$conv" > convert.err
            fi
            echo "#### Product identifier for this image"
            echo
            echo '```'
            jq -r '.metadata.component.purl // "<unavailable>"' cdx.json 2>/dev/null || {
              echo "<unavailable>"
              echo "-- trivy convert said:"
              head -5 convert.err 2>/dev/null || echo "-- (convert reported no error; cdx.json has no metadata.component.purl)"
            }
            echo '```'
            echo
            # When the identifier above is unavailable, a `pkg:oci/...` product
            # has nothing to match against and every VEX statement silently
            # misses — one cause, two symptoms. Trivy builds that purl from what
            # it thinks the artifact IS, so print that: an image built with
            # `load: true` and never pushed has no RepoDigest, which is the
            # first thing to rule in or out.
            echo "<details><summary>what Trivy matched against</summary>"
            echo
            echo '```'
            jq -r '{ArtifactName, ArtifactType,
                    RepoTags: (.Metadata.RepoTags // []),
                    RepoDigests: (.Metadata.RepoDigests // []),
                    ImageID: (.Metadata.ImageID // "")}
                   | to_entries[] | "\(.key): \(.value | tostring)"' trivy.json
            echo "--- cyclonedx root component ---"
            jq -r '.metadata.component // "<no root component>"' cdx.json 2>/dev/null || echo "<cdx.json unreadable>"
            echo '```'
            echo
            echo "</details>"
            echo
            # The OTHER half of a VEX statement. A statement names a product and
            # a subcomponent, and until now the gate printed only the product —
            # so the subcomponent purl was still hand-written from the package
            # name and could be wrong in exactly the same silent way. Taken from
            # the same report, versionless, which is the form that survives a
            # rebuild.
            if [ "${uncovered}" -gt 0 ]; then
              echo "#### Subcomponent identifiers (uncovered findings)"
              echo
              echo '```'
              jq -r '[.Results[]?.Vulnerabilities[]?.PkgIdentifier.PURL // empty]
                     | map(split("@")[0]) | unique[]' trivy.json
              echo '```'
              echo
            fi
            # The surviving findings, named. A bare count means downloading an
            # artifact to learn what to triage; this is the list you act on.
            echo "#### Still uncovered"
            echo
            if [ "${uncovered}" -gt 0 ]; then
              # Target = the binary the finding is in, and on a repackage image
              # that is the whole triage question: a module in the main
              # entrypoint and the same module in a bundled plugin are different
              # exposures with different treatments. It is in the report already
              # — carrying it here is what stops the per-binary breakdown from
              # being reassembled by hand every pass.
              echo "| CVE | Severity | Package | Installed | Fixed | Binary |"
              echo "|---|---|---|---|---|---|"
              # Dedup in jq, not with a trailing `sort -u` — that re-sorted
              # alphabetically and silently threw away the CRITICAL-first order
              # this sort_by exists to produce.
              jq -r '[.Results[]? | .Target as $t | .Vulnerabilities[]? | . + {Target: $t}]
                     | unique_by([.VulnerabilityID, .Target, .PkgName])
                     | sort_by(.Severity != "CRITICAL", .Target, .VulnerabilityID)[]
                     | "| \(.VulnerabilityID) | \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "-") | \(.Target) |"' \
                 trivy.json
            else
              echo "_none_ ✓"
            fi
          # tee, not >>: the job summary is the only place this table exists, and
          # a summary is not readable through the API without Checks scope — the
          # scan artifacts aren't either. Triage then waits on output the run
          # already produced. The log is readable, so send it to both.
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ---- PR-only: VEX portability (task 13.4, Req 9.12) ----
      # The statements are written for the authoritative scanner's matcher;
      # whether they land in every other declared consumer is measured here,
      # never gated (catalogue-policy.yaml consumers.gating is the switch).
      # The authoritative side is the scan above, normalised from its report
      # (no second trivy run); each other consumer scans the same image with
      # the same compiled documents. continue-on-error for the same reason as
      # govulncheck below: a second scanner that can break CI is a second
      # gate nobody designed.
      - name: VEX portability (Req 9.12)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          REF: ${{ steps.localreg.outputs.ref }}
          NAME: ${{ matrix.name }}
          VEXDIR: .vexscan
        run: |
          set -uo pipefail
          mkdir -p .portability
          scripts/vex-consumer.sh "$(scripts/triage-policy.sh . authoritative-consumer)" .portability/authoritative.jsonl --root . --report trivy.json
          records=(.portability/authoritative.jsonl)
          while read -r consumer; do
            [ -n "$consumer" ] || continue
            if scripts/vex-consumer.sh "$consumer" ".portability/${consumer}.jsonl" --root . --scan "$REF" --vex-dir "$VEXDIR"; then
              records+=(".portability/${consumer}.jsonl")
            else
              echo "::warning::VEX portability: ${consumer} did not produce a record for ${REF}; reported as not measured"
              records+=(".portability/${consumer}.missing.jsonl")
            fi
          done < <(scripts/triage-policy.sh . other-consumers)
          scripts/vex-portability.sh --root . --label "${NAME} (${REF})" --out .portability/block.md --json .portability/block.json "${records[@]}"
          cat .portability/block.md >> "$GITHUB_STEP_SUMMARY"

      # ---- PR-only: reachability evidence (Req 6.13) ----
      # Trivy and Grype answer "is this module linked". govulncheck -mode=binary
      # reads the binary's symbol table and answers "is the vulnerable code
      # called" — the only question that can settle an advisory whose
      # applicability turns on one wired-in symbol, and the one Req 6.14 hangs a
      # prohibition on.
      #
      # continue-on-error is the declaration that this is EVIDENCE, NOT A GATE.
      # Trivy is the only thing that fails a build. A reachability tool that can
      # also break CI is a second gate nobody designed, and its false negatives
      # would then be silently passing images.
      - name: govulncheck reachability (Req 6.13)
        id: govulncheck
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          # Exact pin (Req 7.5). No *_SHA256 beside it, unlike install-scanners.sh:
          # this is compiled from source via the module proxy, and the Go sumdb
          # already gives every module version go.sum-style checksum verification.
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: v1.6.0
        run: |
          set -uo pipefail
          ref=$(printf '%s\n' "$TAGS" | head -n1)
          go version
          # Silence reads as failure (review D3): a tool that did not install
          # or did not run fails this step by name, so the summary can never
          # say "no Go binaries" about an image nobody looked at. The step
          # stays non-gating (continue-on-error above): the build goes on,
          # the red step and its annotation stay.
          if ! go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"; then
            echo "::error::govulncheck ${GOVULNCHECK_VERSION} did not install; no reachability evidence was produced for ${ref} (Req 6.13)"
            { echo "### govulncheck — ${ref}"; echo; echo "_govulncheck did not install; no reachability evidence today (Req 6.13)._"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          PATH="$(go env GOPATH)/bin:$PATH"; export PATH

          # Export the image filesystem rather than guessing paths: which Go
          # binaries an upstream tarball ships is exactly what we do not know in
          # advance — bundled plugins are how the last three findings arrived.
          cid=$(docker create "$ref")
          mkdir -p rootfs gv
          docker export "$cid" | tar -x --no-same-owner --no-same-permissions \
            --exclude 'dev/*' --exclude 'proc/*' --exclude 'sys/*' -C rootfs || true
          docker rm -f "$cid" >/dev/null

          # -size +1M skips the shell utilities and keeps this to plausible Go
          # binaries; `go version -m` is the actual test, and it fails fast on
          # anything that is not one (no execute-bit filter: the bit is not
          # what makes a file a Go binary, review D3).
          args=(); candidates=0; broken=()
          while IFS= read -r f; do
            go version -m "$f" >/dev/null 2>&1 || continue
            candidates=$((candidates + 1))
            rel=${f#rootfs/}
            out="gv/$(printf '%s' "$rel" | tr '/' '_').json"
            # govulncheck exits non-zero when it FINDS something, so its exit
            # status is not an error signal here; an EMPTY output is, since the
            # JSON stream always carries at least the config and progress
            # messages for a binary it could read.
            govulncheck -mode=binary -format json "$f" > "$out" 2>"$out.err" || true
            if [ -s "$out" ]; then args+=("${rel}=${out}"); else broken+=("${rel}: $(tr -d '\n' < "$out.err" | cut -c1-160)"); fi
          done < <(find rootfs -type f -size +1M 2>/dev/null)

          # Drop the export before anything else runs. A repackage image is
          # ~1.1 GB and this doubles it on disk; the first run left 94 MB free
          # and the NEXT step died — grype could not write its vulnerability DB
          # ("database or disk is full"). Non-gating means this step cannot fail
          # the build, not that it cannot break the one after it.
          rm -rf rootfs
          df -h / | tail -1

          {
            echo "### govulncheck — ${ref}"
            echo
            if [ "${#broken[@]}" -gt 0 ]; then
              echo "_govulncheck produced no output for ${#broken[@]} Go binary(ies); that is the tool not running, not absence of findings:_"
              printf -- '- %s\n' "${broken[@]}"
              echo
            fi
            if [ "${candidates}" -eq 0 ]; then
              echo "_no Go binaries found in this image (no file over 1 MiB that \`go version -m\` reads)._"
            elif [ "${#args[@]}" -eq 0 ]; then
              echo "_${candidates} Go binary(ies) found, none measured._"
            else
              scripts/govulncheck-report.sh "${args[@]}"
              echo
              echo "> \`symbol\` forbids a \`not_affected\` /"
              echo "> \`vulnerable_code_not_in_execute_path\` statement (Req 6.14)."
              echo "> \`not measured\` is silence, not absence — a stripped binary looks the same."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${#broken[@]}" -gt 0 ]; then
            echo "::error::govulncheck produced no output for ${#broken[@]} Go binary(ies) in ${ref}; the reachability evidence for them was not produced (Req 6.13): ${broken[*]}"
            exit 1
          fi

      - name: Grype second opinion (CRITICAL present)
        if: github.event_name == 'pull_request' && steps.trivy.outputs.crit != '0'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          ref=$(printf '%s\n' "$TAGS" | head -n1)
          # A different DB + matcher corroborating Trivy's CRITICAL (Req 6.6);
          # informational — the authoritative gate is the Trivy result below.
          grype "$ref" -o table | tee grype.txt
          {
            echo "### Grype second opinion — ${ref}"
            echo '```'
            cat grype.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Req 6.50, 6.59: every exception in this image's file is held to the
      # tier its finding earns in THIS report (KEV first, then severity), with
      # the KEV feed fetched fresh. A feed outage fails the pull request by
      # name rather than evaluating with an empty KEV set, which would hand
      # every exploited finding the widest tier: fail closed, the owner's
      # call over fail-open (task 10.1).
      - name: exception tiers against KEV (Req 6.50)
        if: github.event_name == 'pull_request'
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          feed=$(scripts/triage-policy.sh . kev-feed)
          if ! curl -fsSL --max-time 60 "$feed" -o kev.json; then
            echo "::error::${NAME}: the CISA KEV feed (${feed}) is unavailable, so the exception tiers cannot be evaluated; this pull request fails closed (Req 6.59)"
            exit 1
          fi
          scripts/check-exceptions.sh gate . "$NAME" trivy.json kev.json

      - name: Scan gate — fail on uncovered findings within the aperture
        if: github.event_name == 'pull_request'
        env:
          UNCOVERED: ${{ steps.trivy.outputs.uncovered }}
          BREAKDOWN: ${{ steps.trivy.outputs.breakdown }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          if [ "${UNCOVERED:-0}" -gt 0 ]; then
            # The findings are NAMED in the failure, not just counted: the
            # summary and the report artifact carry the detail, but the error
            # annotation is what every reader of a red check reaches first
            # (and the only part an API consumer can reach at all), and
            # "1 HIGH uncovered" with no name forces archaeology on whoever
            # has to decide what to do about it (measured 2026-09-02, PR #122).
            found=$(jq -r '[.Results[]?.Vulnerabilities[]?
                            | "\(.VulnerabilityID) (\(.Severity) \(.PkgName)@\(.InstalledVersion), fixed: \(.FixedVersion // "none"))"]
                           | unique | join("; ")' trivy.json)
            echo "::error::${NAME}: ${UNCOVERED} uncovered within the aperture (${BREAKDOWN}; Req 6.1): ${found}. Four ways out, strongest first: avoid (drop the component) · fix (version bump, Req 6.5) · prove it does not apply (OpenVEX in triage/vex/, Req 6.4) · accept or transfer for a bounded time (triage/accepted-risk/${NAME}.yaml, Req 6.7). An expired exception counts as uncovered."
            exit 1
          fi
          echo "${NAME}: nothing uncovered within the aperture ✓"

      - name: upload scan reports
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-${{ matrix.name }}
          path: |
            trivy.json
            grype.txt
          if-no-files-found: ignore

      # ---- release path on main: scan the pushed digest, then sign, attest, tag ----
      #
      # Order is the promise (Req 2.7 to 2.9). The image above was pushed BY
      # DIGEST and carries no tag; nothing here publishes it until its own scan,
      # signature and attestations exist, and the tag is applied last. Until
      # task 9.1 the build pushed tags itself and the only scan ever run was the
      # pull request's, against a different artifact than the one signed.
      # Every platform manifest of the pushed index, by its own digest. The
      # index also carries BuildKit's attestation manifests, which sit under
      # unknown/unknown and are NOT platform manifests (Req 2 terms): scanning
      # or SBOM-ing one of those would describe the provenance blob rather than
      # the image, and attesting to it would put claims where no consumer looks.
      - name: enumerate platform manifests
        id: manifests
        if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || steps.psd.outputs.publish == 'true')
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          raw=$(docker buildx imagetools inspect --raw "$REF")
          if [ "$(jq -r 'has("manifests")' <<<"$raw")" = "true" ]; then
            digests=$(jq -r '.manifests[]
              | select((.platform.os // "unknown") != "unknown")
              | select((.annotations["vnd.docker.reference.type"] // "") == "")
              | .digest' <<<"$raw")
          else
            # A single image manifest is its own platform manifest.
            digests="${REF##*@}"
          fi
          [ -n "$digests" ] || { echo "::error::${REF}: no platform manifest found, so nothing can be scanned or attested (Req 2.26)"; exit 1; }
          {
            echo 'digests<<DIGESTS'
            printf '%s\n' "$digests"
            echo DIGESTS
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digests" | sed 's/^/platform manifest: /'

      # Req 2.8: scan the pushed digest, once per platform manifest, with the
      # same inputs the gate applied to the pull request build. By the
      # manifest's own digest, so no --platform is needed and no silent
      # downgrade to the runner's architecture is possible (task 8.3 measured
      # that --platform without --image-src remote is ignored).
      - name: release-time scan of the pushed digest (Req 2.8)
        id: relscan
        if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || steps.psd.outputs.publish == 'true')
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          MANIFESTS: ${{ steps.manifests.outputs.digests }}
          TAGS: ${{ steps.meta.outputs.tags }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mapfile -t manifests < <(printf '%s\n' "$MANIFESTS")
          mapfile -t built_tags < <(printf '%s\n' "$TAGS" | sed 's|.*:||' | sort -u)
          # Pass 1: the source statements alone, stamped for the index and every
          # platform manifest (Req 6.29), so the scan below is suppressed by
          # exactly what a consumer will later read off the digest.
          COMPILE_VEX_MANIFEST_DIGESTS="${manifests[*]}" \
            scripts/compile-vex.sh triage/vex .vexrelease "$NAME" "$DIGEST" "${built_tags[@]}"
          uncovered=0
          for m in "${manifests[@]}"; do
            out="trivy-${m#sha256:}.json"
            scripts/scan-image.sh "${IMAGE}@${m}" "$NAME" .vexrelease "$out" --remote
            n=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$out")
            uncovered=$((uncovered + n))
            echo "${m}: ${n} uncovered within the decision aperture"
          done
          echo "uncovered=$uncovered" >> "$GITHUB_OUTPUT"

      # Req 2.13. The switch is declared, not hardcoded (catalogue-policy.yaml,
      # task 9.8): with it enabled an uncovered finding stops the release before
      # anything is signed, attested or tagged. Default off, so the catalogue
      # ships with a published status instead of a stall (Req 2.12) and framing
      # A's promise is about knowledge rather than a clean scan.
      - name: fail-closed release gate (Req 2.13)
        if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || steps.psd.outputs.publish == 'true') && steps.meta.outputs.fail_closed == 'true' && steps.relscan.outputs.uncovered != '0'
        env:
          NAME: ${{ matrix.name }}
          UNCOVERED: ${{ steps.relscan.outputs.uncovered }}
          DIGEST: ${{ steps.build.outputs.digest }}
          MANIFESTS: ${{ steps.manifests.outputs.digests }}
        run: |
          set -uo pipefail
          # The findings are NAMED, per platform manifest, the way the PR gate
          # names them (review D3): a count with no name forces archaeology on
          # whoever has to decide, and the release reports are not uploaded.
          {
            echo "### Fail-closed release gate: ${NAME} (${DIGEST})"
            echo
            echo "| Platform manifest | Finding | Severity | Package | Fixed |"
            echo "|---|---|---|---|---|"
            while IFS= read -r m; do
              [ -n "$m" ] || continue
              jq -r --arg m "${m:0:19}…" '.Results[]?.Vulnerabilities[]?
                | "| `\($m)` | \(.VulnerabilityID) | \(.Severity) | \(.PkgName)@\(.InstalledVersion) | \(.FixedVersion // "none") |"' \
                "trivy-${m#sha256:}.json" 2>/dev/null || echo "| \`${m:0:19}…\` | report unreadable | | | |"
            done < <(printf '%s\n' "$MANIFESTS")
          } >> "$GITHUB_STEP_SUMMARY"
          found=$(jq -rs '[.[] | .Results[]?.Vulnerabilities[]?
                           | "\(.VulnerabilityID) (\(.Severity) \(.PkgName)@\(.InstalledVersion), fixed: \(.FixedVersion // "none"))"]
                          | unique | join("; ")' trivy-*.json 2>/dev/null || echo "reports unreadable")
          echo "::error::${NAME}: ${UNCOVERED} uncovered finding(s) in the release-time scan of ${DIGEST}: ${found}. The declared fail-closed setting is enabled, so this digest is signed by nothing, attested by nothing and carries no tag (Req 2.13). It stays frozen and pullable by digest; the ways out are the same four the gate offers."
          exit 1

      # Req 2.9 + 6.37: the scan report becomes a verifiable input rather than a
      # log line. The compiled document's under_investigation statements are
      # derived from these reports, so what a consumer reads on the digest and
      # what the catalogue decided from are the same artifact.
      - name: attest each platform manifest's scan report (Req 2.9)
        if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || steps.psd.outputs.publish == 'true')
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          MANIFESTS: ${{ steps.manifests.outputs.digests }}
        run: |
          set -euo pipefail
          mapfile -t manifests < <(printf '%s\n' "$MANIFESTS")
          for m in "${manifests[@]}"; do
            report="trivy-${m#sha256:}.json"
            trivy convert --format cosign-vuln --output "vuln-${m#sha256:}.json" "$report"
            cosign attest --yes --type vuln \
              --predicate "vuln-${m#sha256:}.json" "${IMAGE}@${m}"
          done

      # Req 2.12: whatever the release-time scan still reports is uncovered by
      # construction, and it is published as under_investigation carrying that
      # report's timestamp rather than passing unremarked. Pass 2 reads the
      # reports pass 1 could not have seen.
      - name: compile the digest's OpenVEX document (Req 2.12, 6.37)
        if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || steps.psd.outputs.publish == 'true')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          MANIFESTS: ${{ steps.manifests.outputs.digests }}
          TAGS: ${{ steps.meta.outputs.tags }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mapfile -t manifests < <(printf '%s\n' "$MANIFESTS")
          mapfile -t built_tags < <(printf '%s\n' "$TAGS" | sed 's|.*:||' | sort -u)
          reports=""
          for m in "${manifests[@]}"; do reports="${reports} trivy-${m#sha256:}.json"; done
          COMPILE_VEX_MANIFEST_DIGESTS="${manifests[*]}" \
          COMPILE_VEX_SCAN_REPORTS="${reports# }" \
          COMPILE_VEX_REPORT=vexreport.json \
            scripts/compile-vex.sh triage/vex .vexattest "$NAME" "$DIGEST" "${built_tags[@]}"
          {
            echo "### OpenVEX for ${NAME}@${DIGEST}"
            echo
            jq -r '"- statements from source: \(.compiled)\n- affected (from unexpired exceptions, Req 6.38): \(.affected)\n- under investigation (uncovered at release): \(.under_investigation), of which lapsed exceptions: \(.lapsed)\n- products dropped: \(.dropped)"' vexreport.json
          } >> "$GITHUB_STEP_SUMMARY"

      # Req 2.9. Recursive signing covers the index and every child manifest, so
      # a consumer pinning either resolves a signature. Attestations are made
      # explicitly per target rather than relying on --recursive, whose coverage
      # of children on v2.6.0 is unmeasured here: a claim that silently lands on
      # the index alone would leave a platform-digest consumer with nothing.
      - name: sign and attest (Req 2.9)
        if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || steps.psd.outputs.publish == 'true')
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          MANIFESTS: ${{ steps.manifests.outputs.digests }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mapfile -t manifests < <(printf '%s\n' "$MANIFESTS")
          index="${IMAGE}@${DIGEST}"
          doc=$(ls .vexattest/*.json)

          cosign sign --yes --recursive "$index"

          # One SBOM pair per platform manifest: SPDX is the interchange format
          # consumers expect, CycloneDX carries the apk pull checksums Syft's
          # SPDX output drops (measured 2026-08-22), which is what task 9.2's
          # publish-on-change comparison reads.
          for m in "${manifests[@]}"; do
            ref="${IMAGE}@${m}"
            syft scan "registry:${ref}" -o spdx-json="sbom-${m#sha256:}.spdx.json" \
                                        -o cyclonedx-json="sbom-${m#sha256:}.cdx.json"
            cosign attest --yes --type spdxjson  --predicate "sbom-${m#sha256:}.spdx.json" "$ref"
            cosign attest --yes --type cyclonedx --predicate "sbom-${m#sha256:}.cdx.json"  "$ref"
            cosign attest --yes --type openvex   --predicate "$doc" "$ref"
            # Each platform's SPDX on the INDEX as well (spec amended
            # 2026-09-02, task 9.6): the index is the digest a tag resolves
            # to, and admission (signature, SPDX, OpenVEX; Req 2.23) is
            # checked there, not one level down. The first 9.1 releases put
            # SBOMs on the platform manifests only, and no such index passed
            # the policy. CycloneDX stays per manifest: it feeds the
            # comparator, not admission.
            cosign attest --yes --type spdxjson  --predicate "sbom-${m#sha256:}.spdx.json" "$index"
          done
          # The same one document on the index too (ADR 0003: exactly one per
          # digest, because with several `trivy --vex oci` applies one at random).
          cosign attest --yes --type openvex --predicate "$doc" "$index"

      # Req 2.7/2.9: the tag is the promise, so it is applied only now, after the
      # scan, the signature and every attestation exist. imagetools create writes
      # a new index from the same children, so the run asserts the tag resolves
      # to the digest that was actually signed: a tag pointing at anything else
      # would publish an unsigned artifact under a promised name.
      - name: apply definition-derived tags (Req 2.7, 2.9)
        if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || steps.psd.outputs.publish == 'true')
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(printf '%s\n' "$TAGS")
          args=()
          for t in "${tags[@]}"; do args+=(--tag "$t"); done
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          for t in "${tags[@]}"; do
            # The registry's own answer for what the tag resolves to, rather
            # than a local re-hash of pretty-printed manifest bytes.
            got=$(docker buildx imagetools inspect "$t" --format '{{ .Manifest.Digest }}')
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::${NAME}: tag ${t} resolves to ${got}, not the signed digest ${DIGEST}; that tag would publish an artifact nothing here signed (Req 2.9, 2.10)"
              exit 1
            fi
            echo "${t} -> ${DIGEST} ✓"
          done
          echo "${NAME}: published ${#tags[@]} tag(s) on a signed, attested digest" >> "$GITHUB_STEP_SUMMARY"

  # Static fan-in for branch protection: the matrix legs above are named
  # dynamically (build <image>), so no leg name can be a required check — a PR
  # not touching that image would wait on it forever. Require this job instead.
  # `skipped` passes: that is the "no definitions affected" PR.
  gate:
    name: build gate
    needs: [changes, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          # A failed `changes` skips `release` — skipped alone must not pass
          # then, that run gated nothing.
          [ "$CHANGES" = "success" ] || { echo "::error::changes: $CHANGES"; exit 1; }
          case "$RELEASE" in
            success|skipped) echo "build: $RELEASE" ;;
            *) echo "::error::build result: $RELEASE"; exit 1 ;;
          esac
