name: build

# PR: build every affected definition for amd64 through the dhi.io/build
# frontend — no push, just prove it compiles (fast gate; both arches are a
# release concern, Req 2.1) — then load it into the docker daemon and run the
# CVE scan gate: Trivy over HIGH/CRITICAL, failing on anything not excused by an
# OpenVEX statement in triage/vex/ (Req 6.1), with a Grype second opinion
# whenever a CRITICAL is present (Req 6.6).
# main: same build, then push to the PRIVATE ghcr.io/mm-weber/dhc with a cosign
# keyless signature, an SPDX SBOM (Syft), and BuildKit provenance attached
# (Req 2.2), tags derived from the definition (Req 2.3), and a final guard that
# the pushed package is private (Req 2.4). Any failure publishes nothing (Req 2.5).
#
# Builds run on GitHub Actions runners — the authoritative build environment
# (Req 8.1). Pulling the frontend + golang builder needs a dhi.io login:
# operator adds repo secrets DHI_USERNAME + DHI_TOKEN (Docker Hub creds with
# DHI access). GHCR uses the built-in GITHUB_TOKEN.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: "Single image name to build (empty = all definitions)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Which definitions does this event touch? Emits a JSON array of image names
  # for the build matrix. PR: diff vs base. push: diff vs previous commit.
  # dispatch: the named image, or all definitions when left blank.
  changes:
    name: affected definitions
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.detect.outputs.names }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DISPATCH_IMAGE: ${{ github.event.inputs.image }}
        run: |
          set -euo pipefail
          all_defs() { find image -mindepth 1 -maxdepth 1 -type d -exec test -f '{}/image.yaml' ';' -print | cut -d/ -f2; }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$DISPATCH_IMAGE" ]; then names=$(printf '%s\n' "$DISPATCH_IMAGE")
            else names=$(all_defs); fi
          elif [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            names=$(printf '%s\n' "$changed" | awk -F/ '$1=="image" && NF>=3 && $3=="image.yaml"{print $2}' | sort -u)
            # A VEX change must be validated against the images its statements
            # actually name — the whole point of the gate on such a PR is to
            # prove the statement suppresses the finding it claims to. Derive
            # them from the product purls (pkg:oci/<name>?...). Every statement
            # is considered, not just the changed ones: trivy is handed the
            # whole directory via --vex, so any edit changes the gate input for
            # every image the directory covers.
            if printf '%s\n' "$changed" | grep -q '^triage/vex/'; then
              names="$names $(jq -r '.statements[]?.products[]?."@id" // empty' triage/vex/*.json 2>/dev/null \
                | sed -nE 's#^pkg:oci/([^@?/]+).*#\1#p' | sort -u)"
            fi
            # Canary: a change to the gate itself touches no definition — build
            # the simplest image so the gate is exercised on the PR changing it.
            if printf '%s\n' "$changed" | grep -qE '^\.github/workflows/build\.yml$'; then
              names="$names hardened-app"
            fi
            # An accepted-risk file names its image in its own filename, so a
            # change to one rebuilds exactly that image. Without this the gate
            # never re-runs against the exception, and "it suppresses what it
            # claims" stays an assumption (Req 6.9).
            names="$names $(printf '%s\n' "$changed" \
              | sed -nE 's#^triage/accepted-risk/([^/]+)\.ya?ml$#\1#p')"
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range="HEAD~1...HEAD"; else range="${BEFORE}...${GITHUB_SHA}"; fi
            names=$(git diff --name-only $range -- image/ | awk -F/ 'NF>=3 && $3=="image.yaml"{print $2}' | sort -u)
          fi

          json=$(printf '%s\n' $names | jq -R . | jq -s -c 'map(select(length>0)) | unique')
          echo "names=$json" >> "$GITHUB_OUTPUT"
          if [ "$json" = "[]" ]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi
          echo "affected: $json"

  release:
    name: build ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io/mm-weber/dhc
      id-token: write    # cosign keyless (GitHub OIDC)
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.changes.outputs.names) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # QEMU is belt-and-suspenders: the DHI frontend cross-compiles (GOARCH),
      # so arm64 image assembly runs no arm64 code — but multi-platform buildx
      # expects it available.
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: log in to dhi.io (frontend + builder pulls)
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: log in to ghcr.io
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags come from the definition (Req 2.3): image: is the repo, tags: the
      # semver/os suffixes. Full refs = <image>:<each tag>.
      - id: meta
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          f="image/${NAME}/image.yaml"
          # tr strips quotes so this works under either yq (mikefarah on the
          # runner emits raw scalars; python-yq would quote them).
          img=$(yq '.image' "$f" | tr -d '"')
          echo "image=$img" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<TAGS'
            yq '.tags[]' "$f" | tr -d '"' | sed "s#^#${img}:#"
            echo TAGS
          } >> "$GITHUB_OUTPUT"

      # The build verifies the checksum only for the arch it builds, and the PR
      # gate builds amd64 only (see `load:` below — it needs a single platform).
      # So an arm64 pin can enter the repo unexercised and first be tested by a
      # release build after merge. grafana 13.1.1 shipped exactly that: both pins
      # hand-supplied, neither arch fetched. This checks every pinned arch
      # against the bytes upstream actually serves (Req 1.3, Req 2.1).
      # Definitions with no per-arch pin skip in milliseconds.
      - name: verify per-arch pinned checksums
        env:
          NAME: ${{ matrix.name }}
        run: scripts/verify-arch-pins.sh "image/${NAME}"

      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: image/${{ matrix.name }}
          file: image/${{ matrix.name }}/image.yaml
          # PR gate builds amd64 only — fast feedback that the definition
          # compiles. The release path (main) builds both arches per Req 2.1;
          # arm64 there goes through the frontend cross-compile / emulation
          # once, at merge, where the cost belongs.
          platforms: ${{ github.ref == 'refs/heads/main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.ref == 'refs/heads/main' }}
          # PR builds single-arch amd64, so load it into the docker daemon for the
          # scan gate below; a multi-arch main build can't be loaded, and there
          # the rescan cron (task 7.2) covers the pushed image instead.
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Warm the Go module + compile layers across runs so repeat builds of
          # a large upstream (cert-manager) aren't cache-cold every time.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # BuildKit SLSA provenance, attached only when we push (Req 2.2).
          provenance: ${{ github.ref == 'refs/heads/main' && 'mode=max' || 'false' }}

      # ---- PR-only: CVE scan gate (Req 6.1, 6.6) ----
      # Real tools do the work: Trivy suppresses via our OpenVEX and reports the
      # remaining HIGH/CRITICAL; Grype corroborates a CRITICAL; a jq count is the
      # only glue. Authoring VEX statements is task 7.3 — here we just consume them.
      - name: install trivy + grype
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # Installed as the runner user into a temp dir on PATH, not as root
          # into /usr/local/bin. The old form piped a remote script straight
          # into `sudo sh`; fetching two pinned binaries never needed root, and
          # dropping it removes the reason that install was dangerous rather
          # than just the branch it came from.
          mkdir -p "${RUNNER_TEMP}/bin"
          scripts/install-scanners.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      # Trivy builds the `pkg:oci/...` product purl a VEX statement has to match
      # out of the image's RepoDigest. A buildx `load:` image has none — never
      # pushed, never pulled — so on the PR path the CycloneDX root component
      # came out with a random UUID and no purl at all, and EVERY OpenVEX
      # statement silently matched nothing. Not the statement's shape: with no
      # root purl, no product identifier in any form matches, verified across
      # digest-pinned, registry-qualified and bare. Upstream: trivy#9399.
      #
      # A push is the only thing that mints a RepoDigest, and pushing also
      # records it on the daemon's own copy — so the govulncheck step below
      # keeps exporting the same image, untouched. Throwaway registry, dropped
      # with the runner.
      - name: local registry — give the image an identity VEX can match
        id: localreg
        if: github.event_name == 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          docker run -d --rm -p 5000:5000 --name dhc-localreg \
            registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373 >/dev/null
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:5000/v2/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          src=$(printf '%s\n' "$TAGS" | head -n1)
          ref="localhost:5000/mm-weber/dhc/${NAME}:scan"
          docker tag "$src" "$ref"
          docker push -q "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "scanning $ref (RepoDigest: $(docker image inspect "$ref" --format '{{index .RepoDigests 0}}'))"

      - name: Trivy scan (VEX + accepted risk)
        id: trivy
        if: github.event_name == 'pull_request'
        env:
          REF: ${{ steps.localreg.outputs.ref }}
          NAME: ${{ matrix.name }}
          VEXDIR: .vexscan
        run: |
          set -euo pipefail
          ref="$REF"
          echo "scanning $ref"
          # Two suppression inputs, deliberately different in kind:
          #
          #   --vex         applicability claims — the vulnerable code cannot
          #                 execute here. Evidence-backed, published with the
          #                 image, no expiry.
          #   --ignorefile  risk decisions — it is real and we ship anyway, for a
          #                 bounded time. Internal, never attested (Req 6.8), and
          #                 it expires (Req 6.9).
          #
          # They compose in one scan and the report's Source field tells them
          # apart, which is what lets the summary below keep them apart too.
          # An empty triage/vex/ and a missing accepted-risk file excuse nothing,
          # so every HIGH/CRITICAL counts — the correct default.
          # The image now lives at localhost:5000, so its purl carries
          # repository_url=localhost:5000/... while our statements name
          # ghcr.io/... — and Trivy requires that qualifier to match exactly.
          # So scan against copies with the qualifiers dropped: a bare
          # `pkg:oci/<name>` matches any registry (verified), while the
          # PUBLISHED statements stay precisely scoped and are what cosign
          # attests on the release path.
          #
          # This blinds the gate to exactly one field, and nothing else —
          # measured, not assumed: with qualifiers stripped it still catches a
          # wrong image name, a near-miss name, a wrong purl type and a wrong
          # subcomponent. scripts/lint-vex-product.sh is what covers the
          # registry host, by exact string comparison against the definition's
          # `image:` — a stronger check than "did a finding disappear".
          #
          # Delete this whole rewrite when trivy#9399 ships.
          mkdir -p "$VEXDIR"
          vex=()
          for f in triage/vex/*.json; do
            if [ -e "$f" ]; then
              out="${VEXDIR}/$(basename "$f")"
              jq '(.statements[]?.products[]?."@id") |= split("?")[0]' "$f" > "$out"
              vex+=(--vex "$out")
            fi
          done
          accepted="triage/accepted-risk/${NAME}.yaml"
          ignore=()
          if [ -f "$accepted" ]; then ignore=(--ignorefile "$accepted"); fi
          # One scan → JSON of the POST-suppression findings. --show-suppressed
          # keeps the suppressed ones in the report under
          # ExperimentalModifiedFindings (verified: it does NOT put them back
          # into .Vulnerabilities, so the gate counts below are unaffected).
          # Without it, a statement or exception that silently fails to match
          # looks exactly like one that worked. exit-code 0 keeps us in control:
          # the Grype second opinion must still run when a CRITICAL is present.
          trivy image "${vex[@]}" "${ignore[@]}" \
            --severity HIGH,CRITICAL \
            --pkg-types os,library \
            --show-suppressed \
            --format json --output trivy.json \
            --no-progress --exit-code 0 "$ref"
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")]     | length' trivy.json)
          crit=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy.json)
          echo "high=$high" >> "$GITHUB_OUTPUT"
          echo "crit=$crit" >> "$GITHUB_OUTPUT"
          {
            echo "### Trivy — ${ref}"
            echo
            echo "Uncovered: **${crit} CRITICAL**, **${high} HIGH**"
            echo
            # Split by Source, not by eyeball: the two lanes answer different
            # questions and conflating them in one "suppressed" count is how a
            # business decision starts reading like a technical claim.
            echo "#### Not affected — VEX (published with the image)"
            echo
            # Source names the rewritten copy, not triage/vex/ — match on the
            # scan directory or this table silently reads empty even when the
            # suppression worked, which is the failure mode it exists to expose.
            if jq -e --arg vexdir "${VEXDIR}/" '[.Results[]?.ExperimentalModifiedFindings[]?
                       | select(.Source // "" | startswith($vexdir))] | length > 0' \
                 trivy.json >/dev/null; then
              echo "| CVE | Status | Justification | Package |"
              echo "|---|---|---|---|"
              jq -r --arg vexdir "${VEXDIR}/" '.Results[]?.ExperimentalModifiedFindings[]?
                     | select(.Source // "" | startswith($vexdir))
                     | "| \(.Finding.VulnerabilityID) | \(.Status) | \(.Statement // "-") | \(.Finding.PkgName) |"' \
                 trivy.json | sort -u
            else
              # From the array already built above, not a fresh glob: an empty
              # triage/vex/ makes `ls *.json` fail, and under `set -euo pipefail`
              # that kills the step before the summary is ever written.
              vexn=$(( ${#vex[@]} / 2 ))
              echo "_none_ — ${vexn} statement(s) on file."
              if [ "$vexn" -gt 0 ]; then
                echo "> ⚠️ Statements exist but suppressed nothing here — the product identifier below is what they must match."
              fi
            fi
            echo
            echo "#### Accepted risk — time-boxed, internal only"
            echo
            if jq -e '[.Results[]?.ExperimentalModifiedFindings[]?
                       | select(.Source // "" | startswith("triage/accepted-risk/"))] | length > 0' \
                 trivy.json >/dev/null; then
              echo "| CVE | Decision | Package |"
              echo "|---|---|---|"
              jq -r '.Results[]?.ExperimentalModifiedFindings[]?
                     | select(.Source // "" | startswith("triage/accepted-risk/"))
                     | "| \(.Finding.VulnerabilityID) | \(.Statement // "-") | \(.Finding.PkgName) |"' \
                 trivy.json | sort -u
              echo
              # Owner and expiry live in the file, not in Trivy's report. Shown
              # verbatim so a reviewer sees who carries this and until when
              # without leaving the summary.
              echo "<details><summary><code>${accepted}</code></summary>"
              echo
              echo '```yaml'
              cat "$accepted"
              echo '```'
              echo
              echo "</details>"
            elif [ -f "$accepted" ]; then
              echo "_none_ — \`${accepted}\` exists but suppressed nothing here."
              echo "> ⚠️ Either the findings it covers are already gone (drop the entries) or its \`purls\`/\`id\` do not match."
            else
              echo "_none_ ✓"
            fi
            echo
            # The identifier a statement's `products[].@id` has to match, taken
            # from the same report the gate just used so it cannot drift from
            # what Trivy actually saw. Emitted every run, not just on mismatch:
            # it is what you copy when authoring the next statement, and a wrong
            # product purl is the one VEX defect that produces no error at all.
            # (Drop the @sha256 digest when writing it down — the digest changes
            # every build, and a digestless purl still matches.)
            # Failure used to be swallowed by `2>/dev/null || true`, so a run
            # that printed "<unavailable>" gave no way to find out why. Keep the
            # step non-fatal, but say what went wrong.
            if ! conv=$(trivy convert --format cyclonedx --output cdx.json trivy.json 2>&1); then
              printf '%s\n' "$conv" > convert.err
            fi
            echo "#### Product identifier for this image"
            echo
            echo '```'
            jq -r '.metadata.component.purl // "<unavailable>"' cdx.json 2>/dev/null || {
              echo "<unavailable>"
              echo "-- trivy convert said:"
              head -5 convert.err 2>/dev/null || echo "-- (convert reported no error; cdx.json has no metadata.component.purl)"
            }
            echo '```'
            echo
            # When the identifier above is unavailable, a `pkg:oci/...` product
            # has nothing to match against and every VEX statement silently
            # misses — one cause, two symptoms. Trivy builds that purl from what
            # it thinks the artifact IS, so print that: an image built with
            # `load: true` and never pushed has no RepoDigest, which is the
            # first thing to rule in or out.
            echo "<details><summary>what Trivy matched against</summary>"
            echo
            echo '```'
            jq -r '{ArtifactName, ArtifactType,
                    RepoTags: (.Metadata.RepoTags // []),
                    RepoDigests: (.Metadata.RepoDigests // []),
                    ImageID: (.Metadata.ImageID // "")}
                   | to_entries[] | "\(.key): \(.value | tostring)"' trivy.json
            echo "--- cyclonedx root component ---"
            jq -r '.metadata.component // "<no root component>"' cdx.json 2>/dev/null || echo "<cdx.json unreadable>"
            echo '```'
            echo
            echo "</details>"
            echo
            # The OTHER half of a VEX statement. A statement names a product and
            # a subcomponent, and until now the gate printed only the product —
            # so the subcomponent purl was still hand-written from the package
            # name and could be wrong in exactly the same silent way. Taken from
            # the same report, versionless, which is the form that survives a
            # rebuild.
            if [ $((crit + high)) -gt 0 ]; then
              echo "#### Subcomponent identifiers (uncovered findings)"
              echo
              echo '```'
              jq -r '[.Results[]?.Vulnerabilities[]?.PkgIdentifier.PURL // empty]
                     | map(split("@")[0]) | unique[]' trivy.json
              echo '```'
              echo
            fi
            # The surviving findings, named. A bare count means downloading an
            # artifact to learn what to triage; this is the list you act on.
            echo "#### Still uncovered"
            echo
            if [ $((crit + high)) -gt 0 ]; then
              # Target = the binary the finding is in, and on a repackage image
              # that is the whole triage question: a module in the main
              # entrypoint and the same module in a bundled plugin are different
              # exposures with different treatments. It is in the report already
              # — carrying it here is what stops the per-binary breakdown from
              # being reassembled by hand every pass.
              echo "| CVE | Severity | Package | Installed | Fixed | Binary |"
              echo "|---|---|---|---|---|---|"
              # Dedup in jq, not with a trailing `sort -u` — that re-sorted
              # alphabetically and silently threw away the CRITICAL-first order
              # this sort_by exists to produce.
              jq -r '[.Results[]? | .Target as $t | .Vulnerabilities[]? | . + {Target: $t}]
                     | unique_by([.VulnerabilityID, .Target, .PkgName])
                     | sort_by(.Severity != "CRITICAL", .Target, .VulnerabilityID)[]
                     | "| \(.VulnerabilityID) | \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "-") | \(.Target) |"' \
                 trivy.json
            else
              echo "_none_ ✓"
            fi
          # tee, not >>: the job summary is the only place this table exists, and
          # a summary is not readable through the API without Checks scope — the
          # scan artifacts aren't either. Triage then waits on output the run
          # already produced. The log is readable, so send it to both.
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ---- PR-only: reachability evidence (Req 6.13) ----
      # Trivy and Grype answer "is this module linked". govulncheck -mode=binary
      # reads the binary's symbol table and answers "is the vulnerable code
      # called" — the only question that can settle an advisory whose
      # applicability turns on one wired-in symbol, and the one Req 6.14 hangs a
      # prohibition on.
      #
      # continue-on-error is the declaration that this is EVIDENCE, NOT A GATE.
      # Trivy is the only thing that fails a build. A reachability tool that can
      # also break CI is a second gate nobody designed, and its false negatives
      # would then be silently passing images.
      - name: govulncheck reachability (Req 6.13)
        id: govulncheck
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -uo pipefail
          ref=$(printf '%s\n' "$TAGS" | head -n1)
          go version
          go install golang.org/x/vuln/cmd/govulncheck@latest
          PATH="$(go env GOPATH)/bin:$PATH"; export PATH

          # Export the image filesystem rather than guessing paths: which Go
          # binaries an upstream tarball ships is exactly what we do not know in
          # advance — bundled plugins are how the last three findings arrived.
          cid=$(docker create "$ref")
          mkdir -p rootfs gv
          docker export "$cid" | tar -x --no-same-owner --no-same-permissions \
            --exclude 'dev/*' --exclude 'proc/*' --exclude 'sys/*' -C rootfs || true
          docker rm -f "$cid" >/dev/null

          # -size +1M skips the shell utilities and keeps this to plausible Go
          # binaries; `go version -m` is the actual test, and it fails fast on
          # anything that is not one.
          args=()
          while IFS= read -r f; do
            go version -m "$f" >/dev/null 2>&1 || continue
            rel=${f#rootfs/}
            out="gv/$(printf '%s' "$rel" | tr '/' '_').json"
            # govulncheck exits non-zero when it FINDS something, so its exit
            # status is not an error signal here.
            govulncheck -mode=binary -format json "$f" > "$out" 2>/dev/null || true
            if [ -s "$out" ]; then args+=("${rel}=${out}"); fi
          done < <(find rootfs -type f -perm -u+x -size +1M 2>/dev/null)

          # Drop the export before anything else runs. A repackage image is
          # ~1.1 GB and this doubles it on disk; the first run left 94 MB free
          # and the NEXT step died — grype could not write its vulnerability DB
          # ("database or disk is full"). Non-gating means this step cannot fail
          # the build, not that it cannot break the one after it.
          rm -rf rootfs
          df -h / | tail -1

          {
            echo "### govulncheck — ${ref}"
            echo
            if [ "${#args[@]}" -eq 0 ]; then
              echo "_no Go binaries found in this image._"
            else
              scripts/govulncheck-report.sh "${args[@]}"
              echo
              echo "> \`symbol\` forbids a \`not_affected\` /"
              echo "> \`vulnerable_code_not_in_execute_path\` statement (Req 6.14)."
              echo "> \`not measured\` is silence, not absence — a stripped binary looks the same."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Grype second opinion (CRITICAL present)
        if: github.event_name == 'pull_request' && steps.trivy.outputs.crit != '0'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          ref=$(printf '%s\n' "$TAGS" | head -n1)
          # A different DB + matcher corroborating Trivy's CRITICAL (Req 6.6);
          # informational — the authoritative gate is the Trivy result below.
          grype "$ref" -o table | tee grype.txt
          {
            echo "### Grype second opinion — ${ref}"
            echo '```'
            cat grype.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan gate — fail on uncovered HIGH/CRITICAL
        if: github.event_name == 'pull_request'
        env:
          HIGH: ${{ steps.trivy.outputs.high }}
          CRIT: ${{ steps.trivy.outputs.crit }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          if [ "${CRIT:-0}" -gt 0 ] || [ "${HIGH:-0}" -gt 0 ]; then
            echo "::error::${NAME}: ${CRIT} CRITICAL / ${HIGH} HIGH uncovered (Req 6.1). Four ways out, strongest first: avoid (drop the component) · fix (version bump, Req 6.5) · prove it does not apply (OpenVEX in triage/vex/, Req 6.4) · accept or transfer for a bounded time (triage/accepted-risk/${NAME}.yaml, Req 6.7). An expired exception counts as uncovered."
            exit 1
          fi
          echo "${NAME}: no uncovered HIGH/CRITICAL ✓"

      - name: upload scan reports
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-${{ matrix.name }}
          path: |
            trivy.json
            grype.txt
          if-no-files-found: ignore

      # ---- release-only: sign + SBOM (main branch) ----
      - name: install cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: cosign sign (keyless)
        if: github.ref == 'refs/heads/main'
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: generate SPDX SBOM (Syft)
        if: github.ref == 'refs/heads/main'
        uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: attest SBOM to image
        if: github.ref == 'refs/heads/main'
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      - name: attest OpenVEX to image (Req 6.4)
        if: github.ref == 'refs/heads/main'
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          # A triage decision is only portable if it travels with the artifact:
          # the statement in git is the source, the attestation is what a
          # downstream consumer can actually verify against the digest they run.
          #
          # Only statements naming THIS image are attached. A VEX document is a
          # claim about a specific product, so attaching grafana's statements to
          # cert-manager would not be noise, it would be a false claim. Matching
          # is anchored on the purl name so `grafana` cannot swallow a future
          # `grafana-agent`.
          shopt -s nullglob
          n=0
          for f in triage/vex/*.json; do
            if jq -e --arg n "$NAME" \
                 '[.statements[]?.products[]?."@id" // empty] | any(test("^pkg:oci/" + $n + "([@?]|$)"))' \
                 "$f" >/dev/null; then
              echo "attesting $(basename "$f")"
              cosign attest --yes --type openvex --predicate "$f" "$REF"
              n=$((n + 1))
            fi
          done
          echo "${NAME}: ${n} OpenVEX statement(s) attested" >> "$GITHUB_STEP_SUMMARY"

      # Req 2.4: the pushed package must be private. Fail hard if public;
      # a private repo makes new packages private by construction, so an
      # indeterminate lookup is a warning, not a failure.
      - name: verify package is private
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          enc="dhc%2F${NAME}"
          vis=$(gh api "/users/mm-weber/packages/container/${enc}" -q '.visibility' 2>/dev/null || echo unknown)
          case "$vis" in
            public)  echo "::error::package dhc/${NAME} is PUBLIC — release requires private (Req 2.4)"; exit 1 ;;
            private) echo "package dhc/${NAME} visibility: private" ;;
            *)       echo "::warning::could not determine visibility for dhc/${NAME} (private-by-construction from a private repo)" ;;
          esac
