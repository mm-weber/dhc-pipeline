# yamllint config for the convention gate (Req 7.2).
# Errors fail CI; line-length stays a warning to keep review focus on
# substance (long digest-pinned references are expected in this repo).
extends: default

rules:
  line-length:
    max: 120
    level: warning
  document-start: disable
  truthy:
    # allow GitHub workflow `on:` keys
    check-keys: false
  comments:
    min-spaces-from-content: 1

ignore: |
  data/
  temp/
  chart/*/templates/
