# Owned chart: the hardening is baked into the defaults (no overlay). Digest
# tracks the published catalogue image; Renovate's chart-pin manager (task 8.7)
# keeps tag and digest current — before it existed this claim was false, and
# the pinned digest sat a rebuild behind the registry (issue #64).
image:
  repository: ghcr.io/mm-weber/dhc/hardened-app
  tag: 0.1.1-alpine3.23
  digest: sha256:f0227cff54cbeff9162c48c714eef9b635aac2f95f33c96bd6505ca2e76fa050

replicaCount: 1
port: 8080

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

# Restricted PSS (Req 4.3), matching the runtime image (nonroot 65532).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
