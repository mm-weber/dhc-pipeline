    digest: sha256:2d64fa84faa0010ea657eef66253a106a06c698a88c07058ec4ce83e1a708844
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

# --- cainjector ---
cainjector:
  image:
    repository: ghcr.io/mm-weber/dhc/cert-manager-cainjector
    tag: 1.21.2-alpine3.23
    digest: sha256:73c5f45539103a5d99033c171278dc1e5de74c977cb3b1f240b5eedd75b03705
  securityContext:
