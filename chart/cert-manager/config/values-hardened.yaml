# Hardening overlay for the upstream cert-manager chart (Req 4.2, 4.3).
# Applied with `-f`; upstream templates are untouched. Every delta below is
# documented with its rationale in ../README.md.
#
# Digests are the published catalogue images (ghcr.io/mm-weber/dhc). Renovate's
# chart-pin manager (task 8.7) keeps tag and digest current; hand-bumps are
# CVE-only. The three pins move together (one upstream release, grouped PR).

# --- controller (top-level image + pod securityContext) ---
image:
  repository: ghcr.io/mm-weber/dhc/cert-manager-controller
  tag: 1.21.1-alpine3.23
  digest: sha256:6b9a26f66e16a30f88267dff491717dd3bf8779c3cc7f759a6c7f295f374730e
securityContext:
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# --- webhook ---
webhook:
  image:
    repository: ghcr.io/mm-weber/dhc/cert-manager-webhook
    tag: 1.21.1-alpine3.23
    digest: sha256:29f8d487f76e4ad7d7acc08c49cb508bc3acbe4aa537d001359b96fa5c5eb7cc
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

# --- cainjector ---
cainjector:
  image:
    repository: ghcr.io/mm-weber/dhc/cert-manager-cainjector
    tag: 1.21.1-alpine3.23
    digest: sha256:2187e32e8d7c6fdb14ce30605e7683d1517c15620bfc645d1d17abf4375f8d8a
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

# startupapicheck runs a post-install Job from cert-manager-startupapicheck,
# an image this catalogue does not build. Disable it (optional API validation)
# rather than pull a non-catalogue image, which the registry policy forbids.
startupapicheck:
  enabled: false
