    digest: sha256:5cfd534b96dd09ab7b74b433dc000d30a8929bc4a30f56de32b1a15ef53e40bb
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

# --- cainjector ---
cainjector:
