    repository: ghcr.io/mm-weber/dhc/cert-manager-webhook
    tag: 1.21.1-alpine3.23
    digest: sha256:487fe41a4c8db54aca186c8d7fddfe4b55a1eb80096fd4208ad6fb55bded8b66
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

# --- cainjector ---
cainjector:
  image:
    repository: ghcr.io/mm-weber/dhc/cert-manager-cainjector
    tag: 1.21.1-alpine3.23
    digest: sha256:47acdc604da6831434409d4e75ed94f49f8e2ab6a4143affb89cd9bd3cbbe22f
  securityContext:
