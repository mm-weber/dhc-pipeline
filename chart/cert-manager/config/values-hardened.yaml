    tag: 1.21.2-alpine3.23
    digest: sha256:3e4f3a0c796a9c95527b2724a03aecd4caa5df3855545674d60ef03cc7d33425
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

# --- cainjector ---
cainjector:
  image:
    repository: ghcr.io/mm-weber/dhc/cert-manager-cainjector
    tag: 1.21.2-alpine3.23
