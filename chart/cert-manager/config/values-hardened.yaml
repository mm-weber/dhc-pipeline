    digest: sha256:4793ba1c83a906ff7bf1cd66ab4194e182dcf014b2a0b1354feb50aa31033232
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

# --- cainjector ---
cainjector:
  image:
    repository: ghcr.io/mm-weber/dhc/cert-manager-cainjector
    tag: 1.21.1-alpine3.23
