    digest: sha256:12ab7ee8f9b79d9b5f9dab1afc5e01111ec3407020c7914abf9d4f8cde1c44cf
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

# --- cainjector ---
cainjector:
  image:
    repository: ghcr.io/mm-weber/dhc/cert-manager-cainjector
    tag: 1.21.2-alpine3.23
