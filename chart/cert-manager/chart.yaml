# Pinned upstream chart (Req 4.1). Templates are NEVER edited, forked, or
# patched: the chart is rendered live from this exact version with
# config/values-hardened.yaml as the only overlay. Renovate's helm-datasource
# manager tracks `version` against the chart repository and opens a
# never-automerged bump PR that runs the e2e upgrade path (Req 3.11); the
# chart-pin managers track the IMAGE pins in the values overlay, which may run
# a patch ahead of these templates between a definition bump and the chart's
# next release (Req 3.12).
upstream:
  name: cert-manager
  repository: https://charts.jetstack.io
  version: v1.21.1

# The definitions this chart deploys (task 14.2, Req 1.14, 5.2): the e2e
# matrix maps a changed definition to its chart-backed component through this
# list, and the probe lint (14.3) reads it too. One chart, three images.
deploys:
  - cert-manager-controller
  - cert-manager-webhook
  - cert-manager-cainjector

# The functional probe the e2e suite runs once the pods are Ready (task 14.3,
# Req 5.5, 5.8): a registration name test/e2e's `probes` registry resolves.
# One probe for the three images: a SelfSigned Issuer signs a Certificate and
# the probe waits for it to go Ready, which only happens when controller,
# webhook and cainjector all work.
probe: certificate-issuance

# Render (chart CI gate, task 5.5) and install (e2e, phase 6):
#   helm template dhc-cert-manager cert-manager \
#     --repo https://charts.jetstack.io --version <the version above> \
#     -f chart/cert-manager/config/values-hardened.yaml
