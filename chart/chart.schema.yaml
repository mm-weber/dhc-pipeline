# yamale schema for chart/<name>/chart.yaml, the pinned upstream chart and,
# where a chart needs one, the compat-variant decision (Req 4.1, 4.5;
# task 11.4). validate.yml runs `yamale -s chart/chart.schema.yaml` over the
# three upstream pins. The dates are validated as dates here; whether the
# review-by date has passed is scripts/lint-compat.sh's question (Req 4.8),
# because a yamale day() constraint is a static literal with no notion of
# today (measured; independent review 1.5).
#
# `deploys` (task 14.2, Req 1.14, 5.2) names the definition directories the
# chart deploys; every chart directory declares it, the owned chart included,
# which is why `upstream` is optional here: chart/hardened-app/chart.yaml has
# no upstream pin (Chart.yaml beside it is Helm's own). scripts/render-chart.sh
# still refuses an adapted chart without one. scripts/lint-active-set.sh
# checks each entry names an existing definition.
upstream: include('upstream', required=False)
deploys: list(str(), min=1)
# `probe` (task 14.3, Req 5.5, 5.8) names the functional probe the e2e suite
# runs once the chart's pods are Ready, a registration in test/e2e's `probes`
# map. Optional here on purpose: scripts/lint-probes.sh fails an ACTIVE
# definition whose chart declares none, and a required field would only
# invite a placeholder (a probe that passes by doing nothing).
probe: str(required=False)
compat: include('compat', required=False)
---
upstream:
  name: str()
  repository: str()
  version: str()
compat:
  variant: str()
  reason: str()
  issue: str()
  decided_at: day()
  review_by: day()
